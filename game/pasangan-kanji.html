<style>
/* Layout: panel kontrol di atas, papan kartu 4 kolom di tengah, hasil muncul di atas papan */
:root{
  --bg:#f0eef2; --surface:#ffffff; --ink:#221a2a; --muted:#6f6479; --line:#dcd5e2;
  --accent:#8a2f5a; --accent-ink:#ffffff; --tint:#f1dce8; --wave:#d9c3d1;
  --back:#8a2f5a; --back2:#a8487a;
  --ok:#1f7a45; --ok-bg:#d6efdf; --bad:#b3342f;
  --font-display:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --font-body:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171119; --surface:#241a28; --ink:#f1e9f5; --muted:#b5a6bf; --line:#3a2c40;
  --accent:#e08ab4; --accent-ink:#171119; --tint:#3b2540; --wave:#5a3d63;
  --back:#6d2a50; --back2:#8c3b6a;
  --ok:#7fdca5; --ok-bg:#173a27; --bad:#ff8c85; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171119; --surface:#241a28; --ink:#f1e9f5; --muted:#b5a6bf; --line:#3a2c40;
  --accent:#e08ab4; --accent-ink:#171119; --tint:#3b2540; --wave:#5a3d63;
  --back:#6d2a50; --back2:#8c3b6a;
  --ok:#7fdca5; --ok-bg:#173a27; --bad:#ff8c85; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin-inline:auto;display:grid;gap:14px}
h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.15}
h1 small{display:block;font-family:var(--font-body);font-weight:500;font-size:.78rem;letter-spacing:.08em;color:var(--muted);margin-top:4px;text-transform:uppercase}
.ctl{display:grid;gap:8px}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp .lab{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;min-width:64px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:500;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stats{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--ink)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:6px 14px;font-weight:700}
.win{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok);border-radius:12px;padding:12px 16px}
.win b{display:block;font-family:var(--font-display);font-size:1.2rem}
.boardbox{container-type:inline-size;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
#board{--gap:8px;--u:calc((100cqw - 3 * var(--gap)) / 4);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.card{display:block;width:100%;aspect-ratio:3/4;perspective:700px;border:0;background:none;padding:0;min-width:0}
.in{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .35s}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;text-align:center;overflow:hidden}
.b{background:var(--back);
  background-image:radial-gradient(circle at 50% 130%,transparent 42%,var(--back2) 43% 50%,transparent 51%),radial-gradient(circle at 0% 130%,transparent 42%,var(--back2) 43% 50%,transparent 51%),radial-gradient(circle at 100% 130%,transparent 42%,var(--back2) 43% 50%,transparent 51%);
  background-size:26px 14px;box-shadow:inset 0 0 0 2px var(--surface)}
.f{background:var(--bg);border:2px solid var(--line);transform:rotateY(180deg)}
.card.done .f{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.card.miss .f{border-color:var(--bad)}
.k{font-family:var(--font-display);font-weight:600;line-height:1.1;font-size:clamp(14px,calc(var(--u) * .8 / var(--len)),36px)}
.y{font-family:var(--font-display);font-weight:600;line-height:1.15;font-size:clamp(11px,calc(var(--u) * .74 / var(--len)),24px)}
.r{font-size:clamp(8px,calc(var(--u) * .15),11px);color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.card.done .r{color:var(--ok)}
.a{font-size:clamp(10px,calc(var(--u) * .21),15px);font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.foot{color:var(--muted);font-size:.82rem;margin:0}
@media (prefers-reduced-motion:reduce){.in{transition:none}}


/* Qategori standalone game shell */
html { min-height: 100%; background: var(--bg); }
body {
  min-height: 100vh;
  min-height: 100svh;
  margin: 0 !important;
  padding: 0 !important;
  box-sizing: border-box;
  overflow-x: hidden;
}
.game-topbar {
  position: sticky;
  top: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 54px;
  padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
  box-sizing: border-box;
  background: var(--surface);
  color: var(--ink);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 2px 10px rgba(0,0,0,.05);
}
.game-topbar .game-brand {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  font: 800 14px/1.2 var(--font-body);
  letter-spacing: .02em;
}
.game-topbar .game-brand .game-mark {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
  border-radius: 9px;
  background: var(--tint);
  color: var(--accent);
  font-size: 16px;
}
.game-topbar .game-brand span:last-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.game-topbar .game-exit {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 38px;
  padding: 0 13px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--bg);
  color: var(--ink);
  text-decoration: none;
  font: 700 13px/1 var(--font-body);
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.game-topbar .game-exit:active { transform: scale(.98); }
.game-topbar .game-exit svg { width: 16px; height: 16px; }
.wrap {
  width: min(100%, 1120px) !important;
  max-width: 1120px !important;
  margin: 0 auto !important;
  padding: 16px clamp(12px, 3vw, 28px) max(28px, env(safe-area-inset-bottom)) !important;
  box-sizing: border-box;
}
.wrap > header { margin-top: 0 !important; }
@media (max-width: 600px) {
  .game-topbar { min-height: 50px; }
  .game-topbar .game-brand { font-size: 12px; }
  .game-topbar .game-exit { min-height: 36px; padding: 0 10px; }
  .wrap { padding-top: 12px !important; }
}
@media (prefers-reduced-motion: reduce) {
  .game-topbar .game-exit { transition: none !important; }
}

</style>

    <span>Keluar</span>

<div class="wrap">
  <header><h1>漢字ペア<small>kanji pea · pasangan kanji</small></h1></header>
  <div class="ctl">
    <div class="grp"><span class="lab">Level</span><span class="grp" id="lv" role="group" aria-label="Level"></span></div>
    <div class="grp"><span class="lab">Pasangan</span><span class="grp" id="md" role="group" aria-label="Mode"></span></div>
    <div class="grp"><span class="lab">Jumlah</span><span class="grp" id="sz" role="group" aria-label="Jumlah pasangan"></span></div>
  </div>
  <div class="stats">
    <span>Waktu <b id="time">0:00</b></span>
    <span>Langkah <b id="moves">0</b></span>
    <span>Cocok <b id="found">0/0</b></span>

    <button type="button" class="btn" id="again">Acak ulang</button>
  </div>
  <div id="winbox"></div>
  <div class="boardbox"><div id="board"></div></div>
  <p class="foot">Balik dua kartu. Kalau kanji dan pasangannya cocok, kartu tetap terbuka dan suara bacaan diputar (suara Jepang bawaan browser).</p>
</div>

<script>
/* [kanji, yomi hiragana, arti] */
var DATA={
 N5:[['水','みず','air'],['山','やま','gunung'],['川','かわ','sungai'],['火','ひ','api'],['木','き','pohon'],['月','つき','bulan'],['人','ひと','orang'],['犬','いぬ','anjing'],['猫','ねこ','kucing'],['花','はな','bunga'],['雨','あめ','hujan'],['学校','がっこう','sekolah'],['先生','せんせい','guru'],['車','くるま','mobil'],['本','ほん','buku']],
 N4:[['病院','びょういん','rumah sakit'],['意味','いみ','arti'],['質問','しつもん','pertanyaan'],['準備','じゅんび','persiapan'],['旅行','りょこう','wisata'],['会議','かいぎ','rapat'],['趣味','しゅみ','hobi'],['約束','やくそく','janji'],['経験','けいけん','pengalaman'],['運動','うんどう','olahraga'],['季節','きせつ','musim'],['空港','くうこう','bandara'],['説明','せつめい','penjelasan'],['予定','よてい','rencana']],
 N3:[['将来','しょうらい','masa depan'],['景色','けしき','pemandangan'],['習慣','しゅうかん','kebiasaan'],['相談','そうだん','konsultasi'],['挨拶','あいさつ','salam'],['事故','じこ','kecelakaan'],['成長','せいちょう','pertumbuhan'],['環境','かんきょう','lingkungan'],['経済','けいざい','ekonomi'],['禁止','きんし','larangan'],['交換','こうかん','pertukaran'],['想像','そうぞう','imajinasi'],['完全','かんぜん','sempurna'],['迷惑','めいわく','gangguan']],
 N2:[['影響','えいきょう','pengaruh'],['維持','いじ','mempertahankan'],['意識','いしき','kesadaran'],['傾向','けいこう','kecenderungan'],['貢献','こうけん','kontribusi'],['抽象','ちゅうしょう','abstrak'],['義務','ぎむ','kewajiban'],['提供','ていきょう','penyediaan'],['把握','はあく','memahami'],['徹底','てってい','menyeluruh'],['普及','ふきゅう','penyebaran'],['解消','かいしょう','penyelesaian'],['配慮','はいりょ','pertimbangan'],['承認','しょうにん','persetujuan'],['複雑','ふくざつ','rumit']],
 N1:[['払拭','ふっしょく','menghapus'],['逼迫','ひっぱく','genting'],['暫定','ざんてい','sementara'],['凌駕','りょうが','melampaui'],['懸念','けねん','kekhawatiran'],['斡旋','あっせん','mediasi'],['拘束','こうそく','pengekangan'],['趣旨','しゅし','maksud pokok'],['脆弱','ぜいじゃく','rapuh'],['顕著','けんちょ','mencolok'],['概念','がいねん','konsep'],['妥協','だきょう','kompromi'],['摩擦','まさつ','gesekan'],['渋滞','じゅうたい','kemacetan'],['活気','かっき','semarak']]
};
var LV=['N5','N4','N3','N2','N1'],MD=[['baca','Kanji ↔ cara baca'],['arti','Kanji ↔ arti']],SZ=[6,8,10];
var level='N5',mode='baca',size=6,cards=[],opn=[],lock=false,moves=0,found=0,t0=0,tick=null,over=false;
var $=function(id){return document.getElementById(id);};

/* kana -> romaji (Hepburn) */
var ROWS=[['','あいうえお'],['k','かきくけこ'],['s','さしすせそ'],['t','たちつてと'],['n','なにぬねの'],['h','はひふへほ'],['m','まみむめも'],['y','や_ゆ_よ'],['r','らりるれろ'],['w','わ___を'],['g','がぎぐげご'],['z','ざじずぜぞ'],['d','だぢづでど'],['b','ばびぶべぼ'],['p','ぱぴぷぺぽ']];
var K2R={};
ROWS.forEach(function(r){for(var i=0;i<5;i++){var ch=r[1][i];if(ch!=='_')K2R[ch]=r[0]+'aiueo'[i];}});
K2R['し']='shi';K2R['ち']='chi';K2R['つ']='tsu';K2R['ふ']='fu';K2R['じ']='ji';K2R['ぢ']='ji';K2R['づ']='zu';K2R['を']='o';K2R['ん']='n';
function toRomaji(s){
  var out='',i,ch,nx,b;
  for(i=0;i<s.length;i++){
    ch=s[i];nx=s[i+1];
    if(ch==='っ'){var n2=K2R[nx]||'';out+=(n2[0]==='c'?'t':n2[0]||'');continue;}
    b=K2R[ch]||ch;
    if(nx&&'ゃゅょ'.indexOf(nx)>=0){
      var v={'ゃ':'a','ゅ':'u','ょ':'o'}[nx];
      if(b==='shi'||b==='chi')out+=b.slice(0,2)+v;else if(b==='ji')out+='j'+v;else out+=b[0]+'y'+v;
      i++;continue;
    }
    out+=b;
  }
  return out;
}

function shuffle(a){for(var j=a.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1)),t=a[j];a[j]=a[k];a[k]=t;}return a;}
function fmt(s){return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);}
function bkey(){return 'kanji-best-'+level+'-'+mode+'-'+size;}
function getBest(){try{return localStorage.getItem(bkey());}catch(e){return null;}}
function setBest(v){try{localStorage.setItem(bkey(),String(v));}catch(e){}}

/* ---------- Suara: file mp3 -> suara browser -> TTS online ---------- */
var AUD_BASE='https://bshantoz.github.io/nihongo/game/audio/';
var AUD=null,JS={au:null};
function h32(s,seed){var b=unescape(encodeURIComponent(s)),h=seed>>>0,i;for(i=0;i<b.length;i++){h^=b.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h;}
function jaKey(who,t){var s=who+'|'+t;return ('00000000'+h32(s,0x811c9dc5).toString(16)).slice(-8)+('00000000'+h32(s,0x9747b28c).toString(16)).slice(-8);}
try{fetch(AUD_BASE+'manifest.json').then(function(r){return r.ok?r.json():[];}).then(function(a){AUD={};a.forEach(function(k){AUD[k]=1;});}).catch(function(){});}catch(e){}
function jaVoices(){try{return (window.speechSynthesis&&speechSynthesis.getVoices?speechSynthesis.getVoices():[]).filter(function(x){return /^ja/i.test(x.lang);});}catch(e){return [];}}
function jaStop(){try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}try{if(JS.au)JS.au.pause();}catch(e){}}
function jaPlay(url,rate,o,onfail){
  try{
    if(!JS.au)JS.au=new Audio();
    var a=JS.au,pr=Math.min(1.25,Math.max(.6,rate/.85)),failed=false;
    var fail=function(){if(failed)return;failed=true;if(onfail)onfail();};
    a.onended=function(){if(o.end)o.end();};
    a.onerror=fail;
    a.src=url;a.defaultPlaybackRate=pr;a.playbackRate=pr;
    var p=a.play();if(p&&p.catch)p.catch(fail);
    return true;
  }catch(e){return false;}
}
function jaFallback(text,o,rate){
  var vs=jaVoices();
  if(vs.length&&window.SpeechSynthesisUtterance){
    try{
      var u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=rate;if(o.pitch)u.pitch=o.pitch;
      u.voice=o.pick?o.pick(vs):vs[0];
      if(o.end){u.onend=o.end;u.onerror=o.end;}
      speechSynthesis.speak(u);return 'browser';
    }catch(e){}
  }
  if(jaPlay('https://translate.google.com/translate_tts?ie=UTF8&client=tw-ob&tl=ja&q='+encodeURIComponent(text),rate,o,function(){if(o.end)o.end();}))return 'online';
  if(o.end)o.end();return '';
}
function jaSay(text,o){
  o=o||{};var rate=o.rate||.85;jaStop();
  var key=jaKey(o.who||'n',text);
  if(AUD&&AUD[key]&&jaPlay(AUD_BASE+key+'.mp3',rate,o,function(){jaFallback(text,o,rate);}))return 'mp3';
  return jaFallback(text,o,rate);
}
function speak(t){jaSay(t,{rate:.85,who:'n'});}

function chips(id,items,cur,attr){
  $(id).innerHTML=items.map(function(x){var v=Array.isArray(x)?x[0]:x,l=Array.isArray(x)?x[1]:(attr==='z'?x+' pasang':x);
    return '<button type="button" class="chip" data-'+attr+'="'+v+'" aria-pressed="'+(String(v)===String(cur))+'">'+l+'</button>';}).join('');
}
function buildCtl(){chips('lv',LV,level,'l');chips('md',MD,mode,'m');chips('sz',SZ,size,'z');}

function newGame(){
  var pick=shuffle(DATA[level].slice()).slice(0,size),list=[];
  pick.forEach(function(p,i){
    list.push({id:i,t:'k',k:p[0],y:p[1],m:p[2]});
    list.push({id:i,t:'o',k:p[0],y:p[1],m:p[2]});
  });
  cards=shuffle(list);opn=[];lock=false;moves=0;found=0;over=false;
  $('winbox').innerHTML='';
  t0=0;
  if(tick)clearInterval(tick);
  tick=setInterval(function(){if(t0&&!over)$('time').textContent=fmt(Math.floor((Date.now()-t0)/1000));},400);
  $('time').textContent='0:00';
  render();stats();
}
function face(c){
  if(c.t==='k')return '<span class="k" style="--len:'+Math.max(c.k.length,2)+'">'+c.k+'</span>';
  if(mode==='baca')return '<span class="y" style="--len:'+Math.max(c.y.length,3)+'">'+c.y+'</span><span class="r">'+toRomaji(c.y)+'</span>';
  return '<span class="a">'+c.m+'</span>';
}
function render(){
  $('board').innerHTML=cards.map(function(c,n){
    return '<button type="button" class="card" data-n="'+n+'" aria-label="Kartu '+(n+1)+'"><span class="in"><span class="b"></span><span class="f">'+face(c)+'</span></span></button>';
  }).join('');
}
function stats(){
  $('moves').textContent=moves;$('found').textContent=found+'/'+size;
  var b=getBest();$('best').textContent=b?fmt(+b):'-';
}
function flip(n){
  if(lock||over)return;
  var el=$('board').children[n],c=cards[n];
  if(el.classList.contains('up')||el.classList.contains('done'))return;
  if(!t0)t0=Date.now();
  el.classList.add('up');el.classList.remove('miss');opn.push(n);
  if(opn.length<2)return;
  moves++;$('moves').textContent=moves;
  var a=cards[opn[0]],b=cards[opn[1]],ea=$('board').children[opn[0]],eb=$('board').children[opn[1]];
  if(a.id===b.id&&a.t!==b.t){
    ea.classList.add('done');eb.classList.add('done');ea.classList.remove('up');eb.classList.remove('up');
    opn=[];found++;$('found').textContent=found+'/'+size;
    speak(a.y);
    if(found===size)win();
  }else{
    lock=true;ea.classList.add('miss');eb.classList.add('miss');
    setTimeout(function(){ea.classList.remove('up','miss');eb.classList.remove('up','miss');opn=[];lock=false;},950);
  }
}
function win(){
  over=true;
  var sec=Math.floor((Date.now()-t0)/1000),b=getBest(),rec=!b||sec<+b;
  if(rec)setBest(sec);
  $('time').textContent=fmt(sec);
  $('winbox').innerHTML='<div class="win" role="status"><b>Semua pasangan ketemu! 完成 (kansei)</b>'+size+' pasangan dalam '+fmt(sec)+' dan '+moves+' langkah.'+(rec?' Rekor baru untuk setelan ini.':'')+'</div>';
  stats();
}
$('lv').addEventListener('click',function(e){var b=e.target.closest('[data-l]');if(!b)return;level=b.getAttribute('data-l');buildCtl();newGame();});
$('md').addEventListener('click',function(e){var b=e.target.closest('[data-m]');if(!b)return;mode=b.getAttribute('data-m');buildCtl();newGame();});
$('sz').addEventListener('click',function(e){var b=e.target.closest('[data-z]');if(!b)return;size=+b.getAttribute('data-z');buildCtl();newGame();});
$('board').addEventListener('click',function(e){var b=e.target.closest('[data-n]');if(b)flip(+b.getAttribute('data-n'));});
$('again').addEventListener('click',newGame);
buildCtl();newGame();
</script>
</body>
