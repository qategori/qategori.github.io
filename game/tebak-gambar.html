<style>
/* Layout: kolom sempit; panel gambar besar di atas, empat pilihan di bawahnya, kotak penjelasan setelah menjawab */
:root{
  --bg:#ebf2f4; --surface:#ffffff; --ink:#142329; --muted:#527079; --line:#cfdde1;
  --accent:#0f7c86; --accent-ink:#ffffff; --tint:#d6eef0; --panel:#dcecf3; --kaki:#c8561f;
  --ok:#1f7a45; --ok-bg:#d6efdf; --bad:#b3342f; --bad-bg:#f9dad7;
  --font-display:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --font-body:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1a1e; --surface:#142a30; --ink:#e6f2f4; --muted:#9bbcc3; --line:#24424a;
  --accent:#5fd0da; --accent-ink:#0c1a1e; --tint:#17393f; --panel:#25404c; --kaki:#ff9a63;
  --ok:#7fdca5; --ok-bg:#173a27; --bad:#ff8c85; --bad-bg:#47201f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1a1e; --surface:#142a30; --ink:#e6f2f4; --muted:#9bbcc3; --line:#24424a;
  --accent:#5fd0da; --accent-ink:#0c1a1e; --tint:#17393f; --panel:#25404c; --kaki:#ff9a63;
  --ok:#7fdca5; --ok-bg:#173a27; --bad:#ff8c85; --bad-bg:#47201f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin-inline:auto;display:grid;gap:14px}
h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.15}
h1 small{display:block;font-family:var(--font-body);font-weight:500;font-size:.78rem;letter-spacing:.08em;color:var(--muted);margin-top:4px;text-transform:uppercase}
.grp{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:.88rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.top{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.top b{color:var(--ink)}.streak b{color:var(--kaki)}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.ask{margin:0;font-weight:700;color:var(--muted);font-size:.9rem}
.pic{background:var(--panel);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:14px;min-height:0}
.pic svg{width:min(60vw,220px);height:auto;display:block}
.word{background:var(--panel);border-radius:12px;padding:18px 12px;text-align:center}
.word .h{font-family:var(--font-display);font-weight:800;font-size:clamp(2rem,10vw,3rem);line-height:1.1;overflow-wrap:anywhere}
.word .r{color:var(--muted);margin-top:4px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.o{border:1.5px solid var(--line);border-radius:10px;background:var(--bg);min-height:64px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0}
.o:not(:disabled):hover{border-color:var(--accent)}
.o .h{font-family:var(--font-display);font-weight:600;font-size:1.3rem;line-height:1.2;overflow-wrap:anywhere;text-align:center}
.o .r{font-size:.8rem;color:var(--muted)}
.o.img{padding:8px;background:var(--panel)}
.o.img svg{width:100%;max-width:110px;height:auto;display:block}
.o.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.o.ok .r{color:var(--ok)}
.o.bad{background:var(--bad-bg);border-color:var(--bad)}
.o:disabled{cursor:default}
.o:disabled:not(.ok):not(.bad){opacity:.5}
.fact{border-radius:10px;background:var(--tint);padding:12px 14px;display:grid;gap:8px}
.fact .big{font-family:var(--font-display);font-weight:800;font-size:1.5rem;line-height:1.2}
.fact p{margin:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 18px;font-weight:700}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.end{text-align:center;gap:10px;justify-items:center}
.end .big{font-family:var(--font-display);font-weight:800;font-size:3rem;line-height:1}
.end .rank{font-family:var(--font-display);font-size:1.4rem;font-weight:600}
.foot{color:var(--muted);font-size:.82rem;margin:0}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}


/* Qategori standalone game shell */
html { min-height: 100%; background: var(--bg); }
body {
  min-height: 100vh;
  min-height: 100svh;
  margin: 0 !important;
  padding: 0 !important;
  box-sizing: border-box;
  overflow-x: hidden;
}
.game-topbar {
  position: sticky;
  top: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 54px;
  padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
  box-sizing: border-box;
  background: var(--surface);
  color: var(--ink);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 2px 10px rgba(0,0,0,.05);
}
.game-topbar .game-brand {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  font: 800 14px/1.2 var(--font-body);
  letter-spacing: .02em;
}
.game-topbar .game-brand .game-mark {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
  border-radius: 9px;
  background: var(--tint);
  color: var(--accent);
  font-size: 16px;
}
.game-topbar .game-brand span:last-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.game-topbar .game-exit {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 38px;
  padding: 0 13px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--bg);
  color: var(--ink);
  text-decoration: none;
  font: 700 13px/1 var(--font-body);
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.game-topbar .game-exit:active { transform: scale(.98); }
.game-topbar .game-exit svg { width: 16px; height: 16px; }
.wrap {
  width: min(100%, 1120px) !important;
  max-width: 1120px !important;
  margin: 0 auto !important;
  padding: 16px clamp(12px, 3vw, 28px) max(28px, env(safe-area-inset-bottom)) !important;
  box-sizing: border-box;
}
.wrap > header { margin-top: 0 !important; }
@media (max-width: 600px) {
  .game-topbar { min-height: 50px; }
  .game-topbar .game-brand { font-size: 12px; }
  .game-topbar .game-exit { min-height: 36px; padding: 0 10px; }
  .wrap { padding-top: 12px !important; }
}
@media (prefers-reduced-motion: reduce) {
  .game-topbar .game-exit { transition: none !important; }
}

</style>

 tokei:{k:'時計',y:'とけい',m:'jam',s:S('<circle cx="50" cy="50" r="36" fill="#fff" stroke="#333" stroke-width="5"/><g stroke="#333" stroke-width="3" stroke-linecap="round"><line x1="50" y1="20" x2="50" y2="26"/><line x1="50" y1="74" x2="50" y2="80"/><line x1="20" y1="50" x2="26" y2="50"/><line x1="74" y1="50" x2="80" y2="50"/></g><g stroke="#222" stroke-linecap="round"><line x1="50" y1="50" x2="50" y2="28" stroke-width="5"/><line x1="50" y1="50" x2="66" y2="58" stroke-width="4"/></g><circle cx="50" cy="50" r="3" fill="#d9453b"/>')},
 megane:{k:'眼鏡',y:'めがね',m:'kacamata',s:S('<g fill="#cde9f7" stroke="#333" stroke-width="5"><circle cx="30" cy="54" r="18"/><circle cx="70" cy="54" r="18"/></g><path d="M48 52 Q50 46 52 52" stroke="#333" stroke-width="4" fill="none"/><path d="M12 50 L5 40 M88 50 L95 40" stroke="#333" stroke-width="4" stroke-linecap="round"/>')},
 tamago:{k:'卵',y:'たまご',m:'telur',s:S('<path d="M50 14 C68 14 78 42 78 58 A28 28 0 0 1 22 58 C22 42 32 14 50 14Z" fill="#f7ecd6" stroke="#d6c29a" stroke-width="3"/><ellipse cx="40" cy="40" rx="5" ry="9" fill="#fff" fill-opacity=".7" transform="rotate(15 40 40)"/>')}
};
/* pasangan yang gambarnya mirip tidak ditaruh di soal yang sama */
var CLASH=[['sakura','hana'],['taiyou','hi'],['tsuki','hoshi'],['sakura','ringo']];
function clash(a,b){return CLASH.some(function(p){return (p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a);});}
var KEYS=Object.keys(W);
var MODES=[['pic','Gambar → kata'],['word','Kata → gambar']];
var mode='pic',romaji=true,N=10,round=[],i=0,score=0,streak=0,rights=0,locked=false;
var $=function(id){return document.getElementById(id);};

/* kana -> romaji */
var ROWS=[['','あいうえお'],['k','かきくけこ'],['s','さしすせそ'],['t','たちつてと'],['n','なにぬねの'],['h','はひふへほ'],['m','まみむめも'],['y','や_ゆ_よ'],['r','らりるれろ'],['w','わ___を'],['g','がぎぐげご'],['z','ざじずぜぞ'],['d','だぢづでど'],['b','ばびぶべぼ'],['p','ぱぴぷぺぽ']];
var K2R={};
ROWS.forEach(function(r){for(var j=0;j<5;j++){var ch=r[1][j];if(ch!=='_')K2R[ch]=r[0]+'aiueo'[j];}});
K2R['し']='shi';K2R['ち']='chi';K2R['つ']='tsu';K2R['ふ']='fu';K2R['じ']='ji';K2R['ぢ']='ji';K2R['づ']='zu';K2R['を']='o';K2R['ん']='n';
function toRomaji(s){
  var out='',j,ch,nx,b;
  for(j=0;j<s.length;j++){
    ch=s[j];nx=s[j+1];
    if(ch==='っ'){var n2=K2R[nx]||'';out+=(n2[0]==='c'?'t':n2[0]||'');continue;}
    b=K2R[ch]||ch;
    if(nx&&'ゃゅょ'.indexOf(nx)>=0){
      var v={'ゃ':'a','ゅ':'u','ょ':'o'}[nx];
      if(b==='shi'||b==='chi')out+=b.slice(0,2)+v;else if(b==='ji')out+='j'+v;else out+=b[0]+'y'+v;
      j++;continue;
    }
    out+=b;
  }
  return out;
}
function shuffle(a){for(var j=a.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1)),t=a[j];a[j]=a[k];a[k]=t;}return a;}
function bkey(){return 'tebak-best-'+mode;}
function getBest(){try{return +localStorage.getItem(bkey())||0;}catch(e){return 0;}}
function setBest(v){try{localStorage.setItem(bkey(),String(v));}catch(e){}}

/* ---------- Suara: file mp3 -> suara browser -> TTS online ---------- */
var AUD_BASE='https://bshantoz.github.io/nihongo/game/audio/';
var AUD=null,JS={au:null};
function h32(s,seed){var b=unescape(encodeURIComponent(s)),h=seed>>>0,i;for(i=0;i<b.length;i++){h^=b.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h;}
function jaKey(who,t){var s=who+'|'+t;return ('00000000'+h32(s,0x811c9dc5).toString(16)).slice(-8)+('00000000'+h32(s,0x9747b28c).toString(16)).slice(-8);}
try{fetch(AUD_BASE+'manifest.json').then(function(r){return r.ok?r.json():[];}).then(function(a){AUD={};a.forEach(function(k){AUD[k]=1;});}).catch(function(){});}catch(e){}
function jaVoices(){try{return (window.speechSynthesis&&speechSynthesis.getVoices?speechSynthesis.getVoices():[]).filter(function(x){return /^ja/i.test(x.lang);});}catch(e){return [];}}
function jaStop(){try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}try{if(JS.au)JS.au.pause();}catch(e){}}
function jaPlay(url,rate,o,onfail){
  try{
    if(!JS.au)JS.au=new Audio();
    var a=JS.au,pr=Math.min(1.25,Math.max(.6,rate/.85)),failed=false;
    var fail=function(){if(failed)return;failed=true;if(onfail)onfail();};
    a.onended=function(){if(o.end)o.end();};
    a.onerror=fail;
    a.src=url;a.defaultPlaybackRate=pr;a.playbackRate=pr;
    var p=a.play();if(p&&p.catch)p.catch(fail);
    return true;
  }catch(e){return false;}
}
function jaFallback(text,o,rate){
  var vs=jaVoices();
  if(vs.length&&window.SpeechSynthesisUtterance){
    try{
      var u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=rate;if(o.pitch)u.pitch=o.pitch;
      u.voice=o.pick?o.pick(vs):vs[0];
      if(o.end){u.onend=o.end;u.onerror=o.end;}
      speechSynthesis.speak(u);return 'browser';
    }catch(e){}
  }
  if(jaPlay('https://translate.google.com/translate_tts?ie=UTF8&client=tw-ob&tl=ja&q='+encodeURIComponent(text),rate,o,function(){if(o.end)o.end();}))return 'online';
  if(o.end)o.end();return '';
}
function jaSay(text,o){
  o=o||{};var rate=o.rate||.85;jaStop();
  var key=jaKey(o.who||'n',text);
  if(AUD&&AUD[key]&&jaPlay(AUD_BASE+key+'.mp3',rate,o,function(){jaFallback(text,o,rate);}))return 'mp3';
  return jaFallback(text,o,rate);
}
function speak(t){jaSay(t,{rate:.85,who:'n'});}

function buildCtl(){
  $('md').innerHTML=MODES.map(function(m){return '<button type="button" class="chip" data-m="'+m[0]+'" aria-pressed="'+(m[0]===mode)+'">'+m[1]+'</button>';}).join('');
  $('rm').innerHTML='<button type="button" class="chip" id="rmb" aria-pressed="'+romaji+'">Tampilkan romaji</button>';
}
function start(){
  var keys=shuffle(KEYS.slice()).slice(0,N);
  round=keys.map(function(k){
    var pool=shuffle(KEYS.filter(function(x){return x!==k&&!clash(x,k);}));
    var wrong=[];
    pool.forEach(function(x){if(wrong.length<3&&wrong.every(function(y){return !clash(x,y);}))wrong.push(x);});
    return {k:k,opts:shuffle([k].concat(wrong))};
  });
  i=0;score=0;streak=0;rights=0;
  $('foot').textContent='Rekor mode ini: '+getBest()+' poin. Bank soal: '+KEYS.length+' gambar.';
  show();
}
function ro(w){return romaji?'<span class="r">'+toRomaji(w.y)+'</span>':'';}
function show(){
  var r=round[i],w=W[r.k];locked=false;
  $('no').textContent=(i+1)+'/'+round.length;$('streak').textContent=streak;$('score').textContent=score;
  $('bar').style.width=(i/round.length*100)+'%';
  var h='<div class="card">';
  if(mode==='pic'){
    h+='<p class="ask">Apa nama gambar ini dalam bahasa Jepang?</p><div class="pic">'+w.s+'</div><div class="opts">'+
      r.opts.map(function(k){var o=W[k];return '<button type="button" class="o" data-k="'+k+'"><span class="h">'+o.y+'</span>'+ro(o)+'</button>';}).join('')+'</div>';
  }else{
    h+='<p class="ask">Gambar mana yang cocok dengan kata ini?</p><div class="word"><div class="h">'+w.y+'</div>'+(romaji?'<div class="r">'+toRomaji(w.y)+'</div>':'')+'</div><div class="opts">'+
      r.opts.map(function(k){return '<button type="button" class="o img" data-k="'+k+'" aria-label="Pilihan gambar">'+W[k].s+'</button>';}).join('')+'</div>';
  }
  h+='<div id="fact"></div></div>';
  $('stage').innerHTML=h;
}
function answer(btn){
  if(locked)return;locked=true;
  var r=round[i],w=W[r.k],pick=btn.getAttribute('data-k'),ok=pick===r.k;
  Array.prototype.forEach.call(document.querySelectorAll('.o'),function(b){b.disabled=true;if(b.getAttribute('data-k')===r.k)b.classList.add('ok');});
  if(ok){rights++;streak++;score+=10+Math.min(streak-1,5)*2;}else{btn.classList.add('bad');streak=0;}
  $('streak').textContent=streak;$('score').textContent=score;
  $('bar').style.width=((i+1)/round.length*100)+'%';
  var last=i===round.length-1;
  $('fact').innerHTML='<div class="fact" role="status"><div><span style="font-weight:700">'+(ok?'Benar!':'Kurang tepat.')+'</span></div><div class="big">'+w.k+' '+w.y+'</div><p>'+toRomaji(w.y)+' = '+w.m+(w.k!==w.y?' (kanji: '+w.k+')':'')+'</p><div class="row"><button type="button" class="btn" id="say">Dengar</button><button type="button" class="btn pri" id="next">'+(last?'Lihat hasil':'Lanjut')+'</button></div></div>';
  speak(w.y);
  $('next').focus();
}
function finish(){
  var p=rights/round.length,rank=p>=.9?['Mata tajam','kansatsuryoku (観察力)']:p>=.7?['Hampir hafal','jouzu (上手)']:p>=.4?['Terus berlatih','renshuu (練習)']:['Baru mulai','hajime (始め)'];
  var prev=getBest(),rec=score>prev;if(rec)setBest(score);
  $('bar').style.width='100%';
  $('stage').innerHTML='<div class="card end"><div class="big">'+rights+'/'+round.length+'</div><div class="rank">'+rank[0]+'</div><div class="foot">'+rank[1]+'</div><p style="margin:0">Skor '+score+' poin'+(rec?', rekor baru.':'.')+'</p><button type="button" class="btn pri" id="again">Main lagi</button></div>';
  $('foot').textContent='Rekor mode ini: '+getBest()+' poin.';
}
$('md').addEventListener('click',function(e){var b=e.target.closest('[data-m]');if(!b)return;mode=b.getAttribute('data-m');buildCtl();start();});
$('rm').addEventListener('click',function(e){if(!e.target.closest('#rmb'))return;romaji=!romaji;buildCtl();if(!locked&&round.length&&i<round.length)show();});
$('stage').addEventListener('click',function(e){
  var o=e.target.closest('.o');if(o){answer(o);return;}
  var id=e.target.id;
  if(id==='next'){if(i<round.length-1){i++;show();}else finish();}
  else if(id==='again')start();
  else if(id==='say')speak(W[round[i].k].y);
});
document.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var n=+e.key;if(n>=1&&n<=4&&!locked){var b=document.querySelectorAll('.o')[n-1];if(b)answer(b);}
});
buildCtl();start();
</script>
