name: Unpack site
on:
  push:
    paths: ['site.zip']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site.zip
        run: |
          test -f site.zip
          unzip -oq site.zip
          rm site.zip
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Update site" || echo "no changes"
          git push
      - name: Trigger Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
