<main class="qMain"><article class="qPage"><h1 class="qPT">Admin</h1><div class="postBody pE"><!-- Admin Pusat (login Google, khusus admin). Tempel di Blogger: Halaman > mode HTML, buat halaman TERSENDIRI
     yang jangan dibagikan ke anggota biasa (misal /p/admin.html, jangan ditaruh di menu blog).
     Ganti firebaseConfig di bawah dengan konfigurasi Firebase yang SAMA dengan halaman kuis lain,
     supaya baca/tulis ke database Firestore yang sama. -->
<div id="admin-pusat" data-tone="light">
<style>
#admin-pusat,#admin-pusat *{box-sizing:border-box}
#admin-pusat{display:block;position:relative;max-width:720px;margin:0 auto;padding:0 0 32px;font:inherit;line-height:1.55;text-align:left;color:inherit;

#admin-pusat[data-tone="light"]{--card:rgba(255,255,255,.62);--soft:rgba(20,40,60,.06);--line:rgba(20,40,60,.17);
  --blue:#0b5cad;--btn:#0b5cad;--btn-h:#084a8c}

#admin-pusat [hidden]{display:none!important}

#admin-pusat .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}

#admin-pusat .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 24px;margin:0 0 18px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#admin-pusat .center{text-align:center}
#admin-pusat .kd-title{font-size:1.5rem;line-height:1.3;font-weight:700;margin:0 0 6px}

#admin-pusat .btn{display:block;width:100%;padding:14px 18px;border-radius:12px;background:var(--btn);color:#fff;font-weight:700;font-size:1.02rem;text-align:center}

#admin-pusat input[type=text],#admin-pusat input[type=email]{display:block;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:inherit;font:inherit;font-size:.95rem;margin:0 0 10px}
#admin-pusat label.check{display:inline-flex;align-items:center;gap:8px;padding:5px 14px 5px 0;margin:0;cursor:pointer;font-weight:400;font-size:.92rem}
#admin-pusat input[type=checkbox]{width:17px;height:17px;margin:0;accent-color:var(--btn)}

#admin-pusat .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--soft);font-size:.78rem;font-weight:600;margin:0 4px 4px 0;color:var(--blue)}
#admin-pusat #kd-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#15202b;color:#fff;padding:10px 16px;border-radius:10px;font-size:.95rem;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9999}
#admin-pusat #kd-toast.on{opacity:1}
#admin-pusat .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--btn);border-radius:50%;margin:0 auto 12px;animation:kd-sp .8s linear infinite}
@keyframes kd-sp{to{transform:rotate(360deg)}}
@media (max-width:480px){#admin-pusat .card{padding:20px 16px}}
</style>
<div class="kd-top" id="kd-top"></div>
<div id="kd-app"><div class="card center"><div class="spin"></div><p class="sub">Memuat&hellip;</p></div></div>
<div id="kd-toast" role="status" aria-live="polite"></div>
<noscript><div class="card">Halaman ini membutuhkan JavaScript.</div></noscript>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, setDoc, deleteDoc, collection, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ============ 1. ISI DENGAN KONFIGURASI FIREBASE YANG SAMA DENGAN HALAMAN KUIS ============ */
const firebaseConfig = {
  apiKey: "AIzaSyA1WrsQJfTo7dj_WfTh3j_E6Ecoko7rYX4",
  authDomain: "qategori.firebaseapp.com",
  projectId: "qategori",
  appId: "1:323434645943:web:5c0449e902b0f32655c032"
};
/* ============================================================================================ */

/* 2. Daftar bidang yang tersedia untuk dicentang. "key" di sini HARUS SAMA PERSIS dengan
   BIDANG_KEY yang dipakai di widget kuis/materi bidang itu di halaman lain, karena ini yang
   dicek untuk membuka akses. Tambah baris baru di sini kalau ada bidang baru. */
const BIDANG_LIST = [
  { key: 'kensetsu', label: 'Konstruksi' },
  { key: 'makanan',  label: 'Makanan' },
  { key: 'seizou',   label: 'Manufaktur' },
  { key: 'nogyo',    label: 'Pertanian' },
  { key: 'shukuhaku', label: 'Perhotelan' },
  { key: 'jidosha',   label: 'Servis Otomotif' },
  { key: 'cleaning',  label: 'Kebersihan Gedung' },
  { key: 'bisniskaria', label: 'Bisnis Karir' },
  { key: 'suisan',    label: 'Perikanan' }
];

const root = document.getElementById('admin-pusat');
const $app = root.querySelector('#kd-app');
const $top = root.querySelector('#kd-top');
const $  = (s) => root.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (ts) => ts && ts.toDate ? ts.toDate().toLocaleString('id-ID', {dateStyle:'medium', timeStyle:'short'}) : '';
const S = { user:null, isAdmin:false };
let db, auth;

function view(html){ $app.innerHTML = html; }
let toastTimer;
function toast(msg){
  const t = $('#kd-toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 3200);
}

function paintTop(){
  const u = S.user;
  $top.innerHTML = `<span class="brand">Admin Pusat</span>` + (u
    ? `<div class="who"><span>${esc(u.displayName || u.email)}</span><button class="ghost small" data-action="logout">Keluar</button></div>` : '');
}
const viewLoading = (msg='Memuat…') => view(`<div class="card center"><div class="spin"></div><p class="sub">${esc(msg)}</p></div>`);
function viewError(msg, err){
  view(`<div class="card"><h2 class="kd-title">Terjadi masalah</h2><p>${esc(msg)}</p>
    <p class="note">${esc(err && (err.code || err.message) || '')}</p>
    <div class="row"><button class="btn" style="width:auto" data-action="reload">Coba lagi</button></div></div>`);
}
function viewSetupNeeded(){
  view(`<div class="card"><h2 class="kd-title">Konfigurasi belum diisi</h2>
    <p>Buka file <code>admin_pusat_blogger.html</code>, isi <code>firebaseConfig</code> dengan konfigurasi
    Firebase yang <strong>sama persis</strong> dengan halaman kuis, supaya membaca database yang sama.</p></div>`);
}
function viewLogin(msg=''){
  view(`<section class="card center">
    <h2 class="kd-title">Admin Pusat</h2>
    <p class="sub">Kelola anggota &amp; akses bidang untuk semua kuis</p>
    <p>Halaman ini khusus admin.</p>
    <button class="btn" data-action="login">Masuk dengan Google</button>
    <p class="err" id="err">${esc(msg)}</p></section>`);
}
function viewDenied(){
  view(`<section class="card center"><h2 class="kd-title">Bukan admin</h2>
    <p><strong>${esc(S.user.email)}</strong> tidak terdaftar sebagai admin.</p>
    <div class="row" style="justify-content:center"><button class="ghost" data-action="logout">Ganti akun</button></div></section>`);
}

/* ---------------- Auth ---------------- */
async function onUser(user){
  S.user = user; S.isAdmin = false;
  paintTop();
  if (!user) return viewLogin();
  viewLoading('Memeriksa akses…');
  try {
    const email = user.email.toLowerCase();
    S.isAdmin = (await getDoc(doc(db, 'admins', email))).exists();
  } catch (err) { console.error(err); return viewError('Tidak bisa memeriksa akses. Periksa aturan Firestore dan koneksi internet.', err); }
  if (!S.isAdmin) return viewDenied();
  viewPanel('anggota');
}

/* ---------------- Panel ---------------- */
async function viewPanel(tab = 'anggota'){
  if (!S.isAdmin) return;
  viewLoading('Memuat…');
  const tabs = [['anggota', 'Anggota'], ['admin', 'Admin']];
  let body = '';
  try {
    if (tab === 'anggota') {
      const snap = await getDocs(collection(db, 'members'));
      const rows = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.id.localeCompare(b.id));
      body = `<h3 style="margin-top:0">Tambah / perbarui anggota</h3>
        <p class="sub" style="margin-bottom:8px">Isi email anggota, lalu centang bidang yang boleh diaksesnya.
        Kalau emailnya sudah terdaftar, ini akan memperbarui data &amp; bidangnya (bukan bikin duplikat).</p>
        <input type="email" id="m-email" placeholder="budi@gmail.com">
        <input type="text" id="m-nama" placeholder="Nama (opsional)">
        <fieldset><legend>Bidang</legend>
          ${BIDANG_LIST.map(b => `<label class="check"><input type="checkbox" name="m-bidang" value="${esc(b.key)}"> ${esc(b.label)}</label>`).join('')}
        </fieldset>
        <div class="row"><button class="btn" style="width:auto" data-action="saveMember">Simpan anggota</button></div>
        <h3>Daftar anggota (${rows.length})</h3>
        ${rows.length ? `<div class="scroll"><table><thead><tr><th>Email</th><th>Nama</th><th>Bidang</th><th></th></tr></thead><tbody>
          ${rows.map(r => {
            const bidang = Array.isArray(r.bidang) ? r.bidang : null;
            const badges = bidang
              ? (bidang.length ? bidang.map(k => `<span class="badge">${esc(BIDANG_LIST.find(b => b.key === k)?.label || k)}</span>`).join('') : '<span class="sub" style="margin:0">(tidak ada bidang)</span>')
              : '<span class="sub" style="margin:0">(anggota lama — semua bidang lama)</span>';
            return `<tr><td>${esc(r.email || r.id)}</td><td>${esc(r.nama || '')}</td><td>${badges}</td>
              <td><div class="row" style="margin:0;flex-wrap:nowrap">
                <button class="ghost small" data-action="editMember" data-email="${esc(r.id)}">Edit</button>
                <button class="ghost small danger" data-action="delMember" data-email="${esc(r.id)}">Hapus</button>
              </div></td></tr>`;
          }).join('')}
        </tbody></table></div>` : '<p class="sub">Belum ada anggota.</p>'}`;
    } else {
      const snap = await getDocs(collection(db, 'admins'));
      const rows = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.id.localeCompare(b.id));
      body = `<h3 style="margin-top:0">Tambah admin</h3>
        <p class="sub" style="margin-bottom:8px">Admin bisa masuk ke panel ini dan otomatis punya akses ke semua bidang di halaman kuis.</p>
        <input type="email" id="a-email" placeholder="admin-baru@gmail.com">
        <input type="text" id="a-nama" placeholder="Nama (opsional)">
        <div class="row"><button class="btn" style="width:auto" data-action="addAdmin">Tambah admin</button></div>
        <h3>Daftar admin (${rows.length})</h3>
        ${rows.length ? `<div class="scroll"><table><thead><tr><th>Email</th><th>Nama</th><th></th></tr></thead><tbody>
          ${rows.map(r => `<tr><td>${esc(r.email || r.id)}</td><td>${esc(r.nama || '')}</td>
            <td><button class="ghost small danger" data-action="delAdmin" data-email="${esc(r.id)}">Hapus</button></td></tr>`).join('')}
        </tbody></table></div>` : '<p class="sub">Belum ada admin.</p>'}`;
    }
  } catch (err) { console.error(err); return viewError('Gagal memuat panel.', err); }
  view(`<section class="card"><h2 class="kd-title">Admin Pusat</h2>
    <p class="note">Satu tempat untuk kelola anggota &amp; bidang aksesnya, dipakai bareng oleh semua halaman kuis TG2.</p>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${k === tab}" data-action="tab" data-tab="${k}">${l}</button>`).join('')}</div>
    ${body}</section>`);
}

/* ---------------- Anggota ---------------- */
function checkedBidang(){
  return [...root.querySelectorAll('input[name="m-bidang"]:checked')].map(el => el.value);
}
async function saveMember(){
  const email = ($('#m-email').value || '').trim().toLowerCase();
  const nama = ($('#m-nama').value || '').trim();
  const bidang = checkedBidang();
  if (!/^[^\s@\/]+@[^\s@\/]+\.[^\s@\/]+$/.test(email)) return toast('Isi email yang valid dulu.');
  if (!bidang.length) return toast('Centang minimal satu bidang.');
  try {
    const ref = doc(db, 'members', email);
    const exists = (await getDoc(ref)).exists();
    await setDoc(ref, {
      email, nama, bidang,
      ...(exists ? { updatedAt: serverTimestamp(), updatedBy: S.user.email.toLowerCase() }
                 : { addedAt: serverTimestamp(), addedBy: S.user.email.toLowerCase() })
    }, { merge: true });
    toast(exists ? 'Anggota diperbarui.' : 'Anggota ditambahkan.');
    viewPanel('anggota');
  } catch (err) { console.error(err); toast('Gagal menyimpan: ' + (err.code || err.message)); }
}
async function editMember(email){
  try {
    const snap = await getDoc(doc(db, 'members', email));
    if (!snap.exists()) return;
    const d = snap.data();
    $('#m-email').value = d.email || email;
    $('#m-nama').value = d.nama || '';
    const bidang = Array.isArray(d.bidang) ? d.bidang : BIDANG_LIST.map(b => b.key);
    root.querySelectorAll('input[name="m-bidang"]').forEach(el => { el.checked = bidang.includes(el.value); });
    $('#m-email').scrollIntoView({ behavior: 'smooth', block: 'center' });
  } catch (err) { console.error(err); toast('Gagal memuat data anggota.'); }
}
async function delMember(email){
  if (!confirm(`Hapus ${email} dari daftar anggota (semua bidang)?`)) return;
  try { await deleteDoc(doc(db, 'members', email)); toast('Anggota dihapus.'); }
  catch (err) { console.error(err); toast('Gagal menghapus.'); }
  viewPanel('anggota');
}

/* ---------------- Admin ---------------- */
async function addAdmin(){
  const email = ($('#a-email').value || '').trim().toLowerCase();
  const nama = ($('#a-nama').value || '').trim();
  if (!/^[^\s@\/]+@[^\s@\/]+\.[^\s@\/]+$/.test(email)) return toast('Isi email yang valid dulu.');
  try {
    await setDoc(doc(db, 'admins', email), { email, nama, addedAt: serverTimestamp(), addedBy: S.user.email.toLowerCase() }, { merge: true });
    toast('Admin ditambahkan.');
    viewPanel('admin');
  } catch (err) { console.error(err); toast('Gagal menyimpan: ' + (err.code || err.message)); }
}
async function delAdmin(email){
  if (email === S.user.email.toLowerCase()) return toast('Tidak bisa menghapus akun admin yang sedang dipakai.');
  if (!confirm(`Hapus ${email} dari daftar admin?`)) return;
  try { await deleteDoc(doc(db, 'admins', email)); toast('Admin dihapus.'); }
  catch (err) { console.error(err); toast('Gagal menghapus.'); }
  viewPanel('admin');
}

/* ---------------- Aksi & event ---------------- */
const actions = {
  async login(){
    const errEl = $('#err'); if (errEl) errEl.textContent = '';
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (err) {
      const m = {
        'auth/popup-blocked': 'Popup diblokir browser. Izinkan popup untuk halaman ini, lalu coba lagi.',
        'auth/unauthorized-domain': 'Domain halaman ini belum ditambahkan di Firebase → Authentication → Settings → Authorized domains.',
        'auth/popup-closed-by-user': '', 'auth/cancelled-popup-request': ''
      }[err.code];
      if (errEl) errEl.textContent = m !== undefined ? m : 'Gagal masuk: ' + (err.code || err.message);
    }
  },
  logout(){ signOut(auth); },
  reload(){ location.reload(); },
  tab(el){ viewPanel(el.dataset.tab); },
  saveMember, addAdmin,
  editMember(el){ editMember(el.dataset.email); },
  delMember(el){ delMember(el.dataset.email); },
  delAdmin(el){ delAdmin(el.dataset.email); }
};
root.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const fn = actions[el.dataset.action]; if (fn) fn(el, e);
});

/* ---------------- Ikuti tema blog (terang/gelap) ---------------- */
function syncTone(){
  let light = null;
  try {
    const c = document.createElement('canvas'); c.width = c.height = 1;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.fillStyle = '#000'; x.fillStyle = getComputedStyle(root).color; x.fillRect(0, 0, 1, 1);
    const [r, g, b] = x.getImageData(0, 0, 1, 1).data;
    light = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 < 0.55;
  } catch {}
  if (light === null) light = !matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.tone = light ? 'light' : 'dark';
}
const kick = () => { syncTone(); setTimeout(syncTone, 450); };
const watch = { attributes: true, attributeFilter: ['class', 'data-theme', 'data-mode', 'data-color-scheme', 'style'] };
try {
  new MutationObserver(kick).observe(document.documentElement, watch);
  new MutationObserver(kick).observe(document.body, watch);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', kick);
} catch {}
syncTone();

/* ---------------- Mulai ---------------- */
paintTop();
if (Object.values(firebaseConfig).some(v => String(v).startsWith('GANTI'))) {
  viewSetupNeeded();
} else {
  const fbApp = initializeApp(firebaseConfig);
  auth = getAuth(fbApp); db = getFirestore(fbApp);
  onAuthStateChanged(auth, onUser);
}
</script>
