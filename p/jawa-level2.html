const PASSTEMS=STEMS.filter(s=>s!=='r'&&s!=='y');

const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);const t=a[i];a[i]=a[j];a[j]=t;}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jw=s=>'<span class="jw">'+s+'</span>';

/* token: syl (suku kata, boleh dengan panyigeg), fin (konsonan + pangkon di akhir kata), clu (konsonan mati + pasangan) */
function mkTok(t){
  if(t.k==='syl'){t.g=BASE[t.stem]+SIGN[t.v]+(t.fin?FINS[t.fin]:'');t.l=t.stem+t.v+(t.fin||'');}
  else if(t.k==='fin'){t.g=BASE[t.stem]+PANG;t.l=t.stem;}
  else{t.g=BASE[t.stem]+PANG+BASE[t.stem2]+SIGN[t.v]+(t.fin?FINS[t.fin]:'');t.l=t.stem+t.stem2+t.v+(t.fin||'');}
  return t;
}
const parseTok=s=>{
  let fin=null;
  if(s.indexOf('+')>-1){const a=s.split('+');s=a[0];fin=a[1];}
  if(s.slice(-1)==='.')return mkTok({k:'fin',stem:s.slice(0,-1)});
  if(s.indexOf('.')>-1){const a=s.split('.');return mkTok({k:'clu',stem:a[0],stem2:a[1].slice(0,-1),v:a[1].slice(-1),fin:fin});}
  return mkTok({k:'syl',stem:s.slice(0,-1),v:s.slice(-1),fin:fin});
};
const wordOf=(toks,arti)=>({toks:toks,g:toks.map(t=>t.g).join(''),l:toks.map(t=>t.l).join(''),arti:arti});
const mkWord=(spec,arti)=>wordOf(spec.split('-').map(parseTok),arti);

function variants(w){
  const structural=[],other=[];
  w.toks.forEach((t,i)=>{
    const rep=(arr,rt)=>{arr.push(wordOf(w.toks.slice(0,i).concat(rt,w.toks.slice(i+1)),''));};
    if(t.k==='syl'||t.k==='clu'){
      VOW.forEach(v=>{if(v!==t.v)rep(other,[mkTok(Object.assign({},t,{v:v}))]);});
      if(t.fin)FSET.forEach(f=>{if(f!==t.fin)rep(other,[mkTok(Object.assign({},t,{fin:f}))]);});
    }
    if(t.k==='fin'){
      rep(structural,[mkTok({k:'syl',stem:t.stem,v:'a',fin:null})]);
      ['n','k','l','t','m','p','s'].forEach(s=>{if(s!==t.stem)rep(other,[mkTok({k:'fin',stem:s})]);});
    }
    if(t.k==='clu'){
      rep(structural,[mkTok({k:'syl',stem:t.stem,v:'a',fin:null}),mkTok({k:'syl',stem:t.stem2,v:t.v,fin:t.fin})]);
    }
  });
  const seen={};seen[w.l]=1;
  const pick=[];
  const first=shuffle(structural).filter(x=>!seen[x.l])[0];
  if(first){seen[first.l]=1;pick.push(first);}
  shuffle(other).concat(shuffle(structural)).forEach(x=>{if(!seen[x.l]&&pick.length<3){seen[x.l]=1;pick.push(x);}});
  return pick;
}

const whyTok=t=>{
  if(t.k==='fin')return jw(t.g)+' = '+jw(BASE[t.stem])+' + pangkon. Pangkon mematikan vokal \u201ca\u201d, jadi hanya terdengar <b>'+t.l+'</b>.';
  return jw(t.g)+' = '+jw(BASE[t.stem]+SIGN[t.v])+' ('+t.stem+t.v+') + '+FINNAME[t.fin]+' (\u201c'+t.fin+'\u201d) \u2192 <b>'+t.l+'</b>.';
};
const whyWord=w=>{
  let s=w.toks.map(t=>jw(t.g)+' ('+t.l+')').join(' + ')+' \u2192 <b>'+w.l+'</b>, artinya \u201c'+w.arti+'\u201d.';
  const cl=w.toks.filter(t=>t.k==='clu');
  if(cl.length)s+=' Pasangan: '+cl.map(t=>t.stem+' + '+t.stem2).join(', ')+'.';
  return s;
};

function mk(sec,ask,prompt,correct,wrongs,glyph,why){
  const seen={};seen[correct]=1;
  const wr=[];
  wrongs.forEach(w=>{if(!seen[w]){seen[w]=1;wr.push(w);}});
  let arr=[{t:correct,ok:true}].concat(wr.slice(0,3).map(w=>({t:w,ok:false})));
  arr=shuffle(arr);
  let ans=0;
  arr.forEach((o,i)=>{if(o.ok)ans=i;o.glyph=glyph;});
  return {sec:sec,ask:ask,prompt:prompt,opts:arr,ans:ans,why:why};
}


const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const MED={r:'\ua9bf',y:'\ua9be'};
const MEDN={r:'cakra',y:'pengkal'};
function mkMed(stem,med,v,fin){return {k:'med',stem:stem,med:med,v:v,fin:fin||null,g:BASE[stem]+MED[med]+SIGN[v]+(fin?FINS[fin]:''),l:stem+med+v+(fin||'')};}
function parseMed(s){
  let fin=null;
  if(s.indexOf('+')>-1){const a=s.split('+');s=a[0];fin=a[1];}
  const a=s.split('^');
  return mkMed(a[0],a[1].charAt(0),a[1].slice(1),fin);
}
const mwM=(spec,arti)=>wordOf(spec.split('-').map(s=>s.indexOf('^')>-1?parseMed(s):parseTok(s)),arti);
const CAK=[
  mwM('k^ra-to-n.','keraton'),mwM('k^ra-ma','krama'),mwM('pu-t^ra','putra'),mwM('t^ri-ma','terima'),mwM('g^r'+E+'-ja','gereja')
];
const PEN=[mwM('b^ya+r','terang, bersinar'),mwM('d^ya+h','gelar putri bangsawan')];
function mvariants(w){
  const st=[],ot=[];
  w.toks.forEach((t,i)=>{
    const rep=(arr,rt)=>{arr.push(wordOf(w.toks.slice(0,i).concat(rt,w.toks.slice(i+1)),''));};
    if(t.k==='med'){
      rep(st,[mkMed(t.stem,t.med==='r'?'y':'r',t.v,t.fin)]);
      rep(st,[mkTok({k:'syl',stem:t.stem,v:t.v,fin:t.fin})]);
      VOW.forEach(v=>{if(v!==t.v)rep(ot,[mkMed(t.stem,t.med,v,t.fin)]);});
    }else if(t.k==='syl'){
      VOW.forEach(v=>{if(v!==t.v)rep(ot,[mkTok(Object.assign({},t,{v:v}))]);});
      if(t.fin)FSET.forEach(f=>{if(f!==t.fin)rep(ot,[mkTok(Object.assign({},t,{fin:f}))]);});
    }else if(t.k==='fin'){
      rep(st,[mkTok({k:'syl',stem:t.stem,v:'a',fin:null})]);
    }
  });
  const seen={};seen[w.l]=1;
  const pick=[];
  const first=shuffle(st).filter(x=>!seen[x.l])[0];
  if(first){seen[first.l]=1;pick.push(first);}
  shuffle(st).concat(shuffle(ot)).forEach(x=>{if(!seen[x.l]&&pick.length<3){seen[x.l]=1;pick.push(x);}});
  return pick;
}
const LV=['ngoko lugu','ngoko alus','krama lugu','krama alus'];
const UU=[
  {id:'Bapak pergi ke Solo.',f:['Bapak arep lunga menyang Solo.','Bapak arep tindak menyang Solo.','Bapak badh'+E+' k'+E+'sah dhateng Solo.','Bapak badh'+E+' tindak dhateng Solo.']},
  {id:'Ibu sudah makan.',f:['Ibu wis mangan.','Ibu wis dhahar.','Ibu sampun nedha.','Ibu sampun dhahar.']},
  {id:'Simbah sudah tidur.',f:['Simbah wis turu.','Simbah wis sare.','Simbah sampun tilem.','Simbah sampun sare.']},
  {id:'Bapak sudah pulang.',f:['Bapak wis mulih.','Bapak wis kondur.','Bapak sampun wangsul.','Bapak sampun kondur.']}
];
const NS=[['waca','maca','membaca'],['tulis','nulis','menulis'],['sapu','nyapu','menyapu'],['pangan','mangan','makan'],['kirim','ngirim','mengirim'],['gawe','nggawe','membuat'],['jupuk','njupuk','mengambil'],['bukak','mbukak','membuka'],['deleng','ndeleng','melihat']];
const NRULE={w:'w \u2192 m',t:'t \u2192 n',s:'s \u2192 ny',p:'p \u2192 m',k:'k \u2192 ng',g:'g \u2192 ngg',j:'j \u2192 nj',b:'b \u2192 mb',d:'d \u2192 nd'};
const NPOS=['omah','kucing','kebon','pitik','buku','sepatu','sapu','meja'];
const isV=s=>'aiuoe\u00e9\u011b'.indexOf(s.charAt(s.length-1))>-1;
const sfx=s=>s+(isV(s)?'n'+E:E);
const sfxWrong=s=>s+(isV(s)?E:'n'+E);

function buildQuiz(){
  const A=[],B=[],C=[],D=[];
  /* Bagian 1: cakra dan pengkal (5) */
  const medToks=[];
  CAK.concat(PEN).forEach(w=>w.toks.forEach(t=>{if(t.k==='med')medToks.push(t);}));
  {
    const t=shuffle(medToks)[0],nm=MEDN[t.med];
    A.push(mk(0,'Tanda yang menempel pada aksara ini bernama \u2026',{type:'glyph',text:t.g},nm,['cakra','pengkal','keret','pangkon'].filter(x=>x!==nm),false,
      jw(t.g)+' = '+jw(BASE[t.stem]+SIGN[t.v])+' + '+nm+' \u2192 <b>'+t.l+'</b>. '+(t.med==='r'?'Cakra':'Pengkal')+' menambahkan bunyi \u201c'+t.med+'\u201d setelah konsonan.'));
  }
  const cw=shuffle(CAK),pw=shuffle(PEN);
  const whyM=w=>w.toks.map(t=>jw(t.g)+' ('+t.l+')').join(' + ')+' \u2192 <b>'+w.l+'</b>, artinya \u201c'+w.arti+'\u201d.';
  A.push(mk(0,'Bagaimana kata ini dibaca?',{type:'word',text:cw[0].g},cw[0].l,mvariants(cw[0]).map(o=>o.l),false,whyM(cw[0])));
  A.push(mk(0,'Mana tulisan Jawa untuk kata ini?',{type:'latin',text:cw[1].l},cw[1].g,mvariants(cw[1]).map(o=>o.g),true,whyM(cw[1])));
  A.push(mk(0,'Bagaimana kata ini dibaca?',{type:'word',text:pw[0].g},pw[0].l,mvariants(pw[0]).map(o=>o.l),false,whyM(pw[0])));
  A.push(mk(0,'Cakra dan pengkal adalah bentuk khusus dari pasangan \u2026',{type:'none',text:'Konsep'},'ra dan ya',['ha dan na','ka dan ta','sa dan wa'],false,
    'Pasangan ra ditulis sebagai cakra (\ua9bf) dan pasangan ya sebagai pengkal (\ua9be). Keduanya menempel pada konsonan sebelumnya, tanpa pangkon.'));

  /* Bagian 2: unggah-ungguh (5) */
  const us=shuffle(UU);
  const whyU=u=>LV.map((n,i)=>cap0(n)+': \u201c'+u.f[i]+'\u201d').join('. ')+'.';
  function cap0(s){return s.charAt(0).toUpperCase()+s.slice(1);}
  const lv=shuffle([0,1,2,3]);
  [0,1].forEach(k=>{
    const u=us[k],l=lv[k];
    B.push(mk(1,'Kalimat ini termasuk tingkat tutur apa?',{type:'text',text:u.f[l]},LV[l],LV.filter((x,i)=>i!==l),false,
      '\u201c'+u.f[l]+'\u201d adalah '+LV[l]+'. '+whyU(u)));
  });
  [2,3].forEach(k=>{
    const u=us[k],l=lv[k];
    B.push(mk(1,'Pilih kalimat '+LV[l]+' untuk: \u201c'+u.id+'\u201d',{type:'none',text:'Konsep'},u.f[l],u.f.filter((x,i)=>i!==l),false,
      LV[l]+': \u201c'+u.f[l]+'\u201d. '+whyU(u)));
  });
  B.push(mk(1,'Ngoko alus adalah tingkat tutur yang \u2026',{type:'none',text:'Konsep'},'memakai ngoko, tetapi memberi kata krama inggil pada orang yang dihormati',
    ['memakai krama sepenuhnya tanpa kata inggil','memakai ngoko untuk semua kata, termasuk untuk orang tua','mencampur bahasa Jawa dan bahasa Indonesia'],false,
    'Contoh: \u201cIbu wis dhahar.\u201d Strukturnya ngoko (wis), tetapi \u201cdhahar\u201d (inggil) menghormati Ibu.'));

  /* Bagian 3: ater-ater (5) */
  const ns=shuffle(NS);
  [0,1].forEach(k=>{
    const r=ns[k];
    C.push(mk(2,'Bentuk ater-ater nasal dari \u201c'+r[0]+'\u201d (artinya \u201c'+r[2]+'\u201d) adalah \u2026',{type:'none',text:'Konsep'},r[1],shuffle(NS.filter(x=>x!==r)).slice(0,3).map(x=>x[1]),false,
      '\u201c'+r[0]+'\u201d menjadi \u201c'+r[1]+'\u201d ('+NRULE[r[0].charAt(0)]+'): '+r[2]+'.'));
  });
  C.push(mk(2,'Kalimat mana yang berarti \u201cBuku itu kamu baca\u201d?',{type:'none',text:'Konsep'},'Buku iku kokwaca.',
    ['Buku iku dakwaca.','Buku iku diwaca.','Aku maca buku iku.'],false,
    'kok- menunjukkan pelaku \u201ckamu\u201d, dak- pelaku \u201caku\u201d, dan di- pelaku orang ketiga atau tidak disebut.'));
  C.push(mk(2,'Ater-ater ke- pada \u201ckesandhung\u201d menunjukkan \u2026',{type:'none',text:'Konsep'},'perbuatan yang terjadi tanpa sengaja (tersandung)',
    ['perbuatan yang dilakukan dengan sengaja','jumlah satu','arah ke atas'],false,
    'ke- + sandhung \u2192 kesandhung, \u201ctersandung\u201d. Ater-ater ke- sering menandakan sesuatu yang menimpa tanpa disengaja.'));
  C.push(mk(2,'Apa arti \u201csadina\u201d?',{type:'none',text:'Konsep'},'sehari',['sebulan','setiap hari','semalam'],false,
    'sa- berarti \u201csatu\u201d. sa- + dina (hari) \u2192 sadina, \u201csehari\u201d.'));

  /* Bagian 4: panambang (5) */
  const np=shuffle(NPOS);
  [0,1].forEach(k=>{
    const w=np[k],ok=sfx(w);
    D.push(mk(3,'Tambahkan panambang -\u00e9/-n\u00e9 (miliknya) pada \u201c'+w+'\u201d.',{type:'none',text:'Konsep'},ok,[sfxWrong(w),w+'ku',w+'mu'],false,
      w+(isV(w)?' berakhir vokal, jadi memakai -n\u00e9: ':' berakhir konsonan, jadi memakai -\u00e9: ')+ok+'.'));
  });
  D.push(mk(3,'Bentuk -an dari \u201cdolan\u201d (bermain) yang berarti \u201cmainan, permainan\u201d adalah \u2026',{type:'none',text:'Konsep'},'dolanan',['dolan\u00e9','dolani','dolanak\u00e9'],false,
    'Panambang -an membentuk kata benda: dolan \u2192 dolanan.'));
  D.push(mk(3,'Panambang -ak\u00e9 pada \u201cnulisak\u00e9\u201d berarti \u2026',{type:'none',text:'Konsep'},'melakukan untuk orang lain atau menuju sesuatu (menuliskan)',
    ['sedang melakukan berulang-ulang','melakukan tanpa sengaja','menjadi lebih'],false,
    'nulis \u2192 nulisak\u00e9: \u201cmenuliskan\u201d. Contoh: \u201cAku nulisak\u00e9 adhiku layang\u201d = aku menuliskan surat untuk adikku.'));
  D.push(mk(3,'Mana yang berarti \u201crumahmu\u201d?',{type:'none',text:'Konsep'},'omahmu',['omahku','omah\u00e9','omahan'],false,
    '-ku = milikku, -mu = milikmu, -\u00e9 = miliknya. Jadi \u201comahmu\u201d = rumahmu.'));
  return [].concat(shuffle(A),shuffle(B),shuffle(C),shuffle(D));
}

/*==DOM==*/
function JVApp(cfg){
  const root=document.getElementById(cfg.id);
  if(!root)return;
  const q$=s=>root.querySelector(s);
  const qa=s=>root.querySelectorAll(s);
  const SECN=cfg.secNames,PASS=cfg.pass,KEY=cfg.key;
  let Q=[],idx=0,score=0,log=[],answered=false;

  const getBest=()=>{try{const v=parseInt(localStorage.getItem(KEY),10);return isNaN(v)?null:v;}catch(e){return null;}};
  const setBest=n=>{try{localStorage.setItem(KEY,String(n));}catch(e){}};

  const links=(cfg.links||[]).map(l=>'<a href="'+l.href+'">'+esc(l.label)+'</a>').join('');
  root.innerHTML=
    '<div class="jv-top"><p class="jv-hero jw" aria-hidden="true">'+cfg.hero+'</p><p class="jv-lede">'+esc(cfg.lede)+'</p>'+(links?'<p class="jv-links">'+links+'</p>':'')+'</div>'+
    '<div class="jv-tabs" role="tablist" aria-label="Bagian belajar">'+
      '<button type="button" class="jv-tab" role="tab" data-tab="materi" aria-selected="true">Materi</button>'+
      '<button type="button" class="jv-tab" role="tab" data-tab="kuis" aria-selected="false" tabindex="-1">Kuis</button>'+
    '</div>'+
    '<div class="jv-panel" data-panel="materi" role="tabpanel">'+cfg.materi()+'</div>'+
    '<div class="jv-panel" data-panel="kuis" role="tabpanel" hidden><div class="jv-quiz"></div></div>';
  const quiz=q$('.jv-quiz');

  function showTab(name,scroll){
    ['materi','kuis'].forEach(n=>{
      const on=n===name,t=q$('[data-tab="'+n+'"]');
      t.setAttribute('aria-selected',on?'true':'false');
      t.tabIndex=on?0:-1;
      q$('[data-panel="'+n+'"]').hidden=!on;
    });
    if(scroll)root.scrollIntoView({block:'start'});
  }

  const promptHtml=p=>{
    if(p.type==='glyph')return '<p class="jv-pg jw">'+p.text+'</p>';
    if(p.type==='word')return '<p class="jv-pg jv-pw jw">'+p.text+'</p>';
    if(p.type==='latin')return '<p class="jv-pt">'+esc(p.text)+'</p>';
    if(p.type==='sent')return '<p class="jv-pg jv-ps jw">'+p.text+'</p>';
    if(p.type==='lines')return '<p class="jv-pt jv-pt-sm jv-pl">'+esc(p.text).replace(/\n/g,'<br>')+'</p>';
    if(p.type==='none')return '';
    return '<p class="jv-pt jv-pt-sm">'+esc(p.text)+'</p>';
  };
  const optHtml=o=>o.glyph?jw(o.t):esc(o.t);

  function renderQ(scroll){
    const q=Q[idx];
    let h='<div class="jv-qhead"><span>Soal <b>'+(idx+1)+'</b> dari '+Q.length+'</span><span class="jv-qsec">Bagian '+(q.sec+1)+' \u00b7 '+esc(SECN[q.sec])+'</span></div>';
    h+='<div class="jv-bar" role="progressbar" aria-label="Kemajuan kuis" aria-valuemin="0" aria-valuemax="'+Q.length+'" aria-valuenow="'+idx+'"><i></i></div>';
    h+='<section class="jv-prompt'+(q.prompt.type==='none'?' jv-prompt-q':'')+'"><p class="jv-ask">'+esc(q.ask)+'</p>'+promptHtml(q.prompt)+'</section>';
    h+='<div class="jv-opts '+(q.opts[0].glyph?'jv-opts-glyph':'jv-opts-text')+(q.wide?' jv-opts-wide':'')+'" role="group" aria-label="Pilihan jawaban">';
    q.opts.forEach((o,i)=>{
      h+='<button type="button" class="jv-opt" data-i="'+i+'">'+(o.glyph?'<span class="jw jv-jwo">'+o.t+'</span>':'<span class="jv-ot">'+esc(o.t)+'</span>')+'<span class="jv-tag" hidden></span></button>';
    });
    h+='</div><div class="jv-fb" role="status" aria-live="polite" hidden></div><button type="button" class="jv-main jv-next" data-act="next" hidden>Soal berikutnya</button>';
    quiz.innerHTML=h;
    quiz.querySelector('.jv-bar i').style.width=(idx/Q.length*100)+'%';
    if(scroll)quiz.querySelector('.jv-qhead').scrollIntoView({block:'start'});
  }

  function answer(i){
    if(answered)return;
    answered=true;
    const q=Q[idx],ok=i===q.ans;
    if(ok)score++;
    log.push({q:q,pick:i,ok:ok});
    qa('.jv-opt').forEach((b,j)=>{
      b.classList.add('is-locked');
      const tag=b.querySelector('.jv-tag');
      if(j===q.ans){b.classList.add('is-correct');tag.textContent='Benar';tag.hidden=false;}
      else if(j===i){b.classList.add('is-wrong');tag.textContent='Pilihanmu';tag.hidden=false;}
    });
    const fb=q$('.jv-fb');
    fb.className='jv-fb '+(ok?'is-good':'is-bad');
    fb.innerHTML='<p class="jv-fbt">'+(ok?'Benar':'Belum tepat')+'</p><p class="jv-fbw">'+q.why+'</p>';
    fb.hidden=false;
    const nx=q$('.jv-next');
    nx.textContent=idx===Q.length-1?'Lihat hasil':'Soal berikutnya';
    nx.hidden=false;
    nx.focus({preventScroll:true});
    nx.scrollIntoView({block:'nearest'});
  }

  function renderResult(){
    const secTot=SECN.map(()=>0),secOk=SECN.map(()=>0);
    log.forEach(l=>{secTot[l.q.sec]++;if(l.ok)secOk[l.q.sec]++;});
    let best=getBest();
    if(best===null||score>best){best=score;setBest(score);}
    const pass=score>=PASS;
    let h='<div class="jv-result"><p class="jv-rlabel">Hasil</p><p class="jv-rscore">'+score+'<small> / '+Q.length+'</small></p>';
    h+='<p class="jv-rverdict '+(pass?'is-good':'is-bad')+'">'+(pass?'Lulus':'Belum lulus')+' \u00b7 batas lulus '+PASS+' dari '+Q.length+'</p>';
    h+='<p class="jv-rbest">Skor terbaik di perangkat ini: '+best+' / '+Q.length+'</p><div class="jv-secs">';
    SECN.forEach((n,s)=>{
      h+='<div class="jv-sec"><span>'+esc(n)+'</span><div class="jv-bar"><i data-w="'+(secTot[s]?secOk[s]/secTot[s]*100:0)+'"></i></div><span class="jv-n">'+secOk[s]+'/'+secTot[s]+'</span></div>';
    });
    h+='</div>';
    const wrong=log.filter(l=>!l.ok);
    h+='<div class="jv-h3" role="heading" aria-level="3">'+(wrong.length?'Perlu diulang':'Semua jawaban benar')+'</div>';
    if(wrong.length){
      h+='<ul class="jv-wrongs">';
      wrong.forEach(l=>{
        const p=l.q.prompt,pj=(p.type==='glyph'||p.type==='word'||p.type==='sent');
        h+='<li><span class="jv-rq">'+(pj?jw(p.text):esc(p.text))+'</span><span class="jv-ra">Benar: <b>'+optHtml(l.q.opts[l.q.ans])+'</b><span class="jv-rb">Pilihanmu: '+optHtml(l.q.opts[l.pick])+'</span></span></li>';
      });
      h+='</ul>';
    }else{h+='<p class="jv-intro">'+esc(cfg.doneNote)+'</p>';}
    h+='<button type="button" class="jv-main" data-act="again">Ulangi dengan soal baru</button>';
    if(pass&&cfg.next)h+='<a class="jv-alt" href="'+cfg.next.href+'">'+esc(cfg.next.label)+'</a>';
    h+='<button type="button" class="jv-alt" data-act="materi">Buka materi</button></div>';
    quiz.innerHTML=h;
    quiz.querySelectorAll('.jv-sec .jv-bar i').forEach(i=>{i.style.width=i.getAttribute('data-w')+'%';});
    quiz.querySelector('.jv-result').scrollIntoView({block:'start'});
  }

  function newQuiz(scroll){
    Q=buildQuiz();idx=0;score=0;log=[];answered=false;
    renderQ(scroll);
  }

  root.addEventListener('click',e=>{
    const tb=e.target.closest('[data-tab]');
    if(tb){showTab(tb.getAttribute('data-tab'),false);return;}
    const ac=e.target.closest('[data-act]');
    if(ac){
      const a=ac.getAttribute('data-act');
      if(a==='go-quiz')showTab('kuis',true);
      else if(a==='materi')showTab('materi',true);
      else if(a==='again')newQuiz(true);
      else if(a==='next'){
        if(idx<Q.length-1){idx++;answered=false;renderQ(true);}else{renderResult();}
      }
      return;
    }
    const o=e.target.closest('.jv-opt');
    if(o)answer(parseInt(o.getAttribute('data-i'),10));
  });
  root.addEventListener('keydown',e=>{
    if(e.target.closest&&e.target.closest('.jv-tabs')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){
      const to=q$('[data-tab="kuis"]').getAttribute('aria-selected')==='true'?'materi':'kuis';
      showTab(to,false);q$('[data-tab="'+to+'"]').focus();
    }
  });
  document.addEventListener('keydown',e=>{
    if(!root.isConnected||e.ctrlKey||e.metaKey||e.altKey)return;
    const t=e.target;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable))return;
    const p=q$('[data-panel="kuis"]');
    if(p.hidden||!root.offsetParent||answered||!Q.length||log.length>=Q.length)return;
    const n=parseInt(e.key,10);
    if(n>=1&&n<=Q[idx].opts.length)answer(n-1);
  });

  newQuiz(false);
}


const td=(h,c)=>'<div class="jv-td'+(c?' '+c:'')+'">'+h+'</div>';
const tr=(cls,cells)=>'<div class="jv-tr '+cls+'">'+cells.join('')+'</div>';
const H2=(t,gap)=>'<div class="jv-h2'+(gap?' jv-gap':'')+'" role="heading" aria-level="2">'+t+'</div>';
const wl=ws=>'<ul class="jv-words">'+ws.map(w=>'<li>'+jw(w.g)+'<span><b>'+esc(w.l)+'</b><small>'+esc(w.arti)+'</small></span></li>').join('')+'</ul>';
function materiHtml(){
  const kra=mkMed('k','r','a'),kya=mkMed('k','y','a'),kri=mkMed('k','r','i');
  const medT=tr('jv-c-pn jv-th',[td('Nama'),td('Bunyi'),td('Letak'),td('Contoh')])+

    tr('jv-c-pn',[td('pengkal','jv-vb'),td('y'),td('menempel di bawah aksara'),td(jw(kya.g)+'<span class="jv-lt">'+kya.l+'</span>')]);

    '<span class="jv-id">'+esc(u.id)+'</span></li>').join('');
  const nas=tr('jv-c-2 jv-th',[td('Kata dasar'),td('Dengan ater-ater N-')])+NS.map(r=>tr('jv-c-2',[td(esc(r[0])),td('<b>'+esc(r[1])+'</b> <small>('+esc(r[2])+')</small>')])).join('');
  return '<div class="jv-stack">'+
    '<section>'+H2('Cakra dan pengkal')+
    '<p class="jv-intro">Di Level 4 kamu belajar pasangan. Pasangan <b>ra</b> dan <b>ya</b> berbentuk khusus: cakra dan pengkal. Keduanya menempel di bawah konsonan sebelumnya <b>tanpa pangkon</b>.</p>'+
    '<div>'+medT+'</div>'+
    '<p class="jv-hint">Sandhangan swara menyusul setelahnya: '+jw(kri.g)+' = kri. Urutannya konsonan + cakra/pengkal + vokal + panyigeg.</p>'+
    H2('Contoh kata',true)+wl(CAK.concat(PEN))+'</section>'+
    '<section>'+H2('Unggah-ungguh basa')+
    '<p class="jv-intro">Tingkat tutur menentukan kata yang dipakai. Ada empat tingkat umum:</p>'+
    '<ul class="jv-rules">'+
    '<li><b>Ngoko lugu</b>: ngoko seluruhnya, untuk teman akrab atau yang lebih muda.</li>'+
    '<li><b>Ngoko alus</b>: ngoko, tetapi orang yang dihormati diberi kata krama inggil.</li>'+
    '<li><b>Krama lugu</b>: krama untuk bicara sopan, tanpa kata inggil.</li>'+
    '<li><b>Krama alus</b>: krama dengan kata krama inggil untuk orang yang dihormati. Ini tingkat paling hormat.</li></ul>'+
    '<ul class="jv-sent">'+uu+'</ul>'+
    '<p class="jv-hint">Krama andhap merendahkan diri sendiri di depan orang yang dihormati, misalnya \u201cmatur\u201d (berkata) dan \u201csowan\u201d (bertamu). Kata itu hanya untuk perbuatanmu sendiri.</p></section>'+
    '<section>'+H2('Ater-ater')+
    '<p class="jv-intro">Ater-ater menempel di depan kata dasar.</p>'+
    '<ul class="jv-rules">'+
    '<li><b>dak-</b> pelaku \u201caku\u201d, <b>kok-</b> pelaku \u201ckamu\u201d, <b>di-</b> pelaku orang ketiga: dakwaca, kokwaca, diwaca.</li>'+
    '<li><b>ke-</b> perbuatan yang menimpa tanpa sengaja: kesandhung (tersandung).</li>'+
    '<li><b>sa-</b> \u201csatu\u201d: sadina (sehari), sakilo (sekilo).</li>'+
    '<li><b>N- (nasal)</b> membentuk kata kerja aktif. Huruf pertama berubah: w, p \u2192 m; t \u2192 n; s \u2192 ny; k \u2192 ng; g \u2192 ngg; j \u2192 nj; b \u2192 mb; d \u2192 nd.</li></ul>'+
    '<div>'+nas+'</div></section>'+
    '<section>'+H2('Panambang')+
    '<p class="jv-intro">Panambang menempel di belakang kata dasar.</p>'+
    '<ul class="jv-rules">'+
    '<li><b>-ku, -mu</b> milikku, milikmu: omahku, omahmu.</li>'+
    '<li><b>-\u00e9</b> miliknya, setelah konsonan: omah\u00e9. <b>-n\u00e9</b> setelah vokal: bukun\u00e9.</li>'+
    '<li><b>-an</b> membentuk kata benda: dolan \u2192 dolanan, tulis \u2192 tulisan.</li>'+
    '<li><b>-ak\u00e9</b> melakukan untuk orang lain: nulis \u2192 nulisak\u00e9 (menuliskan).</li></ul></section>'+
    '<section>'+H2('Catatan')+'<ul class="jv-notes">'+
    '<li>Contoh kalimat memakai ejaan umum Jawa. Variasi daerah (Solo, Yogya, Jawa Timur) bisa berbeda.</li>'+
    '<li>Level 1 berikutnya: transliterasi paragraf, tembung saroja, parikan, dan wangsalan.</li></ul></section>'+
    '<button type="button" class="jv-main" data-act="go-quiz">Mulai kuis 20 soal</button></div>';
}
