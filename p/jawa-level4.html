const PASSTEMS=STEMS.filter(s=>s!=='r'&&s!=='y');

const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);const t=a[i];a[i]=a[j];a[j]=t;}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jw=s=>'<span class="jw">'+s+'</span>';

/* token: syl (suku kata, boleh dengan panyigeg), fin (konsonan + pangkon di akhir kata), clu (konsonan mati + pasangan) */
function mkTok(t){
  if(t.k==='syl'){t.g=BASE[t.stem]+SIGN[t.v]+(t.fin?FINS[t.fin]:'');t.l=t.stem+t.v+(t.fin||'');}
  else if(t.k==='fin'){t.g=BASE[t.stem]+PANG;t.l=t.stem;}
  else{t.g=BASE[t.stem]+PANG+BASE[t.stem2]+SIGN[t.v]+(t.fin?FINS[t.fin]:'');t.l=t.stem+t.stem2+t.v+(t.fin||'');}
  return t;
}
const parseTok=s=>{
  let fin=null;
  if(s.indexOf('+')>-1){const a=s.split('+');s=a[0];fin=a[1];}
  if(s.slice(-1)==='.')return mkTok({k:'fin',stem:s.slice(0,-1)});
  if(s.indexOf('.')>-1){const a=s.split('.');return mkTok({k:'clu',stem:a[0],stem2:a[1].slice(0,-1),v:a[1].slice(-1),fin:fin});}
  return mkTok({k:'syl',stem:s.slice(0,-1),v:s.slice(-1),fin:fin});
};
const wordOf=(toks,arti)=>({toks:toks,g:toks.map(t=>t.g).join(''),l:toks.map(t=>t.l).join(''),arti:arti});
const mkWord=(spec,arti)=>wordOf(spec.split('-').map(parseTok),arti);

const PAN=[
  mkWord('pa-sa+r','pasar'),mkWord('la-wa+ng','pintu'),mkWord('sa-wa+h','sawah'),mkWord('da-la-n.','jalan'),
  mkWord('ma-nu-k.','burung'),mkWord('gu-nu+ng','gunung'),mkWord('wu-la-n.','bulan'),mkWord('lo+r','utara'),
  mkWord('ki-du-l.','selatan'),mkWord('w'+E+'-ta-n.','timur'),mkWord('ku-lo-n.','barat'),mkWord('ta-nga-n.','tangan'),
  mkWord('s'+P+'-ka+r','bunga'),mkWord('ga-ja+h','gajah'),mkWord('l'+P+'-ma+h','tanah'),mkWord('pu-ti+h','putih'),
  mkWord('ku-ni+ng','kuning'),mkWord('ci-li-k.','kecil'),mkWord('ca+ng-ki+r','cangkir')
];
const PAS=[
  mkWord('k'+P+'-m.ba+ng','bunga'),mkWord('la-m.pu','lampu'),mkWord('ka-n.ci-l.','kancil'),mkWord('ba-n.ta-l.','bantal'),
  mkWord('ga-n.tu+ng','gantung'),mkWord('k'+P+'-n.dha+ng','kendang'),mkWord('sa-m.pu-n.','sudah (krama)'),
  mkWord('m.bo-t'+E+'-n.','tidak (krama)'),mkWord('ga-m.ba+r','gambar'),mkWord('t'+P+'-m.bu+ng','kata')
];

const PAIRS=[
  ['aku','kula','saya'],['kow'+E,'samp'+E+'yan','kamu'],['iya','inggih','ya'],['ora','mboten','tidak'],
  ['wis','sampun','sudah'],['durung','dereng','belum'],['ana','wonten','ada'],['apa','menapa','apa'],
  ['mangan','nedha','makan'],['turu','tilem','tidur'],['mulih','wangsul','pulang'],['tuku','tumbas','membeli'],
  ['sapa','sinten','siapa'],['pira','pinten','berapa'],['arep','badh'+E,'akan, mau'],['omah','griya','rumah']
];
const SENT=[
  {ng:'Aku arep tuku buku.',kr:'Kula badh'+E+' tumbas buku.',wr:['Aku badh'+E+' tumbas buku.','Kula arep tuku buku.','Kula badh'+E+' tuku buku.'],id:'Saya mau beli buku.'},
  {ng:'Aku ora ngerti.',kr:'Kula mboten ngertos.',wr:['Aku mboten ngertos.','Kula ora ngertos.','Aku ora ngertos.'],id:'Saya tidak mengerti.'},
  {ng:'Kow'+E+' wis mangan?',kr:'Samp'+E+'yan sampun nedha?',wr:['Kow'+E+' sampun nedha?','Samp'+E+'yan wis mangan?','Samp'+E+'yan sampun mangan?'],id:'Kamu sudah makan?'},
  {ng:'Aku durung mulih.',kr:'Kula dereng wangsul.',wr:['Aku dereng wangsul.','Kula durung mulih.','Kula dereng mulih.'],id:'Saya belum pulang.'}
];

/* pengecoh: ubah vokal, ubah panyigeg, atau lepas pangkon */
function variants(w){
  const structural=[],other=[];
  w.toks.forEach((t,i)=>{
    const rep=(arr,rt)=>{arr.push(wordOf(w.toks.slice(0,i).concat(rt,w.toks.slice(i+1)),''));};
    if(t.k==='syl'||t.k==='clu'){
      VOW.forEach(v=>{if(v!==t.v)rep(other,[mkTok(Object.assign({},t,{v:v}))]);});
      if(t.fin)FSET.forEach(f=>{if(f!==t.fin)rep(other,[mkTok(Object.assign({},t,{fin:f}))]);});
    }
    if(t.k==='fin'){
      rep(structural,[mkTok({k:'syl',stem:t.stem,v:'a',fin:null})]);
      ['n','k','l','t','m','p','s'].forEach(s=>{if(s!==t.stem)rep(other,[mkTok({k:'fin',stem:s})]);});
    }
    if(t.k==='clu'){
      rep(structural,[mkTok({k:'syl',stem:t.stem,v:'a',fin:null}),mkTok({k:'syl',stem:t.stem2,v:t.v,fin:t.fin})]);
    }
  });
  const seen={};seen[w.l]=1;
  const pick=[];
  const first=shuffle(structural).filter(x=>!seen[x.l])[0];
  if(first){seen[first.l]=1;pick.push(first);}
  shuffle(other).concat(shuffle(structural)).forEach(x=>{if(!seen[x.l]&&pick.length<3){seen[x.l]=1;pick.push(x);}});
  return pick;
}

const whyTok=t=>{
  if(t.k==='fin')return jw(t.g)+' = '+jw(BASE[t.stem])+' + pangkon. Pangkon mematikan vokal \u201ca\u201d, jadi hanya terdengar <b>'+t.l+'</b>.';
  return jw(t.g)+' = '+jw(BASE[t.stem]+SIGN[t.v])+' ('+t.stem+t.v+') + '+FINNAME[t.fin]+' (\u201c'+t.fin+'\u201d) \u2192 <b>'+t.l+'</b>.';
};
const whyWord=w=>{
  let s=w.toks.map(t=>jw(t.g)+' ('+t.l+')').join(' + ')+' \u2192 <b>'+w.l+'</b>, artinya \u201c'+w.arti+'\u201d.';
  const cl=w.toks.filter(t=>t.k==='clu');
  if(cl.length)s+=' Pasangan: '+cl.map(t=>t.stem+' + '+t.stem2).join(', ')+'.';
  return s;
};

function mk(sec,ask,prompt,correct,wrongs,glyph,why){
  const seen={};seen[correct]=1;
  const wr=[];
  wrongs.forEach(w=>{if(!seen[w]){seen[w]=1;wr.push(w);}});
  let arr=[{t:correct,ok:true}].concat(wr.slice(0,3).map(w=>({t:w,ok:false})));
  arr=shuffle(arr);
  let ans=0;
  arr.forEach((o,i)=>{if(o.ok)ans=i;o.glyph=glyph;});
  return {sec:sec,ask:ask,prompt:prompt,opts:arr,ans:ans,why:why};
}

function buildQuiz(){
  const A=[],B=[],C=[];
  const five=['i','u',E,P,'o'];
  const stems=shuffle(STEMS);

  /* Bagian 1: panyigeg (6 soal) */
  {
    const stem=stems[0],f=['r','ng','h','pangkon'][rnd(4)];
    const tk=f==='pangkon'?mkTok({k:'fin',stem:stem}):mkTok({k:'syl',stem:stem,v:'a',fin:f});
    const opts=[mkTok({k:'syl',stem:stem,v:'a',fin:'r'}),mkTok({k:'syl',stem:stem,v:'a',fin:'ng'}),mkTok({k:'syl',stem:stem,v:'a',fin:'h'}),mkTok({k:'fin',stem:stem}),mkTok({k:'syl',stem:stem,v:'a',fin:null})];
    A.push(mk(0,'Bagaimana suku kata ini dibaca?',{type:'glyph',text:tk.g},tk.l,opts.map(o=>o.l).filter(l=>l!==tk.l),false,whyTok(tk)));
  }
  {
    const stem=stems[1],v=five[rnd(5)],f=FSET[rnd(3)];
    const tk=mkTok({k:'syl',stem:stem,v:v,fin:f});
    const wr=FSET.filter(x=>x!==f).map(x=>mkTok({k:'syl',stem:stem,v:v,fin:x}).l).concat([mkTok({k:'syl',stem:stem,v:v,fin:null}).l]);
    A.push(mk(0,'Bagaimana suku kata ini dibaca?',{type:'glyph',text:tk.g},tk.l,wr,false,whyTok(tk)));
  }
  {
    const stem=stems[2],v=five[rnd(5)],f=FSET[rnd(3)];
    const tk=mkTok({k:'syl',stem:stem,v:v,fin:f});
    const wr=FSET.filter(x=>x!==f).map(x=>mkTok({k:'syl',stem:stem,v:v,fin:x}).g).concat([mkTok({k:'syl',stem:stem,v:v,fin:null}).g]);
    A.push(mk(0,'Mana tulisan Jawa untuk suku kata ini?',{type:'latin',text:tk.l},tk.g,wr,true,whyTok(tk)));
  }
  {
    const stem=stems[3],f=['r','ng','h','pangkon'][rnd(4)];
    const tk=f==='pangkon'?mkTok({k:'fin',stem:stem}):mkTok({k:'syl',stem:stem,v:'a',fin:f});
    const name=f==='pangkon'?'pangkon':FINNAME[f];
    const expl={r:'menutup suku kata dengan bunyi \u201cr\u201d',ng:'menutup suku kata dengan bunyi \u201cng\u201d',h:'menutup suku kata dengan bunyi \u201ch\u201d',pangkon:'mematikan vokal \u201ca\u201d sehingga hanya terdengar konsonannya'}[f];
    A.push(mk(0,'Tanda penutup pada aksara ini bernama \u2026',{type:'glyph',text:tk.g},name,['layar','cecak','wignyan','pangkon'].filter(x=>x!==name),false,
      jw(tk.g)+' memakai <b>'+name+'</b>, yang '+expl+'. Dibaca <b>'+tk.l+'</b>.'));
  }
  const pw=shuffle(PAN);
  {
    const w=pw[0];
    A.push(mk(0,'Bagaimana kata ini dibaca?',{type:'word',text:w.g},w.l,variants(w).map(o=>o.l),false,whyWord(w)));
  }
  {
    const w=pw[1];
    A.push(mk(0,'Mana tulisan Jawa untuk kata ini?',{type:'latin',text:w.l},w.g,variants(w).map(o=>o.g),true,whyWord(w)));
  }

  /* Bagian 2: pasangan (8 soal) */
  const cs=shuffle(PASSTEMS);
  [0,1].forEach(k=>{
    const a=['n','m'][rnd(2)],b=cs[k];
    const g=BASE[a]+PANG+BASE[b],l=a+b+'a';
    const wr=shuffle(PASSTEMS.filter(x=>x!==b)).slice(0,3).map(x=>a+x+'a');
    B.push(mk(1,'Bagaimana gugus ini dibaca?',{type:'glyph',text:g},l,wr,false,
      jw(g)+' = '+jw(BASE[a])+' ('+a+') + pangkon + pasangan '+b+' \u2192 <b>'+l+'</b>. Pangkon mematikan vokal \u201c'+a+'\u201d, lalu \u201c'+b+'a\u201d ditulis sebagai pasangan.'));
  });
  const CON=[
    {ask:'Pasangan dipakai untuk \u2026',ok:'menyambung konsonan penutup suku kata dengan konsonan awal suku kata berikutnya',wr:['mengubah bunyi \u201ca\u201d menjadi \u201ci\u201d','menutup kata dengan bunyi \u201cr\u201d','menandai awal kalimat'],
     why:'Contoh: lampu = la + m + pu. \u201cm\u201d menutup suku kata pertama, jadi \u201cpu\u201d ditulis sebagai pasangan: '+jw(mkWord('la-m.pu','').g)+'.'},
    {ask:'Pada kata \u201ccangkir\u201d, bunyi \u201cng\u201d dan \u201cr\u201d ditulis dengan \u2026',ok:'cecak dan layar, bukan pasangan',wr:['pasangan nga dan pasangan ra','dua pangkon','wignyan dan layar'],
     why:'Bunyi ng, r, dan h punya sandhangan sendiri (cecak, layar, wignyan), jadi tidak memakai pasangan, juga di tengah kata. '+jw(mkWord('ca+ng-ki+r','').g)+' = ca+ng, ki+r.'},
    {ask:'Pangkon di akhir kata berfungsi \u2026',ok:'mematikan vokal \u201ca\u201d pada konsonan terakhir',wr:['mengubah \u201ca\u201d menjadi \u201co\u201d','menambah bunyi \u201cng\u201d','menjadikan aksara huruf besar'],
     why:'Contoh: '+jw(mkWord('da-la-n.','').g)+' = da + la + n. Tanpa pangkon, \ua9a4 dibaca \u201cna\u201d dan kata menjadi dalana.'}
  ];
  shuffle(CON).slice(0,2).forEach(c=>{
    B.push(mk(1,c.ask,{type:'none',text:'Konsep'},c.ok,c.wr,false,c.why));
  });
  const sw=shuffle(PAS);
  [0,1].forEach(k=>{const w=sw[k];
    B.push(mk(1,'Bagaimana kata ini dibaca?',{type:'word',text:w.g},w.l,variants(w).map(o=>o.l),false,whyWord(w)));
  });
  [2,3].forEach(k=>{const w=sw[k];
    B.push(mk(1,'Mana tulisan Jawa untuk kata ini?',{type:'latin',text:w.l},w.g,variants(w).map(o=>o.g),true,whyWord(w)));
  });

  /* Bagian 3: ngoko dan krama (6 soal) */
  const pr=shuffle(PAIRS);
  const whyPair=p=>'\u201c'+p[0]+'\u201d (ngoko) = \u201c'+p[1]+'\u201d (krama), artinya '+p[2]+'.';
  [0,1,2].forEach(k=>{
    const p=pr[k];
    const wr=shuffle(PAIRS.filter(x=>x!==p)).slice(0,3).map(x=>x[1]);
    C.push(mk(2,'Apa bentuk krama dari kata ngoko ini?',{type:'latin',text:p[0]},p[1],wr,false,whyPair(p)));
  });
  [3,4].forEach(k=>{
    const p=pr[k];
    const wr=shuffle(PAIRS.filter(x=>x!==p)).slice(0,3).map(x=>x[0]);
    C.push(mk(2,'Apa bentuk ngoko dari kata krama ini?',{type:'latin',text:p[1]},p[0],wr,false,whyPair(p)));
  });
  {
    const s=SENT[rnd(SENT.length)];
    C.push(mk(2,'Pilih kalimat krama yang tepat.',{type:'text',text:s.ng},s.kr,s.wr,false,
      '\u201c'+s.ng+'\u201d menjadi \u201c'+s.kr+'\u201d. Semua kata ditukar ke krama, tidak dicampur. Artinya: '+s.id));
  }
  return [].concat(shuffle(A),shuffle(B),shuffle(C));
}

/*==DOM==*/
function JVApp(cfg){
  const root=document.getElementById(cfg.id);
  if(!root)return;
  const q$=s=>root.querySelector(s);
  const qa=s=>root.querySelectorAll(s);
  const SECN=cfg.secNames,PASS=cfg.pass,KEY=cfg.key;
  let Q=[],idx=0,score=0,log=[],answered=false;

  const getBest=()=>{try{const v=parseInt(localStorage.getItem(KEY),10);return isNaN(v)?null:v;}catch(e){return null;}};
  const setBest=n=>{try{localStorage.setItem(KEY,String(n));}catch(e){}};

  const links=(cfg.links||[]).map(l=>'<a href="'+l.href+'">'+esc(l.label)+'</a>').join('');
  root.innerHTML=
    '<div class="jv-top"><p class="jv-hero jw" aria-hidden="true">'+cfg.hero+'</p><p class="jv-lede">'+esc(cfg.lede)+'</p>'+(links?'<p class="jv-links">'+links+'</p>':'')+'</div>'+
    '<div class="jv-tabs" role="tablist" aria-label="Bagian belajar">'+
      '<button type="button" class="jv-tab" role="tab" data-tab="materi" aria-selected="true">Materi</button>'+
      '<button type="button" class="jv-tab" role="tab" data-tab="kuis" aria-selected="false" tabindex="-1">Kuis</button>'+
    '</div>'+
    '<div class="jv-panel" data-panel="materi" role="tabpanel">'+cfg.materi()+'</div>'+
    '<div class="jv-panel" data-panel="kuis" role="tabpanel" hidden><div class="jv-quiz"></div></div>';
  const quiz=q$('.jv-quiz');

  function showTab(name,scroll){
    ['materi','kuis'].forEach(n=>{
      const on=n===name,t=q$('[data-tab="'+n+'"]');
      t.setAttribute('aria-selected',on?'true':'false');
      t.tabIndex=on?0:-1;
      q$('[data-panel="'+n+'"]').hidden=!on;
    });
    if(scroll)root.scrollIntoView({block:'start'});
  }

  const promptHtml=p=>{
    if(p.type==='glyph')return '<p class="jv-pg jw">'+p.text+'</p>';
    if(p.type==='word')return '<p class="jv-pg jv-pw jw">'+p.text+'</p>';
    if(p.type==='latin')return '<p class="jv-pt">'+esc(p.text)+'</p>';
    if(p.type==='sent')return '<p class="jv-pg jv-ps jw">'+p.text+'</p>';
    if(p.type==='lines')return '<p class="jv-pt jv-pt-sm jv-pl">'+esc(p.text).replace(/\n/g,'<br>')+'</p>';
    if(p.type==='none')return '';
    return '<p class="jv-pt jv-pt-sm">'+esc(p.text)+'</p>';
  };
  const optHtml=o=>o.glyph?jw(o.t):esc(o.t);

  function renderQ(scroll){
    const q=Q[idx];
    let h='<div class="jv-qhead"><span>Soal <b>'+(idx+1)+'</b> dari '+Q.length+'</span><span class="jv-qsec">Bagian '+(q.sec+1)+' \u00b7 '+esc(SECN[q.sec])+'</span></div>';
    h+='<div class="jv-bar" role="progressbar" aria-label="Kemajuan kuis" aria-valuemin="0" aria-valuemax="'+Q.length+'" aria-valuenow="'+idx+'"><i></i></div>';
    h+='<section class="jv-prompt'+(q.prompt.type==='none'?' jv-prompt-q':'')+'"><p class="jv-ask">'+esc(q.ask)+'</p>'+promptHtml(q.prompt)+'</section>';
    h+='<div class="jv-opts '+(q.opts[0].glyph?'jv-opts-glyph':'jv-opts-text')+(q.wide?' jv-opts-wide':'')+'" role="group" aria-label="Pilihan jawaban">';
    q.opts.forEach((o,i)=>{
      h+='<button type="button" class="jv-opt" data-i="'+i+'">'+(o.glyph?'<span class="jw jv-jwo">'+o.t+'</span>':'<span class="jv-ot">'+esc(o.t)+'</span>')+'<span class="jv-tag" hidden></span></button>';
    });
    h+='</div><div class="jv-fb" role="status" aria-live="polite" hidden></div><button type="button" class="jv-main jv-next" data-act="next" hidden>Soal berikutnya</button>';
    quiz.innerHTML=h;
    quiz.querySelector('.jv-bar i').style.width=(idx/Q.length*100)+'%';
    if(scroll)quiz.querySelector('.jv-qhead').scrollIntoView({block:'start'});
  }

  function answer(i){
    if(answered)return;
    answered=true;
    const q=Q[idx],ok=i===q.ans;
    if(ok)score++;
    log.push({q:q,pick:i,ok:ok});
    qa('.jv-opt').forEach((b,j)=>{
      b.classList.add('is-locked');
      const tag=b.querySelector('.jv-tag');
      if(j===q.ans){b.classList.add('is-correct');tag.textContent='Benar';tag.hidden=false;}
      else if(j===i){b.classList.add('is-wrong');tag.textContent='Pilihanmu';tag.hidden=false;}
    });
    const fb=q$('.jv-fb');
    fb.className='jv-fb '+(ok?'is-good':'is-bad');
    fb.innerHTML='<p class="jv-fbt">'+(ok?'Benar':'Belum tepat')+'</p><p class="jv-fbw">'+q.why+'</p>';
    fb.hidden=false;
    const nx=q$('.jv-next');
    nx.textContent=idx===Q.length-1?'Lihat hasil':'Soal berikutnya';
    nx.hidden=false;
    nx.focus({preventScroll:true});
    nx.scrollIntoView({block:'nearest'});
  }

  function renderResult(){
    const secTot=SECN.map(()=>0),secOk=SECN.map(()=>0);
    log.forEach(l=>{secTot[l.q.sec]++;if(l.ok)secOk[l.q.sec]++;});
    let best=getBest();
    if(best===null||score>best){best=score;setBest(score);}
    const pass=score>=PASS;
    let h='<div class="jv-result"><p class="jv-rlabel">Hasil</p><p class="jv-rscore">'+score+'<small> / '+Q.length+'</small></p>';
    h+='<p class="jv-rverdict '+(pass?'is-good':'is-bad')+'">'+(pass?'Lulus':'Belum lulus')+' \u00b7 batas lulus '+PASS+' dari '+Q.length+'</p>';
    h+='<p class="jv-rbest">Skor terbaik di perangkat ini: '+best+' / '+Q.length+'</p><div class="jv-secs">';
    SECN.forEach((n,s)=>{
      h+='<div class="jv-sec"><span>'+esc(n)+'</span><div class="jv-bar"><i data-w="'+(secTot[s]?secOk[s]/secTot[s]*100:0)+'"></i></div><span class="jv-n">'+secOk[s]+'/'+secTot[s]+'</span></div>';
    });
    h+='</div>';
    const wrong=log.filter(l=>!l.ok);
    h+='<div class="jv-h3" role="heading" aria-level="3">'+(wrong.length?'Perlu diulang':'Semua jawaban benar')+'</div>';
    if(wrong.length){
      h+='<ul class="jv-wrongs">';
      wrong.forEach(l=>{
        const p=l.q.prompt,pj=(p.type==='glyph'||p.type==='word'||p.type==='sent');
        h+='<li><span class="jv-rq">'+(pj?jw(p.text):esc(p.text))+'</span><span class="jv-ra">Benar: <b>'+optHtml(l.q.opts[l.q.ans])+'</b><span class="jv-rb">Pilihanmu: '+optHtml(l.q.opts[l.pick])+'</span></span></li>';
      });
      h+='</ul>';
    }else{h+='<p class="jv-intro">'+esc(cfg.doneNote)+'</p>';}
    h+='<button type="button" class="jv-main" data-act="again">Ulangi dengan soal baru</button>';
    if(pass&&cfg.next)h+='<a class="jv-alt" href="'+cfg.next.href+'">'+esc(cfg.next.label)+'</a>';
    h+='<button type="button" class="jv-alt" data-act="materi">Buka materi</button></div>';
    quiz.innerHTML=h;
    quiz.querySelectorAll('.jv-sec .jv-bar i').forEach(i=>{i.style.width=i.getAttribute('data-w')+'%';});
    quiz.querySelector('.jv-result').scrollIntoView({block:'start'});
  }

  function newQuiz(scroll){
    Q=buildQuiz();idx=0;score=0;log=[];answered=false;
    renderQ(scroll);
  }

  root.addEventListener('click',e=>{
    const tb=e.target.closest('[data-tab]');
    if(tb){showTab(tb.getAttribute('data-tab'),false);return;}
    const ac=e.target.closest('[data-act]');
    if(ac){
      const a=ac.getAttribute('data-act');
      if(a==='go-quiz')showTab('kuis',true);
      else if(a==='materi')showTab('materi',true);
      else if(a==='again')newQuiz(true);
      else if(a==='next'){
        if(idx<Q.length-1){idx++;answered=false;renderQ(true);}else{renderResult();}
      }
      return;
    }
    const o=e.target.closest('.jv-opt');
    if(o)answer(parseInt(o.getAttribute('data-i'),10));
  });
  root.addEventListener('keydown',e=>{
    if(e.target.closest&&e.target.closest('.jv-tabs')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){
      const to=q$('[data-tab="kuis"]').getAttribute('aria-selected')==='true'?'materi':'kuis';
      showTab(to,false);q$('[data-tab="'+to+'"]').focus();
    }
  });
  document.addEventListener('keydown',e=>{
    if(!root.isConnected||e.ctrlKey||e.metaKey||e.altKey)return;
    const t=e.target;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable))return;
    const p=q$('[data-panel="kuis"]');
    if(p.hidden||!root.offsetParent||answered||!Q.length||log.length>=Q.length)return;
    const n=parseInt(e.key,10);
    if(n>=1&&n<=Q[idx].opts.length)answer(n-1);
  });

  newQuiz(false);
}

  return '<div class="jv-stack">'+
    '<section><div class="jv-h2" role="heading" aria-level="2">Sandhangan panyigeg</div>'+
    '<p class="jv-intro">Di Level 5, setiap suku kata berakhir dengan vokal. Panyigeg menutup suku kata dengan konsonan. Contoh memakai \ua98f (ka).</p>'+
    '<div>'+finTable+'</div>'+
    '<p class="jv-hint">Layar, cecak, dan wignyan menempel pada suku kata. Pangkon dipakai di akhir kata untuk konsonan lain, seperti n, k, l, t, m, dan p.</p>'+
    '<div class="jv-h2 jv-gap" role="heading" aria-level="2">Contoh kata</div><ul class="jv-words">'+wordList(PAN)+'</ul></section>'+
    '<section><div class="jv-h2" role="heading" aria-level="2">Pasangan</div>'+
    '<p class="jv-intro">Bila konsonan penutup suku kata bertemu konsonan awal suku kata berikutnya dalam satu kata, konsonan penutup dimatikan dengan pangkon dan konsonan berikutnya ditulis sebagai <b>pasangan</b>.</p>'+
    '<ul class="jv-rules">'+
    '<li>lampu = la + m + pu. Konsonan \u201cm\u201d menutup suku kata pertama, jadi \u201cpu\u201d menjadi pasangan: \ua9ad\ua9a9\ua9c0\ua9a5\ua9b8.</li>'+
    '<li>Bunyi r, ng, dan h tidak memakai pasangan. Mereka memakai layar, cecak, dan wignyan, juga di tengah kata: cangkir = \ua995\ua981\ua98f\ua9b6\ua982.</li>'+
    '<li>Tanpa pangkon, aksara dibaca penuh. \ua9ad\ua9a9\ua9a5\ua9b8 dibaca lamapu, bukan lampu.</li></ul>'+
    '<div class="jv-pgrid">'+pgrid+'</div>'+
    '<p class="jv-hint">Delapan belas pasangan, semuanya ditulis setelah \ua9a4 (na) sebagai pembawa. Pasangan ra dan ya berbentuk khusus, dibahas di Level 2.</p>'+
    '<div class="jv-h2 jv-gap" role="heading" aria-level="2">Contoh kata</div><ul class="jv-words">'+wordList(PAS)+'</ul></section>'+
    '<section><div class="jv-h2" role="heading" aria-level="2">Ngoko dan krama</div>'+
    '<p class="jv-intro"><b>Ngoko</b> dipakai untuk teman akrab atau yang lebih muda. <b>Krama</b> dipakai untuk bicara sopan. Krama inggil, untuk menghormati lawan bicara, dibahas di Level 3.</p>'+
    '<div>'+pairs+'</div>'+
    '<p class="jv-hint">\u201cSamp\u00e9yan\u201d termasuk krama madya. Untuk menghormati lawan bicara dipakai \u201cpanjenengan\u201d (Level 3).</p>'+
    '<ul class="jv-sent">'+sent+'</ul></section>'+
    '<section><div class="jv-h2" role="heading" aria-level="2">Catatan</div><ul class="jv-notes">'+
    '<li>Kata dengan banyak suku kata tidak diberi spasi, sama seperti di Level 5.</li>'+
    '<li>Bentuk pasangan bergantung pada font. Bila tampilan di perangkatmu berbeda dari contoh, tulis latinnya di bawah tiap aksara sebagai pegangan.</li>'+
    '<li>Level 3 berikutnya: aksara murda, aksara swara, aksara r\u00e9kan, angka Jawa, dan krama inggil.</li></ul></section>'+
    '<button type="button" class="jv-main" data-act="go-quiz">Mulai kuis 20 soal</button></div>';
}
