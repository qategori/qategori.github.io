  A.push(mk(0,'Mana tulisan untuk \u201c'+wa[2].l+'\u201d?',{type:'latin',text:wa[2].l},wa[2].g,sVariants(wa[2]).map(x=>x.g),true,whyW(wa[2])));
  /* Bagian 2: kruna (7) */
  for(let n=3;n<6;n++){const w=wa[n];B.push(mk(1,'Bagaimana kata ini dibaca?',{type:'word',text:w.g},w.l,sVariants(w).map(x=>x.l),false,whyW(w)));}
  for(let n=6;n<10;n++){const w=wa[n];B.push(mk(1,'Mana tulisan untuk \u201c'+w.l+'\u201d?',{type:'latin',text:w.l},w.g,sVariants(w).map(x=>x.g),true,whyW(w)));}
  /* Bagian 3: sor singgih (6) */
  const up=shuffle(UP);
  const whyU=r=>'\u201c'+r[0]+'\u201d (andap) = \u201c'+r[1]+'\u201d (alus sor, untuk diri sendiri) = \u201c'+r[2]+'\u201d (alus singgih, untuk orang yang dihormati), artinya '+r[3]+'.';
  const dist=(r,i)=>shuffle(UP.filter(x=>x!==r&&x[i]!==r[i])).slice(0,3).map(x=>x[i]);
  [0,1].forEach(k=>{const r=up.filter(x=>x[1]!==x[2])[k];C.push(mk(2,'Apa kata alus singgih (untuk orang yang dihormati) dari kata andap ini?',{type:'latin',text:r[0]},r[2],[r[1]].concat(dist(r,2)),false,whyU(r)));});
  {const r=up.filter(x=>x[1]!==x[2])[2];C.push(mk(2,'Apa kata alus sor (untuk diri sendiri) dari kata andap ini?',{type:'latin',text:r[0]},r[1],[r[2]].concat(dist(r,1)),false,whyU(r)));}
  {const r=up.filter(x=>x[0]!==x[2])[3];C.push(mk(2,'Apa bentuk andap dari kata alus ini?',{type:'latin',text:r[2]},r[0],dist(r,0),false,whyU(r)));}
  {const s=shuffle(SENT4)[0];C.push(mk(2,'Pilih kalimat alus yang tepat untuk dirimu sendiri / orang yang dihormati.',{type:'text',text:s.lo},s.ok,s.wr,false,'\u201c'+s.lo+'\u201d menjadi \u201c'+s.ok+'\u201d. Artinya: '+s.id));}
  C.push(mk(2,'Kamu berbicara tentang dirimu sendiri kepada orang tua. Kalimat mana yang tepat?',{type:'none',text:'Konsep'},'Tiang jagi nunas.',['Tiang jagi ngerayunang.','Icang jagi ngerayunang.','Tiang jagi madaar.'],false,'Kata alus singgih (ngerayunang) tidak dipakai untuk diri sendiri. Untuk dirimu, pakai \u201cnunas\u201d (alus sor).'));
  const R_=[].concat(shuffle(A),shuffle(B),shuffle(C));
  R_.forEach(q=>{if(!q.opts[0].glyph&&q.opts.some(o=>o.t.length>28))q.wide=true;});
  return R_;
}

const td=(h,c)=>'<div class="jv-td'+(c?' '+c:'')+'">'+h+'</div>';
const tr=(cls,cells)=>'<div class="jv-tr '+cls+'">'+cells.join('')+'</div>';
const H2=(t,gap)=>'<div class="jv-h2'+(gap?' jv-gap':'')+'" role="heading" aria-level="2">'+t+'</div>';
const cellsOf=arr=>'<div class="jv-pgrid">'+arr.map(c=>'<div class="jv-pc">'+jw(c[0])+'<span class="jv-lt">'+c[1]+'</span></div>').join('')+'</div>';
const wordList=ws=>'<ul class="jv-words">'+ws.map(w=>'<li>'+jw(w.g)+'<span><b>'+esc(cap(w.l))+'</b><small>'+esc(w.arti)+'</small></span></li>').join('')+'</ul>';
const notes=a=>'<ul class="jv-notes">'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
const startBtn='<button type="button" class="jv-main" data-act="go-quiz">Mulai kuis 20 soal</button>';

/*==DOM==*/
function JVApp(cfg){
  const root=document.getElementById(cfg.id);
  if(!root)return;
  const q$=s=>root.querySelector(s);
  const qa=s=>root.querySelectorAll(s);
  const SECN=cfg.secNames,PASS=cfg.pass,KEY=cfg.key;
  let Q=[],idx=0,score=0,log=[],answered=false;

  const getBest=()=>{try{const v=parseInt(localStorage.getItem(KEY),10);return isNaN(v)?null:v;}catch(e){return null;}};
  const setBest=n=>{try{localStorage.setItem(KEY,String(n));}catch(e){}};

  const links=(cfg.links||[]).map(l=>'<a href="'+l.href+'">'+esc(l.label)+'</a>').join('');
  root.innerHTML=
    '<div class="jv-top"><p class="jv-hero jw" aria-hidden="true">'+cfg.hero+'</p><p class="jv-lede">'+esc(cfg.lede)+'</p>'+(links?'<p class="jv-links">'+links+'</p>':'')+'</div>'+
    '<div class="jv-tabs" role="tablist" aria-label="Bagian belajar">'+
      '<button type="button" class="jv-tab" role="tab" data-tab="materi" aria-selected="true">Materi</button>'+
      '<button type="button" class="jv-tab" role="tab" data-tab="kuis" aria-selected="false" tabindex="-1">Kuis</button>'+
    '</div>'+
    '<div class="jv-panel" data-panel="materi" role="tabpanel">'+cfg.materi()+'</div>'+
    '<div class="jv-panel" data-panel="kuis" role="tabpanel" hidden><div class="jv-quiz"></div></div>';
  const quiz=q$('.jv-quiz');

  function showTab(name,scroll){
    ['materi','kuis'].forEach(n=>{
      const on=n===name,t=q$('[data-tab="'+n+'"]');
      t.setAttribute('aria-selected',on?'true':'false');
      t.tabIndex=on?0:-1;
      q$('[data-panel="'+n+'"]').hidden=!on;
    });
    if(scroll)root.scrollIntoView({block:'start'});
  }

  const promptHtml=p=>{
    if(p.type==='glyph')return '<p class="jv-pg jw">'+p.text+'</p>';
    if(p.type==='word')return '<p class="jv-pg jv-pw jw">'+p.text+'</p>';
    if(p.type==='latin')return '<p class="jv-pt">'+esc(p.text)+'</p>';
    if(p.type==='sent')return '<p class="jv-pg jv-ps jw">'+p.text+'</p>';
    if(p.type==='lines')return '<p class="jv-pt jv-pt-sm jv-pl">'+esc(p.text).replace(/\n/g,'<br>')+'</p>';
    if(p.type==='none')return '';
    return '<p class="jv-pt jv-pt-sm">'+esc(p.text)+'</p>';
  };
  const optHtml=o=>o.glyph?jw(o.t):esc(o.t);

  function renderQ(scroll){
    const q=Q[idx];
    let h='<div class="jv-qhead"><span>Soal <b>'+(idx+1)+'</b> dari '+Q.length+'</span><span class="jv-qsec">Bagian '+(q.sec+1)+' \u00b7 '+esc(SECN[q.sec])+'</span></div>';
    h+='<div class="jv-bar" role="progressbar" aria-label="Kemajuan kuis" aria-valuemin="0" aria-valuemax="'+Q.length+'" aria-valuenow="'+idx+'"><i></i></div>';
    h+='<section class="jv-prompt'+(q.prompt.type==='none'?' jv-prompt-q':'')+'"><p class="jv-ask">'+esc(q.ask)+'</p>'+promptHtml(q.prompt)+'</section>';
    h+='<div class="jv-opts '+(q.opts[0].glyph?'jv-opts-glyph':'jv-opts-text')+(q.wide?' jv-opts-wide':'')+'" role="group" aria-label="Pilihan jawaban">';
    q.opts.forEach((o,i)=>{
      h+='<button type="button" class="jv-opt" data-i="'+i+'">'+(o.glyph?'<span class="jw jv-jwo">'+o.t+'</span>':'<span class="jv-ot">'+esc(o.t)+'</span>')+'<span class="jv-tag" hidden></span></button>';
    });
    h+='</div><div class="jv-fb" role="status" aria-live="polite" hidden></div><button type="button" class="jv-main jv-next" data-act="next" hidden>Soal berikutnya</button>';
    quiz.innerHTML=h;
    quiz.querySelector('.jv-bar i').style.width=(idx/Q.length*100)+'%';
    if(scroll)quiz.querySelector('.jv-qhead').scrollIntoView({block:'start'});
  }

  function answer(i){
    if(answered)return;
    answered=true;
    const q=Q[idx],ok=i===q.ans;
    if(ok)score++;
    log.push({q:q,pick:i,ok:ok});
    qa('.jv-opt').forEach((b,j)=>{
      b.classList.add('is-locked');
      const tag=b.querySelector('.jv-tag');
      if(j===q.ans){b.classList.add('is-correct');tag.textContent='Benar';tag.hidden=false;}
      else if(j===i){b.classList.add('is-wrong');tag.textContent='Pilihanmu';tag.hidden=false;}
    });
    const fb=q$('.jv-fb');
    fb.className='jv-fb '+(ok?'is-good':'is-bad');
    fb.innerHTML='<p class="jv-fbt">'+(ok?'Benar':'Belum tepat')+'</p><p class="jv-fbw">'+q.why+'</p>';
    fb.hidden=false;
    const nx=q$('.jv-next');
    nx.textContent=idx===Q.length-1?'Lihat hasil':'Soal berikutnya';
    nx.hidden=false;
    nx.focus({preventScroll:true});
    nx.scrollIntoView({block:'nearest'});
  }

  function renderResult(){
    const secTot=SECN.map(()=>0),secOk=SECN.map(()=>0);
    log.forEach(l=>{secTot[l.q.sec]++;if(l.ok)secOk[l.q.sec]++;});
    let best=getBest();
    if(best===null||score>best){best=score;setBest(score);}
    const pass=score>=PASS;
    let h='<div class="jv-result"><p class="jv-rlabel">Hasil</p><p class="jv-rscore">'+score+'<small> / '+Q.length+'</small></p>';
    h+='<p class="jv-rverdict '+(pass?'is-good':'is-bad')+'">'+(pass?'Lulus':'Belum lulus')+' \u00b7 batas lulus '+PASS+' dari '+Q.length+'</p>';
    h+='<p class="jv-rbest">Skor terbaik di perangkat ini: '+best+' / '+Q.length+'</p><div class="jv-secs">';
    SECN.forEach((n,s)=>{
      h+='<div class="jv-sec"><span>'+esc(n)+'</span><div class="jv-bar"><i data-w="'+(secTot[s]?secOk[s]/secTot[s]*100:0)+'"></i></div><span class="jv-n">'+secOk[s]+'/'+secTot[s]+'</span></div>';
    });
    h+='</div>';
    const wrong=log.filter(l=>!l.ok);
    h+='<div class="jv-h3" role="heading" aria-level="3">'+(wrong.length?'Perlu diulang':'Semua jawaban benar')+'</div>';
    if(wrong.length){
      h+='<ul class="jv-wrongs">';
      wrong.forEach(l=>{
        const p=l.q.prompt,pj=(p.type==='glyph'||p.type==='word'||p.type==='sent');
        h+='<li><span class="jv-rq">'+(pj?jw(p.text):esc(p.text))+'</span><span class="jv-ra">Benar: <b>'+optHtml(l.q.opts[l.q.ans])+'</b><span class="jv-rb">Pilihanmu: '+optHtml(l.q.opts[l.pick])+'</span></span></li>';
      });
      h+='</ul>';
    }else{h+='<p class="jv-intro">'+esc(cfg.doneNote)+'</p>';}
    h+='<button type="button" class="jv-main" data-act="again">Ulangi dengan soal baru</button>';
    if(pass&&cfg.next)h+='<a class="jv-alt" href="'+cfg.next.href+'">'+esc(cfg.next.label)+'</a>';
    h+='<button type="button" class="jv-alt" data-act="materi">Buka materi</button></div>';
    quiz.innerHTML=h;
    quiz.querySelectorAll('.jv-sec .jv-bar i').forEach(i=>{i.style.width=i.getAttribute('data-w')+'%';});
    quiz.querySelector('.jv-result').scrollIntoView({block:'start'});
  }

  function newQuiz(scroll){
    Q=buildQuiz();idx=0;score=0;log=[];answered=false;
    renderQ(scroll);
  }

  root.addEventListener('click',e=>{
    const tb=e.target.closest('[data-tab]');
    if(tb){showTab(tb.getAttribute('data-tab'),false);return;}
    const ac=e.target.closest('[data-act]');
    if(ac){
      const a=ac.getAttribute('data-act');
      if(a==='go-quiz')showTab('kuis',true);
      else if(a==='materi')showTab('materi',true);
      else if(a==='again')newQuiz(true);
      else if(a==='next'){
        if(idx<Q.length-1){idx++;answered=false;renderQ(true);}else{renderResult();}
      }
      return;
    }
    const o=e.target.closest('.jv-opt');
    if(o)answer(parseInt(o.getAttribute('data-i'),10));
  });
  root.addEventListener('keydown',e=>{
    if(e.target.closest&&e.target.closest('.jv-tabs')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){
      const to=q$('[data-tab="kuis"]').getAttribute('aria-selected')==='true'?'materi':'kuis';
      showTab(to,false);q$('[data-tab="'+to+'"]').focus();
    }
  });
  document.addEventListener('keydown',e=>{
    if(!root.isConnected||e.ctrlKey||e.metaKey||e.altKey)return;
    const t=e.target;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable))return;
    const p=q$('[data-panel="kuis"]');
    if(p.hidden||!root.offsetParent||answered||!Q.length||log.length>=Q.length)return;
    const n=parseInt(e.key,10);
    if(n>=1&&n<=Q[idx].opts.length)answer(n-1);
  });

  newQuiz(false);
}

function materiHtml(){
  const ex={ng:sWord('bunga'),r:sWord('kamar'),h:sWord('umah')};
  const ftab=tr('jv-c-f jv-th',[td('Bunyi'),td('Nama'),td('Tanda'),td('Contoh')])+FIN.map(f=>
    tr('jv-c-f',[td(f[0],'jv-vb'),td(f[1]),td(jw(SF[f[0]])),td(jw(ex[f[0]].g)+'<span class="jv-lt">'+ex[f[0]].l+'</span>')])).join('');
  const pm=['bulan','jaran','pura','kantor'].map(w=>sWord(w));
  const up=tr('jv-c-4 jv-th',[td('Andap'),td('Alus sor'),td('Alus singgih'),td('Arti')])+UP.map(r=>tr('jv-c-4',[td(r[0]),td(r[1]),td(r[2],'jv-vb'),td(r[3])])).join('');
  const sent=SENT4.slice(0,3).map(s=>'<li><span class="jv-ng">'+esc(s.lo)+'</span><br><b>'+esc(s.ok)+'</b><span class="jv-id">'+esc(s.id)+'</span></li>').join('');
  return '<div class="jv-stack">'+
    '<section>'+H2('Pengangge tengenan')+
    '<p class="jv-intro">Konsonan di akhir suku kata ditulis dengan pengangge tengenan. Tiga bunyi punya tanda sendiri, ditulis di belakang aksara.</p>'+
    '<div>'+ftab+'</div></section>'+
    '<section>'+H2('Adeg-adeg')+
    '<p class="jv-intro">Konsonan akhir lainnya (k, t, p, n, m, s, l, dan seterusnya) ditulis dengan aksara biasa lalu dimatikan dengan <b>adeg-adeg</b> '+jw(ADEG)+'.</p>'+
    wordList(pm)+
    '<p class="jv-hint">Contoh: bulan = '+jw(SB.b+SV.u)+' + '+jw(SB.l)+' + '+jw(SB.n+ADEG)+'. Bunyi akhir \u201cn\u201d ditutup adeg-adeg.</p></section>'+
    '<section>'+H2('Contoh kata')+wordList(shuffle(W4).slice(0,10))+'</section>'+
    '<section>'+H2('Sor singgih basa')+
    '<p class="jv-intro">Bahasa Bali punya tingkatan, disebut <b>sor singgih basa</b>. <b>Andap</b> untuk teman akrab dan yang lebih muda. <b>Alus</b> untuk yang dihormati, terbagi dua: <b>alus sor</b>, dipakai untuk merendahkan diri sendiri, dan <b>alus singgih</b>, dipakai untuk orang yang dihormati.</p>'+
    '<div>'+up+'</div>'+
    '<ul class="jv-sent">'+sent+'</ul>'+
    '<p class="jv-hint">Kata alus singgih tidak dipakai untuk diri sendiri. Saya mau makan = \u201cTiang jagi nunas\u201d, bukan \u201ctiang jagi ngerayunang\u201d.</p></section>'+
    '<section>'+H2('Catatan')+notes([
      'Beberapa kata alus sama untuk diri sendiri dan orang lain, misalnya \u201cuning\u201d dan \u201cnumbas\u201d.',
      'Pemakaian sor singgih bisa berbeda antardaerah dan antarwangsa. Daftar di sini adalah bentuk yang umum untuk belajar.',
      'Level 3 berikutnya: aksara suara, mahaprana, angka, dan pilihan alus yang lebih banyak.'])+'</section>'+
    startBtn+'</div>';
}
JVApp({
  id:'jv-b4',key:'bali:l4:best',pass:14,
  secNames:['Tengenan','Kruna','Sor singgih'],
  hero:sWord('bandung').g,
  lede:'Pengangge tengenan, adeg-adeg, serta tingkatan andap dan alus. Lanjutan dari Level 5.',
  links:[{href:'/p/bali.html',label:'Semua level Bali'},{href:'/p/bali-level5.html',label:'Ulangi Level 5'}],
  next:{href:'/p/bali-level3.html',label:'Lanjut ke Level 3'},
  doneNote:'Lanjut ke Level 3 bila sudah siap, atau ulangi dengan soal baru.',
  materi:materiHtml
});
})();
