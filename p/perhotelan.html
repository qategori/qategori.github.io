/* ===== GANTI jika region/project functions kamu berbeda (lihat PANDUAN_PEMBAYARAN.md) ===== */
const CHECKOUT_FN_URL = 'https://us-central1-qategori.cloudfunctions.net/createCheckoutSession';
const CHECK_PAYMENT_FN_URL = 'https://us-central1-qategori.cloudfunctions.net/checkPaymentStatus';
/* ============================================================================================ */
function isReturningFromPayment(){
  try { return new URLSearchParams(location.search).get('paid') === '1'; } catch (e) { return false; }
}
function clearPaidParam(){
  try {
    const u = new URL(location.href);
    if (u.searchParams.has('paid') || u.searchParams.has('email')) {
      u.searchParams.delete('paid'); u.searchParams.delete('email');
      history.replaceState(null, '', u.toString());
    }
  } catch (e) {}
}
async function waitForPaymentToActivate(){
  viewLoading('Menyelesaikan pembayaran\u2026 mohon tunggu sebentar');
  for (let i = 0; i < 10; i++){
    await new Promise((r) => setTimeout(r, 2000));
    try {
      const idToken = await S.user.getIdToken();
      const resp = await fetch(CHECK_PAYMENT_FN_URL + '?bidang=' + encodeURIComponent(BIDANG_KEY), { headers: { Authorization: 'Bearer ' + idToken } });
      if (resp.ok) { const data = await resp.json(); if (data.active) return true; }
    } catch (err) { console.error(err); }
  }
  return false;
}
async function pay(){
  const note = $('#pay-note'); if (note) note.textContent = 'Menyiapkan pembayaran\u2026';
  try {
    const idToken = await S.user.getIdToken();
    const resp = await fetch(CHECKOUT_FN_URL, { method: 'POST', headers: { Authorization: 'Bearer ' + idToken, 'Content-Type': 'application/json' }, body: JSON.stringify({ bidang: BIDANG_KEY }) });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok || !data.url) throw new Error(data.error || ('HTTP ' + resp.status));
    location.href = data.url;
  } catch (err) {
    if (note) note.textContent = 'Gagal membuka pembayaran: ' + (err.message || err);
  }
}

/* ---------------- Auth ---------------- */
async function onUser(user){
  S.user = user; S.role = null; S.bank = null; S.quiz = null;
  paintTop();
  if (!user) return viewLogin();
  if (!user.emailVerified) return viewVerifyEmail(user.email);
  viewLoading('Memeriksa akses\u2026');
  let deniedBidang = false;
  try {
    const email = user.email.toLowerCase();
    let freeModeOn = false;
    try {
      const freeSnap = await getDoc(doc(db, 'config', 'free_mode'));
      freeModeOn = freeSnap.exists() && freeSnap.data().enabled === true;
    } catch (e) { /* abaikan, lanjut cek akses normal */ }
    if (freeModeOn) {
      S.role = 'admin';
    } else if ((await getDoc(doc(db, 'admins', email))).exists()) {
      S.role = 'admin';
    } else {
      const mSnap = await getDoc(doc(db, 'members', email));
      if (mSnap.exists()) {
        const bidang = mSnap.data().bidang;
        // anggota lama tanpa field "bidang" tetap diizinkan (kompatibilitas mundur);
        // anggota baru harus punya BIDANG_KEY di daftar bidang-nya.
        if (!Array.isArray(bidang) || bidang.includes(BIDANG_KEY)) S.role = 'member';
        else deniedBidang = true;
      }
    }
  } catch (err) { console.error(err); return viewError('Tidak bisa memeriksa akses. Periksa aturan Firestore dan koneksi internet.', err); }
  if (!S.role) {
    if (isReturningFromPayment()) {
      const activated = await waitForPaymentToActivate();
      clearPaidParam();
      if (activated) return onUser(user);
    } else {
      clearPaidParam();
    }
    return deniedBidang ? viewDeniedBidang() : viewDenied();
  }
  clearPaidParam();
  viewMenu();
}

function norm(d){
  const options = (d.options || []).map(o => typeof o === 'string' ? {jp:o, romaji:'', arti:''} : {jp:o.jp || '', romaji:o.romaji || '', arti:o.arti || ''});
  let a = d.answer;
  if (typeof a === 'string') a = 'ABCDEF'.indexOf(a.trim().toUpperCase());
  return { ...d, _opts: options, _ans: Number(a), _paket: Number(d.paket) || Math.ceil((Number(d.no) || 1) / 100) };
}
async function loadBank(){
  if (S.bank) return S.bank;
  const snap = await getDocs(collection(db, 'questions_perhotelan'));
  S.bank = snap.docs.map(d => norm({ id: d.id, ...d.data() })).sort((a, b) => (a.no || 0) - (b.no || 0));
  S.hasArti = S.bank.some(q => q.qArti || (q._opts || []).some(o => o.arti));
  return S.bank;
}
const shuffled = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------------- Kuis ---------------- */
function startQuiz(list, mode){
  S.quiz = { list, i:0, correct:0, wrong:[], answered:false, mode,
    status: new Array(list.length).fill(0), picked: new Array(list.length).fill(-1) };
  renderQuestion();
}
function renderQuestion(){
  const Q = S.quiz, q = Q.list[Q.i], n = Q.list.length;
  const keys = 'ABCDEF';
  const already = Q.status[Q.i] !== 0;
  const chosen = Q.picked[Q.i];
  const answeredCount = Q.status.filter(s => s !== 0).length;
  view(`<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${answeredCount}"><span style="width:${(answeredCount / n) * 100}%"></span></div>
  <details class="qnav">
    <summary>Navigasi soal &middot; ${answeredCount}/${n} terjawab</summary>
    <div class="qnav-grid">${Q.list.map((_, idx) => `<button type="button" class="qn${idx === Q.i ? ' cur' : ''}${Q.status[idx] === 1 ? ' ok' : Q.status[idx] === 2 ? ' bad' : ''}" data-action="jump" data-idx="${idx}">${idx + 1}</button>`).join('')}</div>
    <button type="button" class="ghost small" data-action="finishNow" style="margin-top:10px">Selesai sekarang (lihat hasil)</button>
  </details>
  <article class="card">
    <p class="meta"><span lang="ja">\u7b2c${Q.i + 1}\u554f \u00b7 ${jenisLabel(q.jenis)}${q.topik ? ' \u00b7 ' + esc(q.topik) : ''}</span>
      <span style="color:var(--muted)"> &nbsp;(${Q.i + 1}/${n})</span></p>
    ${S.hasArti ? `<div class="tools"><button class="ghost small" data-action="toggleArti">${S.arti ? 'Sembunyikan arti' : 'Tampilkan arti'}</button></div>` : ''}
    <h3 class="kd-q" lang="ja">${esc(q.q)}</h3>
    ${q.qRomaji ? `<span class="ro">${esc(q.qRomaji)}</span>` : ''}
    ${q.qArti ? `<span class="arti q">${esc(q.qArti)}</span>` : ''}
    <div class="opts">${q._opts.map((o, i) => `
      <button class="opt${already ? (i === q._ans ? ' ok' : (i === chosen ? ' bad' : ' dim')) : ''}" data-action="pick" data-i="${i}"${already ? ' disabled' : ''}>
        <span class="key">${already ? (i === q._ans ? '\u2713' : (i === chosen ? '\u2717' : keys[i])) : keys[i]}</span>
        <span class="txt"><span lang="ja">${esc(o.jp)}</span>${o.romaji ? `<span class="ro">${esc(o.romaji)}</span>` : ''}${o.arti ? `<span class="arti">${esc(o.arti)}</span>` : ''}</span>
      </button>`).join('')}</div>
    <div id="fb">${already ? `<div class="fb ${Q.status[Q.i] === 1 ? '' : 'bad'}">
    <strong lang="ja">${Q.status[Q.i] === 1 ? 'Benar! \u6b63\u89e3 (seikai)' : 'Kurang tepat. \u4e0d\u6b63\u89e3 (fuseikai)'}</strong>
    ${Q.status[Q.i] === 1 ? '' : `Jawaban benar: ${'ABCDEF'[q._ans]}. `}${esc(q.explanation || '')}</div>` : ''}</div>
    <button class="btn" id="next" data-action="next"${already ? '' : ' hidden'}>${Q.i + 1 === n ? 'Lihat hasil' : 'Lanjut'}</button>
  </article>
  <button class="link" data-action="menu">Berhenti dan kembali ke menu</button>`);
  Q.answered = already;
}
function pick(i){
  const Q = S.quiz; if (!Q || Q.answered) return;
  const q = Q.list[Q.i], ok = i === q._ans;
  Q.answered = true;
  Q.picked[Q.i] = i;
  if (Q.status[Q.i] === 0) { if (ok) Q.correct++; else Q.wrong.push(q); }
  Q.status[Q.i] = ok ? 1 : 2;
  document.querySelectorAll('.opt').forEach((b, idx) => {
    b.disabled = true;
    if (idx === q._ans) { b.classList.add('ok'); b.querySelector('.key').textContent = '\u2713'; }
    else if (idx === i) { b.classList.add('bad'); b.querySelector('.key').textContent = '\u2717'; }
    else b.classList.add('dim');
  });
  $('#fb').innerHTML = `<div class="fb ${ok ? '' : 'bad'}">
    <strong lang="ja">${ok ? 'Benar! \u6b63\u89e3 (seikai)' : 'Kurang tepat. \u4e0d\u6b63\u89e3 (fuseikai)'}</strong>
    ${ok ? '' : `Jawaban benar: ${'ABCDEF'[q._ans]}. `}${esc(q.explanation || '')}</div>`;
  const nx = $('#next'); nx.hidden = false; nx.focus();
}
function jump(idx){
  const Q = S.quiz; if (!Q) return;
  if (idx < 0 || idx >= Q.list.length || idx === Q.i) return;
  Q.i = idx;
  renderQuestion();
}
function finishNow(){
  const Q = S.quiz; if (!Q) return;
  const remaining = Q.status.filter(s => s === 0).length;
  if (remaining > 0 && !confirm(`Masih ada ${remaining} soal yang belum dijawab. Tetap lihat hasil sekarang?`)) return;
  finish();
}
function next(){
  const Q = S.quiz; if (!Q || !Q.answered) return;
  const ni = Q.i + 1;
  if (ni >= Q.list.length) return finish();
  Q.i = ni;
  renderQuestion();
}
async function finish(){
  const Q = S.quiz, total = Q.list.length, pct = Math.round((Q.correct / total) * 100);
  const msg = pct >= 80 ? 'Bagus sekali. Pertahankan.' : pct >= 60 ? 'Cukup baik. Ulangi soal yang salah supaya makin mantap.' : 'Terus berlatih. Ulangi soal yang salah dulu.';
  view(`<section class="card center">
    <p class="sub" style="margin-bottom:0">Skor kamu</p>
    <div class="score">${Q.correct} / ${total}</div>
    <p class="sub">${pct}% benar \u00b7 ${esc(msg)}</p>
    <p class="kd-note" id="saved">Menyimpan skor\u2026</p>
    <div class="row" style="justify-content:center">
      ${Q.wrong.length ? '<button class="btn" style="width:auto" data-action="retry">Ulangi soal yang salah</button>' : ''}
      <button class="ghost" data-action="menu">Kembali ke menu</button>
    </div></section>
    ${Q.wrong.length ? `<section class="card" style="margin-top:14px"><h3 style="margin-top:0">Soal yang salah (${Q.wrong.length})</h3>
      <ol class="wrong-list">${Q.wrong.map(q => `<li><span lang="ja">${esc(q.q)}</span>
        <span class="ro">${esc(q.qRomaji || '')}</span>
        ${q.qArti ? `<span class="arti q">${esc(q.qArti)}</span>` : ''}
        <strong>${'ABCDEF'[q._ans]}. <span lang="ja">${esc(q._opts[q._ans]?.jp || '')}</span></strong>${q._opts[q._ans]?.arti ? `<span class="arti">${esc(q._opts[q._ans].arti)}</span>` : ''}
        ${q.explanation ? `<br><span style="color:var(--muted)">${esc(q.explanation)}</span>` : ''}</li>`).join('')}</ol></section>` : ''}`);
  try {
    await addDoc(collection(db, 'results_perhotelan'), {
      uid: S.user.uid, email: S.user.email.toLowerCase(), nama: S.user.displayName || '',
      skor: Q.correct, total, mode: Q.mode, at: serverTimestamp()
    });
    const n = $('#saved'); if (n) n.textContent = 'Skor tersimpan di riwayatmu.';
  } catch (err) { console.error(err); const n = $('#saved'); if (n) n.textContent = 'Skor gagal disimpan (koneksi atau izin).'; }
}

  const f = $('#q-file');

async function importSoal(){
  const errEl = $('#q-err'); errEl.textContent = '';
  let data;
  try { data = JSON.parse($('#q-json').value); } catch { errEl.textContent = 'JSON tidak valid. Periksa tanda kurung dan koma.'; return; }
  if (data && !Array.isArray(data) && Array.isArray(data.questions)) data = data.questions;
  if (!Array.isArray(data) || !data.length) { errEl.textContent = 'Isi harus berupa daftar soal (array) yang tidak kosong.'; return; }
  const clean = [], problems = [];
  data.forEach((d, idx) => {
    const n = idx + 1, opts = Array.isArray(d.options) ? d.options : [];
    let a = d.answer; if (typeof a === 'string') a = 'ABCDEF'.indexOf(a.trim().toUpperCase());
    if (!d.q || typeof d.q !== 'string') return problems.push(`Soal ke-${n}: field "q" kosong.`);
    if (opts.length < 2 || opts.length > 6) return problems.push(`Soal ke-${n}: "options" harus 2\u20136 pilihan.`);
    if (!Number.isInteger(a) || a < 0 || a >= opts.length) return problems.push(`Soal ke-${n}: "answer" harus 0\u2013${opts.length - 1} atau huruf A\u2013${'ABCDEF'[opts.length - 1]}.`);
    const no = Number.isFinite(+d.no) ? +d.no : n;
    const id = String(d.id || `q${String(no).padStart(3, '0')}`).replace(/[\/\s]/g, '_');
    clean.push({ id, data: {
      no, paket: Number.isFinite(+d.paket) && +d.paket > 0 ? +d.paket : Math.ceil(no / 100),
      jenis: d.jenis === 'praktik' ? 'praktik' : 'teori', topik: String(d.topik || ''),
      q: d.q, qRomaji: String(d.qRomaji || ''), qArti: String(d.qArti || ''), answer: a, explanation: String(d.explanation || ''),
      options: opts.map(o => typeof o === 'string' ? { jp: o, romaji: '', arti: '' } : { jp: String(o.jp || ''), romaji: String(o.romaji || ''), arti: String(o.arti || '') })
    }});
  });
  if (problems.length) { errEl.textContent = problems.slice(0, 5).join(' ') + (problems.length > 5 ? ` (+${problems.length - 5} masalah lain)` : ''); return; }
  try {
    for (let i = 0; i < clean.length; i += 400) {
      const batch = writeBatch(db);
      clean.slice(i, i + 400).forEach(c => batch.set(doc(db, 'questions_perhotelan', c.id), c.data));
      await batch.commit();
    }
    toast(`${clean.length} soal berhasil diimpor.`);
    S.bank = null; viewAdmin('soal');
  } catch (err) { console.error(err); errEl.textContent = 'Gagal menyimpan: ' + (err.code || err.message); }
}
async function importMateri(){
  const errEl = $('#m-err'); errEl.textContent = '';
  let data;
  try { data = JSON.parse($('#m-json').value); } catch { errEl.textContent = 'JSON tidak valid. Periksa tanda kurung dan koma.'; return; }
  if (!Array.isArray(data) || !data.length) { errEl.textContent = 'Isi harus berupa daftar bab (array) yang tidak kosong.'; return; }
  const clean = [], problems = [];
  data.forEach((d, idx) => {
    const n = idx + 1;
    const no = Number.isFinite(+d.no) ? +d.no : n;
    if (!d.html || typeof d.html !== 'string') { problems.push(`Bab ke-${n}: field "html" kosong.`); return; }
    clean.push({ id: 'bab' + no, data: { no, judul: String(d.judul || ''), html: d.html } });
  });
  if (problems.length) { errEl.textContent = problems.slice(0, 5).join(' ') + (problems.length > 5 ? ` (+${problems.length - 5} masalah lain)` : ''); return; }
  try {
    const batch = writeBatch(db);
    clean.forEach(c => batch.set(doc(db, 'materi_perhotelan', c.id), c.data));
    await batch.commit();
    toast(`${clean.length} bab materi berhasil diimpor.`);
    viewAdmin('materi');
  } catch (err) { console.error(err); errEl.textContent = 'Gagal menyimpan: ' + (err.code || err.message); }
}
async function clearSoal(){
  if (!confirm('Hapus SEMUA soal dari database? Ini tidak bisa dibatalkan.')) return;
  try {
    const snap = await getDocs(collection(db, 'questions_perhotelan'));
    for (let i = 0; i < snap.docs.length; i += 400) {
      const batch = writeBatch(db);
      snap.docs.slice(i, i + 400).forEach(d => batch.delete(d.ref));
      await batch.commit();
    }
    toast('Semua soal dihapus.');
  } catch (err) { console.error(err); toast('Gagal menghapus soal.'); }
  S.bank = null; viewAdmin('soal');
}

/* ---------------- Aksi & event ---------------- */
function authErrMsg(err){
  const m = {
    'auth/popup-blocked': 'Popup diblokir browser. Izinkan popup untuk halaman ini, lalu coba lagi.',
    'auth/unauthorized-domain': 'Domain halaman ini belum ditambahkan di Firebase \u2192 Authentication \u2192 Settings \u2192 Authorized domains.',
    'auth/popup-closed-by-user': '', 'auth/cancelled-popup-request': '',
    'auth/account-exists-with-different-credential': 'Email ini sudah terdaftar lewat cara masuk lain (Google/Email). Coba masuk dengan cara itu.',
    'auth/email-already-in-use': 'Email ini sudah terdaftar. Coba menu "Masuk" bukan "Daftar".',
    'auth/invalid-email': 'Format email tidak valid.',
    'auth/weak-password': 'Password terlalu lemah, minimal 6 karakter.',
    'auth/user-not-found': 'Email belum terdaftar. Coba menu "Daftar".',
    'auth/wrong-password': 'Password salah.',
    'auth/invalid-credential': 'Email atau password salah.',
    'auth/too-many-requests': 'Terlalu banyak percobaan gagal. Coba lagi beberapa saat lagi.'
  }[err.code];
  return m !== undefined ? m : 'Gagal masuk: ' + (err.code || err.message);
}
const actions = {
  async login(){
    const errEl = $('#err'); if (errEl) errEl.textContent = '';
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (err) { if (errEl) errEl.textContent = authErrMsg(err); }
  },
  showEmailForm(){ loginMode = 'signin'; viewLogin(); },
  toSignup(){ loginMode = 'signup'; viewLogin(); },
  toSignin(){ loginMode = 'signin'; viewLogin(); },
  toChoice(){ loginMode = 'choice'; viewLogin(); },
  togglePw(el){
    const inp = $('#auth-pass'); if (!inp) return;
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    el.textContent = show ? 'Sembunyikan' : 'Tampilkan';
  },
  async emailLogin(){
    const errEl = $('#err'); if (errEl) errEl.textContent = '';
    const email = (($('#auth-email') || {}).value || '').trim();
    const pass = ($('#auth-pass') || {}).value || '';
    if (!email || !pass) { if (errEl) errEl.textContent = 'Isi email dan password.'; return; }
    try { await signInWithEmailAndPassword(auth, email, pass); }
    catch (err) { if (errEl) errEl.textContent = authErrMsg(err); }
  },
  async signup(){
    const errEl = $('#err'); if (errEl) errEl.textContent = '';
    const email = (($('#auth-email') || {}).value || '').trim();
    const pass = ($('#auth-pass') || {}).value || '';
    if (!email || !pass) { if (errEl) errEl.textContent = 'Isi email dan password.'; return; }
    if (pass.length < 6) { if (errEl) errEl.textContent = 'Password minimal 6 karakter.'; return; }
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await sendEmailVerification(cred.user);
    }
    catch (err) { if (errEl) errEl.textContent = authErrMsg(err); }
  },
  async resetPassword(){
    const errEl = $('#err'); if (errEl) errEl.textContent = '';
    const email = (($('#auth-email') || {}).value || '').trim();
    if (!email) { if (errEl) errEl.textContent = 'Isi email dulu, baru klik "Lupa password?".'; return; }
    try { await sendPasswordResetEmail(auth, email); if (errEl) errEl.textContent = 'Link reset password sudah dikirim ke email itu. Cek juga folder spam kalau belum kelihatan di kotak masuk.'; }
    catch (err) { if (errEl) errEl.textContent = authErrMsg(err); }
  },
  async resendVerify(){
    const note = $('#verify-note'); if (note) note.textContent = 'Mengirim\u2026';
    try { await sendEmailVerification(S.user); if (note) note.textContent = 'Terkirim. Cek folder spam kalau belum masuk.'; }
    catch (err) { if (note) note.textContent = authErrMsg(err); }
  },
  async checkVerified(){
    const note = $('#verify-note'); if (note) note.textContent = 'Memeriksa\u2026';
    try { await S.user.reload(); await S.user.getIdToken(true); onUser(S.user); }
    catch (err) { if (note) note.textContent = authErrMsg(err); }
  },
  logout(){ signOut(auth); },
  reload(){ location.reload(); },
  menu(){ S.quiz = null; viewMenu(); },
  start(){
    const mode = ($('input[name=mode]:checked') || {}).value || 'semua';
    const shuffle = $('#opt-shuffle').checked; S.romaji = $('#opt-romaji').checked;
    const ca = $('#opt-arti'); if (ca) S.arti = ca.checked;
    const paket = ($('input[name=paket]:checked') || {}).value || 'semua';
    Prefs.set({ mode, paket, shuffle, romaji: S.romaji, arti: S.arti }); applyRomaji();
    let list = S.bank.filter(q => (paket === 'semua' || String(q._paket) === paket) && (mode === 'semua' || (mode === 'praktik' ? q.jenis === 'praktik' : q.jenis !== 'praktik')));
    if (!list.length) return toast('Tidak ada soal untuk pilihan ini.');
    startQuiz(shuffle ? shuffled(list) : list.slice(), mode + (paket === 'semua' ? '' : ' (paket ' + paket + ')'));
  },
  pick(el){ pick(Number(el.dataset.i)); },
  jump(el){ jump(Number(el.dataset.idx)); },
  finishNow,
  next,
  retry(){ if (S.quiz && S.quiz.wrong.length) startQuiz(shuffled(S.quiz.wrong), 'ulang-salah'); },
  toggleArti(){
    S.arti = !S.arti; const pr = Prefs.get(); pr.arti = S.arti; Prefs.set(pr); applyRomaji();
    const b = $('[data-action="toggleArti"]'); if (b) b.textContent = S.arti ? 'Sembunyikan arti' : 'Tampilkan arti';
  },
  pay,
  history: viewHistory,
  admin(){ viewAdmin('soal'); },
  tab(el){ viewAdmin(el.dataset.tab); },
  importSoal, clearSoal, importMateri
};
root.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const fn = actions[el.dataset.action]; if (fn) fn(el, e);
});
document.addEventListener('keydown', (e) => {
  const Q = S.quiz; if (!Q || e.ctrlKey || e.metaKey || e.altKey) return;
  if (document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  const k = e.key.toLowerCase();
  if (!Q.answered) {
    const i = 'abcdef'.indexOf(k) >= 0 ? 'abcdef'.indexOf(k) : ('123456'.indexOf(k));
    if (i >= 0 && i < Q.list[Q.i]._opts.length) { pick(i); e.preventDefault(); }
  } else if (k === 'enter' || k === 'arrowright') { next(); e.preventDefault(); }
});

/* ---------------- Ikuti tema blog (terang/gelap) ---------------- */
function syncTone(){
  let light = null;
  try {
    const c = document.createElement('canvas'); c.width = c.height = 1;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.fillStyle = '#000'; x.fillStyle = getComputedStyle(root).color; x.fillRect(0, 0, 1, 1);
    const [r, g, b] = x.getImageData(0, 0, 1, 1).data;
    light = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 < 0.55;   // teks gelap = tema terang
  } catch {}
  if (light === null) light = !matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.tone = light ? 'light' : 'dark';
}
const kick = () => { syncTone(); setTimeout(syncTone, 450); };
const watch = { attributes: true, attributeFilter: ['class', 'data-theme', 'data-mode', 'data-color-scheme', 'style'] };
new MutationObserver(kick).observe(document.documentElement, watch);
new MutationObserver(kick).observe(document.body, watch);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', kick); } catch {}
syncTone();

/* ---------------- Mulai ---------------- */
paintTop();
if (Object.values(firebaseConfig).some(v => String(v).startsWith('GANTI'))) {
  viewSetupNeeded();
} else {
  const fbApp = initializeApp(firebaseConfig);
  auth = getAuth(fbApp); db = getFirestore(fbApp);
  onAuthStateChanged(auth, onUser);
}
</script>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

(function(){
  /* ===== 1. GANTI dengan link folder gambar di GitHub kamu (lihat catatan di bawah file) ===== */
  var IMG_BASE = "https://bshantoz.github.io/tg2/perhotelan/gambar/";
  /* ============================================================================================ */

  var root = document.getElementById('materi-perhotelan');

  var tabs = root.querySelectorAll('.tab');

  var n = 12;


  /* ---------------- Akses anggota (sama seperti kuis) ---------------- */

  var escj = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  function showGate(html){ gate.innerHTML = html; gate.hidden = false; content.hidden = true; }

  function showContent(){ gate.hidden = true; gate.innerHTML = ''; content.hidden = false; if (!contentInited) { contentInited = true; initContent(); } }
  function viewLoading(msg){ showGate('<div class="card center"><div class="spin"></div><p class="sub">' + escj(msg || 'Memuat\u2026') + '</p></div>'); }
  function bindVerify(){
    var cv = root.querySelector('#ml-check-verified'); if (cv) cv.addEventListener('click', doCheckVerified);
    var rv = root.querySelector('#ml-resend-verify'); if (rv) rv.addEventListener('click', doResendVerify);

  function viewVerifyEmail(email){
    showGate('<section class="card center"><h2 class="kd-title">Verifikasi email dulu</h2>' +
      '<p>Kami sudah mengirim link verifikasi ke <strong>' + escj(email) + '</strong>. Buka email itu (cek folder spam juga), klik link-nya, lalu kembali ke sini dan klik "Saya sudah verifikasi".</p>' +
      '<p class="err" id="ml-verify-note"></p>' +
      '<button class="btn" id="ml-check-verified">Saya sudah verifikasi</button>' +
      '<div class="row" style="justify-content:center"><button class="ghost" id="ml-resend-verify">Kirim ulang email verifikasi</button></div>' +
      '<div class="row" style="justify-content:center"><button class="ghost" id="ml-logout">Ganti akun</button></div></section>');
    bindVerify();
  }
  function doResendVerify(){
    var note = root.querySelector('#ml-verify-note'); if (note) note.textContent = 'Mengirim\u2026';
    sendEmailVerification(__authUser).then(function(){ if (note) note.textContent = 'Terkirim. Cek folder spam kalau belum masuk.'; })
      .catch(function(err){ if (note) note.textContent = authErrMsg(err); });
  }
  function doCheckVerified(){
    var note = root.querySelector('#ml-verify-note'); if (note) note.textContent = 'Memeriksa\u2026';
    __authUser.reload().then(function(){ return __authUser.getIdToken(true); }).then(function(){ checkAccess(__authUser); })
      .catch(function(err){ if (note) note.textContent = authErrMsg(err); });
  }
  function bindLogin(){
    var b = root.querySelector('#ml-login'); if (b) b.addEventListener('click', doLogin);
    var se = root.querySelector('#ml-show-email'); if (se) se.addEventListener('click', function(){ loginMode = 'signin'; viewLogin(); });
    var tm = root.querySelector('#ml-toggle-mode'); if (tm) tm.addEventListener('click', function(){ loginMode = loginMode === 'signup' ? 'signin' : 'signup'; viewLogin(); });
    var bk = root.querySelector('#ml-back'); if (bk) bk.addEventListener('click', function(){ loginMode = 'choice'; viewLogin(); });
    var rs = root.querySelector('#ml-reset'); if (rs) rs.addEventListener('click', doResetPassword);
    var pt = root.querySelector('#ml-pw-toggle'); if (pt) pt.addEventListener('click', function(){
      var inp = root.querySelector('#ml-pass'); if (!inp) return;
      var show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      pt.textContent = show ? 'Sembunyikan' : 'Tampilkan';
    });
    var es = root.querySelector('#ml-email-submit'); if (es) es.addEventListener('click', function(){ if (loginMode === 'signup') doSignup(); else doEmailLogin(); });
  }
  function bindLogout(){ var b = root.querySelector('#ml-logout'); if (b) b.addEventListener('click', function(){ signOut(auth); }); }
  var loginMode = 'choice'; // 'choice' | 'signin' | 'signup'
  function viewLogin(msg){
    var emailBlock = loginMode === 'choice' ?
      ('<button class="btn" id="ml-login">Masuk dengan Google</button>' +
       '<div class="or-sep">atau</div>' +
       '<button class="ghost" style="width:100%" id="ml-show-email">Masuk dengan Email</button>')
      :
      ('<div class="row" style="flex-direction:column;gap:10px;margin-top:4px">' +
         '<input type="email" id="ml-email" placeholder="Email" autocomplete="email">' +
         '<div class="pw-wrap">' +
           '<input type="password" id="ml-pass" placeholder="Password" autocomplete="' + (loginMode === 'signup' ? 'new-password' : 'current-password') + '">' +
           '<button type="button" class="pw-toggle" id="ml-pw-toggle">Tampilkan</button>' +
         '</div>' +
       '</div>' +
       '<button class="btn" id="ml-email-submit">' + (loginMode === 'signup' ? 'Daftar dengan Email' : 'Masuk dengan Email') + '</button>' +
       '<button class="switch" id="ml-toggle-mode">' + (loginMode === 'signup' ? 'Sudah punya akun? Masuk' : 'Belum punya akun? Daftar') + '</button>' +
       '<button class="switch" id="ml-reset">Lupa password?</button>' +
       '<button class="switch" id="ml-back">&larr; Kembali ke pilihan lain</button>');
    showGate('<section class="card center"><h2 class="kd-title" lang="ja">\u6559\u6750</h2>' +
      '<p>Halaman ini khusus anggota. Masuk dengan akun Google atau Email yang sudah didaftarkan admin.</p>' +
      emailBlock +
      '<p class="err">' + escj(msg || '') + '</p></section>');
    bindLogin();
  }
  function viewDenied(email){
    showGate('<section class="card center"><h2 class="kd-title">Email belum terdaftar</h2>' +
      '<p><strong>' + escj(email) + '</strong> belum ada di daftar anggota.</p>' +
      '<p>Kamu bisa langsung membeli akses, atau minta admin menambahkan emailmu ke daftar anggota lalu masuk lagi.</p>' +
      '<button class="btn" id="ml-pay">Bayar untuk buka akses</button>' +
      '<p class="err" id="ml-pay-note"></p>' +
      '<div class="row" style="justify-content:center"><button class="ghost" id="ml-logout">Ganti akun</button></div></section>');
    bindLogout(); bindPay();
  }
  function viewDeniedBidang(email){
    showGate('<section class="card center"><h2 class="kd-title">Belum punya akses bidang ini</h2>' +
      '<p><strong>' + escj(email) + '</strong> terdaftar sebagai anggota, tapi belum diberi akses ke bidang ini.</p>' +
      '<p>Kamu bisa langsung membeli akses, atau minta admin menambahkan bidang ini lewat panel admin pusat lalu masuk lagi.</p>' +
      '<button class="btn" id="ml-pay">Bayar untuk buka akses</button>' +
      '<p class="err" id="ml-pay-note"></p>' +
      '<div class="row" style="justify-content:center"><button class="ghost" id="ml-logout">Ganti akun</button></div></section>');
    bindLogout(); bindPay();
  }
  function viewError(msg){
    showGate('<div class="card"><h2 class="kd-title">Terjadi masalah</h2><p>' + escj(msg) + '</p>' +
      '<div class="row"><button class="btn" style="width:auto" id="ml-retry">Coba lagi</button></div></div>');
    var b = root.querySelector('#ml-retry'); if (b) b.addEventListener('click', function(){ location.reload(); });
  }
  function authErrMsg(err){
    var m = {
      'auth/popup-blocked': 'Popup diblokir browser. Izinkan popup untuk halaman ini, lalu coba lagi.',
      'auth/unauthorized-domain': 'Domain halaman ini belum ditambahkan di Firebase \u2192 Authentication \u2192 Settings \u2192 Authorized domains.',
      'auth/popup-closed-by-user': '', 'auth/cancelled-popup-request': '',
      'auth/account-exists-with-different-credential': 'Email ini sudah terdaftar lewat cara masuk lain (Google/Email). Coba masuk dengan cara itu.',
      'auth/email-already-in-use': 'Email ini sudah terdaftar. Coba menu "Masuk" bukan "Daftar".',
      'auth/invalid-email': 'Format email tidak valid.',
      'auth/weak-password': 'Password terlalu lemah, minimal 6 karakter.',
      'auth/user-not-found': 'Email belum terdaftar. Coba menu "Daftar".',
      'auth/wrong-password': 'Password salah.',
      'auth/invalid-credential': 'Email atau password salah.',
      'auth/too-many-requests': 'Terlalu banyak percobaan gagal. Coba lagi beberapa saat lagi.'
    }[err.code];
    return m !== undefined ? m : 'Gagal masuk: ' + (err.code || err.message);
  }
  function doLogin(){
    signInWithPopup(auth, new GoogleAuthProvider()).catch(function(err){ viewLogin(authErrMsg(err)); });
  }
  function doEmailLogin(){
    var email = (root.querySelector('#ml-email') || {}).value || ''; email = email.trim();
    var pass = (root.querySelector('#ml-pass') || {}).value || '';
    if (!email || !pass) { viewLogin('Isi email dan password.'); return; }
    signInWithEmailAndPassword(auth, email, pass).catch(function(err){ viewLogin(authErrMsg(err)); });
  }
  function doSignup(){
    var email = (root.querySelector('#ml-email') || {}).value || ''; email = email.trim();
    var pass = (root.querySelector('#ml-pass') || {}).value || '';
    if (!email || !pass) { viewLogin('Isi email dan password.'); return; }
    if (pass.length < 6) { viewLogin('Password minimal 6 karakter.'); return; }
    createUserWithEmailAndPassword(auth, email, pass).then(function(cred){ return sendEmailVerification(cred.user); })
      .catch(function(err){ viewLogin(authErrMsg(err)); });
  }
  function doResetPassword(){
    var email = (root.querySelector('#ml-email') || {}).value || ''; email = email.trim();
    if (!email) { viewLogin('Isi email dulu, baru klik "Lupa password?".'); return; }
    sendPasswordResetEmail(auth, email).then(function(){ viewLogin('Link reset password sudah dikirim ke email itu. Cek juga folder spam kalau belum kelihatan di kotak masuk.'); })
      .catch(function(err){ viewLogin(authErrMsg(err)); });
  }

  /* ---------------- Pembayaran (Xendit, sekali bayar) ---------------- */
  /* ===== GANTI jika region/project functions kamu berbeda (lihat PANDUAN_PEMBAYARAN.md) ===== */
  var CHECKOUT_FN_URL = 'https://us-central1-qategori.cloudfunctions.net/createCheckoutSession';
  var CHECK_PAYMENT_FN_URL = 'https://us-central1-qategori.cloudfunctions.net/checkPaymentStatus';
  /* ============================================================================================ */
  function bindPay(){ var b = root.querySelector('#ml-pay'); if (b) b.addEventListener('click', doPay); }
  function isReturningFromPayment(){
    try { return new URLSearchParams(location.search).get('paid') === '1'; } catch (e) { return false; }
  }
  function clearPaidParam(){
    try {
      var u = new URL(location.href);
      if (u.searchParams.has('paid') || u.searchParams.has('email')) {
        u.searchParams.delete('paid'); u.searchParams.delete('email');
        history.replaceState(null, '', u.toString());
      }
    } catch (e) {}
  }
  function waitForPaymentToActivate(user){
    viewLoading('Menyelesaikan pembayaran\u2026 mohon tunggu sebentar');
    var tries = 0;
    function attempt(){
      tries++;
      return user.getIdToken().then(function(idToken){
        return fetch(CHECK_PAYMENT_FN_URL + '?bidang=' + encodeURIComponent(BIDANG_KEY), { headers: { Authorization: 'Bearer ' + idToken } });
      }).then(function(resp){ return resp.ok ? resp.json() : { active: false }; }).catch(function(err){ console.error(err); return { active: false }; }).then(function(data){
        if (data.active) return true;
        if (tries >= 10) return false;
        return new Promise(function(r){ setTimeout(r, 2000); }).then(attempt);
      });
    }
    return attempt();
  }
  function doPay(){
    var note = root.querySelector('#ml-pay-note'); if (note) note.textContent = 'Menyiapkan pembayaran\u2026';
    getAuthUser().getIdToken().then(function(idToken){
      return fetch(CHECKOUT_FN_URL, { method: 'POST', headers: { Authorization: 'Bearer ' + idToken, 'Content-Type': 'application/json' }, body: JSON.stringify({ bidang: BIDANG_KEY }) });
    }).then(function(resp){
      return resp.json().catch(function(){ return {}; }).then(function(data){
        if (!resp.ok || !data.url) throw new Error(data.error || ('HTTP ' + resp.status));
        location.href = data.url;
      });
    }).catch(function(err){
      if (note) note.textContent = 'Gagal membuka pembayaran: ' + (err.message || err);
    });
  }
  var __authUser = null;
  function getAuthUser(){ return __authUser; }

  /* Kunci bidang halaman ini - SAMA dengan kuis, jadi anggota yang punya akses bidang ini otomatis bisa buka materi. */
  var firebaseConfig = {
    apiKey: "AIzaSyA1WrsQJfTo7dj_WfTh3j_E6Ecoko7rYX4",
    authDomain: "qategori.firebaseapp.com",
    projectId: "qategori",
    appId: "1:323434645943:web:5c0449e902b0f32655c032"
  };
  var BIDANG_KEY = 'shukuhaku';
  var fbApp = getApps().length ? getApp() : initializeApp(firebaseConfig);
  var auth = getAuth(fbApp), db = getFirestore(fbApp);

  function checkAccess(user){
    if (!user.emailVerified) return viewVerifyEmail(user.email);
    viewLoading('Memeriksa akses\u2026');
    var email = user.email.toLowerCase();
    getDoc(doc(db, 'config', 'free_mode')).catch(function(){ return null; }).then(function(freeSnap){
      if (freeSnap && freeSnap.exists && freeSnap.exists() && freeSnap.data().enabled === true) {
        clearPaidParam(); return showContent();
      }
      return getDoc(doc(db, 'admins', email)).then(function(aSnap){
        if (aSnap.exists()) { clearPaidParam(); return showContent(); }
        return getDoc(doc(db, 'members', email)).then(function(mSnap){
          var bidang = mSnap.exists() ? mSnap.data().bidang : null;
          var ok = mSnap.exists() && (!Array.isArray(bidang) || bidang.includes(BIDANG_KEY));
          if (ok) { clearPaidParam(); return showContent(); }
          if (isReturningFromPayment()) {
            return waitForPaymentToActivate(user).then(function(activated){
              clearPaidParam();
              if (activated) return checkAccess(user);
              return mSnap.exists() ? viewDeniedBidang(user.email) : viewDenied(user.email);
            });
          }
          clearPaidParam();
          return mSnap.exists() ? viewDeniedBidang(user.email) : viewDenied(user.email);
        });
      });
    }).catch(function(err){
      console.error(err); viewError('Tidak bisa memeriksa akses. Periksa aturan Firestore dan koneksi internet.');
    });
  }

  onAuthStateChanged(auth, function(user){
    __authUser = user;
    if (!user) { viewLogin(); return; }
    checkAccess(user);
  });

  var MATERI_HTML = {"1": "<div class=\"card\">\n<h3><span class=\"num\">1</span>Keselamatan &amp; Kesehatan Kerja di Industri Perhotelan <span lang=\"ja\">・安全衛生管理</span></h3>\n<p>Bekerja di hotel maupun ryokan bukan pekerjaan tanpa risiko. Materi ini mengacu pada bagian <strong>安全衛生管理／anzen eisei kanri</strong> (manajemen keselamatan dan kesehatan kerja) dalam buku panduan resmi TG2 bidang 宿泊 (perhotelan) yang diterbitkan Zenryoren. Ada tiga pihak yang keselamatannya harus dijaga bersamaan: tamu (お客様), karyawan (従業員), dan bangunan/fasilitas itu sendiri (施設).</p>\n<p>Langkah pertama adalah <strong>リスクの理解と回避／risuku no rikai to kaihi</strong> (memahami dan menghindari risiko). Risiko utama di fasilitas penginapan meliputi kebakaran (火災／kasai), gempa bumi (地震／jishin), keracunan makanan (食中毒／shokuchūdoku), penyakit menular (感染症／kansenshō), serta kecelakaan kerja biasa seperti terpeleset di lantai basah dekat kamar mandi/onsen.</p>\n<h4>Keselamatan Tamu <span lang=\"ja\">・お客様の安全確保</span></h4>\n<ul>\n<li><strong>避難経路／hinan keiro</strong> (jalur evakuasi) harus jelas, tidak terhalang barang, dan setiap kamar wajib memiliki denah evakuasi (避難経路図) yang mudah dilihat tamu.</li>\n<li><strong>消火設備／shōka setsubi</strong> (alat pemadam kebakaran) seperti APAR dan hydrant harus diperiksa rutin dan posisinya diketahui semua staf.</li>\n<li><strong>避難訓練／hinan kunren</strong> (latihan evakuasi) dilakukan berkala agar staf tahu cara memandu tamu keluar dengan tenang saat darurat.</li>\n<li>Staf front desk harus tahu lokasi AED (自動体外式除細動器) dan nomor kontak darurat (緊急連絡先) rumah sakit/pemadam terdekat.</li>\n</ul>\n<h4>Keselamatan Karyawan <span lang=\"ja\">・従業員の安全確保</span></h4>\n<p>Karyawan juga rawan cedera: mengangkat koper berat, terpeleset di dapur/area laundry, luka akibat pecahan kaca saat membersihkan kamar, atau paparan bahan kimia pembersih. Prinsip <strong>労働安全／rōdō anzen</strong> (keselamatan kerja) mewajibkan penggunaan APD sesuai tugas, misalnya sarung tangan karet saat housekeeping dan alas kaki anti-selip di dapur.</p>\n<figure class=\"pyramid-box\">\n<img class=\"ml-img\" data-file=\"apd_k3_perhotelan.svg\" alt=\"Ilustrasi APD dan jalur evakuasi di fasilitas penginapan\" loading=\"lazy\">\n<figcaption>Ilustrasi buatan sendiri — APD dasar staf perhotelan (sarung tangan, alas kaki anti-selip) dan rambu jalur evakuasi/APAR.</figcaption>\n</figure>\n<table>\n<thead><tr><th>Risiko</th><th>Contoh kejadian</th><th>Pencegahan utama</th></tr></thead>\n<tbody>\n<tr><td>火災 (kasai)</td><td>Korsleting listrik, lilin tamu, dapur</td><td>Cek instalasi rutin, larang alat pemanas ilegal di kamar</td></tr>\n<tr><td>食中毒 (shokuchūdoku)</td><td>Makanan restoran/sarapan basi</td><td>Kontrol suhu penyimpanan, batas waktu saji</td></tr>\n<tr><td>転倒 (tentō/terpeleset)</td><td>Lantai basah dekat onsen/kamar mandi</td><td>Rambu licin, keset anti-selip</td></tr>\n<tr><td>感染症 (kansenshō)</td><td>Flu, norovirus menyebar antar tamu/staf</td><td>Disinfeksi permukaan, cuci tangan wajib</td></tr>\n</tbody>\n</table>\n<div class=\"term-grid\">\n<div class=\"term\"><span class=\"ja\">安全衛生管理</span><span class=\"ro\">anzen eisei kanri</span><span class=\"arti\">manajemen keselamatan &amp; kesehatan kerja</span></div>\n<div class=\"term\"><span class=\"ja\">避難経路</span><span class=\"ro\">hinan keiro</span><span class=\"arti\">jalur evakuasi</span></div>\n<div class=\"term\"><span class=\"ja\">避難訓練</span><span class=\"ro\">hinan kunren</span><span class=\"arti\">latihan evakuasi</span></div>\n<div class=\"term\"><span class=\"ja\">労働災害</span><span class=\"ro\">rōdō saigai</span><span class=\"arti\">kecelakaan kerja</span></div>\n</div>\n<div class=\"ml-note\">Ingat: menjaga keselamatan tamu dan karyawan adalah tanggung jawab bersama semua bagian — front desk, housekeeping, dapur — bukan hanya bagian keamanan.</div>\n</div>", "2": "<div class=\"card\">\n<h3><span class=\"num\">2</span>Undang-Undang Usaha Penginapan <span lang=\"ja\">・旅館業法</span></h3>\n<p>Setiap orang yang ingin menjalankan usaha penginapan di Jepang wajib memperoleh izin dan mematuhi <strong>旅館業法／ryokan gyō hō</strong> (Undang-Undang Usaha Penginapan). Undang-undang ini mengatur operasional dan pengelolaan kebersihan fasilitas penginapan (hotel, ryokan, dll) di Jepang, dengan tujuan menjaga keamanan dan kesehatan tamu yang menginap.</p>\n<h4>Izin Usaha <span lang=\"ja\">・許可の取得</span></h4>\n<p>Untuk menjalankan usaha penginapan diperlukan izin dari gubernur prefektur atau kepala pusat kesehatan masyarakat (保健所長／hokenjochō). Beroperasi tanpa izin adalah tindakan ilegal (違法／ihō).</p>\n<h4>Standar Fasilitas <span lang=\"ja\">・施設の基準</span></h4>\n<p>Untuk mendapat izin, struktur dan perlengkapan fasilitas harus memenuhi standar tertentu, termasuk luas kamar, ventilasi (換気), pencahayaan (採光), toilet, dan fasilitas cuci tangan/wastafel.</p>\n<h4>Klasifikasi Usaha <span lang=\"ja\">・営業の分類</span></h4>\n<table>\n<thead><tr><th>Kategori</th><th>Deskripsi</th></tr></thead>\n<tbody>\n<tr><td><strong>旅館・ホテル営業</strong> (ryokan/hoteru eigyō)</td><td>Ditujukan utamanya untuk wisatawan, menyediakan kamar tamu</td></tr>\n<tr><td><strong>簡易宿所営業</strong> (kan'i shukusho eigyō)</td><td>Penginapan sederhana dengan fasilitas praktis dan harga relatif murah</td></tr>\n<tr><td><strong>下宿営業</strong> (geshuku eigyō)</td><td>Menyediakan tempat tinggal untuk jangka panjang</td></tr>\n</tbody>\n</table>\n<h4>Buku Tamu &amp; Kewajiban Lain</h4>\n<p>Fasilitas penginapan wajib membuat dan menyimpan <strong>宿泊者名簿／shukuhakusha meibo</strong> (buku daftar tamu) yang mencatat nama, alamat, pekerjaan, dan lama menginap tamu, untuk jangka waktu tertentu. Untuk tamu warga negara asing, salinan paspor (パスポートのコピー) wajib diperiksa dan disimpan sesuai hukum yang berlaku.</p>\n<p>Fasilitas juga wajib menjaga kebersihan berkala (清掃・消毒・害虫駆除／pembersihan, disinfeksi, pengendalian hama) dan menyiapkan perlengkapan pemadam kebakaran serta jalur evakuasi. Pengawasan dilakukan oleh pusat kesehatan masyarakat/pemerintah daerah melalui inspeksi berkala. Pelanggaran dapat berujung pada perintah penghentian usaha, pencabutan izin, hingga denda.</p>\n<figure class=\"pyramid-box\">\n<img class=\"ml-img\" data-file=\"struktur_uu_ryokan_gyouhou.svg\" alt=\"Diagram struktur dasar Undang-Undang Usaha Penginapan Jepang\" loading=\"lazy\">\n<figcaption>Ilustrasi buatan sendiri — kerangka 旅館業法: izin usaha, standar fasilitas, klasifikasi, dan kewajiban buku tamu.</figcaption>\n</figure>\n<div class=\"term-grid\">\n<div class=\"term\"><span class=\"ja\">旅館業法</span><span class=\"ro\">ryokan gyō hō</span><span class=\"arti\">Undang-Undang Usaha Penginapan</span></div>\n<div class=\"term\"><span class=\"ja\">許可</span><span class=\"ro\">kyoka</span><span class=\"arti\">izin</span></div>\n<div class=\"term\"><span class=\"ja\">宿泊者名簿</span><span class=\"ro\">shukuhakusha meibo</span><span class=\"arti\">buku/daftar tamu menginap</span></div>\n<div class=\"term\"><span class=\"ja\">簡易宿所</span><span class=\"ro\">kan'i shukusho</span><span class=\"arti\">penginapan sederhana</span></div>\n</div>\n<div class=\"ml-note\">Staf level TG2 tidak perlu mengurus izin sendiri, tapi wajib paham dasar hukum ini karena berkaitan langsung dengan prosedur pendaftaran tamu dan pemeriksaan dokumen di front desk.</div>\n</div>", "3": "<div class=\"card\">\n<h3><span class=\"num\">3</span>Manajemen Reservasi <span lang=\"ja\">・予約管理</span></h3>\n<p><strong>予約管理／yoyaku kanri</strong> (manajemen reservasi) adalah pekerjaan front desk yang mencakup penanganan pertanyaan reservasi, konfirmasi data tamu, hingga pembatalan/penyesuaian pemesanan.</p>\n<h4>A. Menanggapi Pertanyaan Reservasi <span lang=\"ja\">・予約問い合わせへの対応</span></h4>\n<p>Tamu bisa memesan lewat telepon, email, atau situs web. Staf harus memeriksa ketersediaan kamar — <strong>空室／kūshitsu</strong> (kamar kosong/tersedia) atau <strong>満室／manshitsu</strong> (penuh) — sebelum mengonfirmasi.</p>\n<h4>B. Konfirmasi Data Tamu <span lang=\"ja\">・お客様情報の確認</span></h4>\n<p>Data penting yang wajib dikonfirmasi: nama tamu, perkiraan waktu kedatangan, jumlah orang, jenis kamar, kebutuhan khusus (alergi makanan, kursi roda, dsb), dan kontak yang bisa dihubungi. Untuk tamu asing, salinan paspor diminta sesuai ketentuan hukum.</p>\n<h4>C. Pembatalan &amp; Penyesuaian <span lang=\"ja\">・予約のキャンセル、調整など</span></h4>\n<p>Pembatalan ditangani sesuai kebijakan masing-masing fasilitas (batas waktu, biaya pembatalan). Staf harus waspada terhadap beberapa masalah reservasi berikut:</p>\n<div class=\"term-grid\">\n<div class=\"term\"><span class=\"ja\">オーバーブッキング</span><span class=\"ro\">ōbābukkingu</span><span class=\"arti\">overbooking — reservasi diterima melebihi kapasitas kamar</span></div>\n<div class=\"term\"><span class=\"ja\">ダブルブッキング</span><span class=\"ro\">daburu bukkingu</span><span class=\"arti\">double booking — satu kamar dipesan dua kali karena kesalahan sistem</span></div>\n<div class=\"term\"><span class=\"ja\">ノーショー</span><span class=\"ro\">nō shō</span><span class=\"arti\">no-show — tamu tidak datang tanpa kabar; perlu dihubungi lebih dulu untuk mencegah</span></div>\n<div class=\"term\"><span class=\"ja\">キャンセルポリシー</span><span class=\"ro\">kyanseru porishī</span><span class=\"arti\">kebijakan pembatalan (batas waktu &amp; biaya)</span></div>\n</div>\n<h4>Sistem Pendukung</h4>\n<p>Reservasi modern biasanya diproses lewat <strong>PMS</strong> (Property Management System, sistem manajemen properti) yang mencatat status kamar, tamu, dan pembayaran dalam satu sistem. Situs resmi fasilitas biasanya memiliki <strong>ブッキングエンジン／bukkingu enjin</strong> (booking engine) untuk <strong>ダイレクトブッキング／direct booking</strong>, sementara pemesanan lewat agen daring disebut <strong>OTA</strong> (Online Travel Agent) yang umumnya mengenakan komisi 8–15% dari nilai transaksi.</p>\n<figure class=\"pyramid-box\">\n<img class=\"ml-img\" data-file=\"alur_manajemen_reservasi.svg\" alt=\"Alur kerja manajemen reservasi dari pertanyaan hingga konfirmasi\" loading=\"lazy\">\n<figcaption>Ilustrasi buatan sendiri — alur: pertanyaan reservasi → cek 空室/満室 → konfirmasi data tamu → konfirmasi ke tamu / batal-ubah.</figcaption>\n</figure>\n<table>\n<thead><tr><th>Istilah</th><th>Arti singkat</th></tr></thead>\n<tbody>\n<tr><td>PMS</td><td>Sistem manajemen properti (kamar, tamu, pembayaran)</td></tr>\n<tr><td>OTA</td><td>Agen perjalanan daring, komisi 8–15%</td></tr>\n<tr><td>ADR</td><td>Average Daily Rate — rata-rata tarif kamar per malam</td></tr>\n</tbody>\n</table>\n<div class=\"ml-note\">Kesalahan kecil di tahap reservasi (salah tanggal, salah jumlah tamu) sering menjadi sumber komplain terbesar saat check-in — selalu konfirmasi ulang secara lisan.</div>\n</div>", "4": "<div class=\"card\">\n<h3><span class=\"num\">4</span>Proses Check-in <span lang=\"ja\">・チェックイン業務</span></h3>\n<p>Check-in adalah momen pertama tamu bertatap muka dengan fasilitas, sehingga sangat menentukan kesan awal (第一印象／dai-ichi inshō). Ada tiga komponen utama.</p>\n<h4>A. Penampilan, Sikap &amp; Cara Bicara <span lang=\"ja\">・身だしなみ・姿勢・言葉遣い</span></h4>\n<p>Staf wajib menjaga penampilan rapi (身だしなみ／midashinami), postur baik, dan berbicara dengan sopan santun (言葉遣い／kotobazukai) menggunakan ragam bahasa hormat yang akan dibahas lebih detail di Bab 9.</p>\n<h4>B. Konfirmasi Reservasi <span lang=\"ja\">・予約内容の確認</span></h4>\n<ol>\n<li>Menanyakan nama dan mencocokkan dengan data reservasi.</li>\n<li>Memverifikasi identitas tamu (identity check).</li>\n<li>Mendaftarkan tamu pada <strong>宿帳／yadochō</strong> atau <strong>宿泊台帳／shukuhaku daichō</strong> (buku/kartu registrasi tamu).</li>\n<li>Mengumpulkan dokumen legal yang diperlukan (misalnya salinan paspor untuk tamu asing).</li>\n</ol>\n<h4>C. Penyerahan Kunci &amp; Penjelasan Fasilitas <span lang=\"ja\">・ルームキーのお渡し、館内・設備などの説明</span></h4>\n<ul>\n<li>Menjelaskan cara masuk kamar dan penggunaan kunci/kartu akses.</li>\n<li>Menjelaskan denah gedung dan pintu darurat.</li>\n<li>Waktu standar: <strong>チェックイン 14:00〜15:00</strong>, <strong>チェックアウト 10:00〜11:00</strong> (bisa berbeda tiap fasilitas).</li>\n<li>Menangani kebutuhan khusus: aksesibilitas kursi roda, protokol tamu VIP, dsb.</li>\n</ul>\n<figure class=\"pyramid-box\">\n<img class=\"ml-img\" data-file=\"alur_proses_checkin.svg\" alt=\"Alur proses check-in tamu di front desk\" loading=\"lazy\">\n<figcaption>Ilustrasi buatan sendiri — alur check-in: sambutan → konfirmasi reservasi → pendaftaran (宿帳) → serah kunci + penjelasan fasilitas.</figcaption>\n</figure>\n<table>\n<thead><tr><th>Waktu standar</th><th>Keterangan</th></tr></thead>\n<tbody>\n<tr><td>Check-in</td><td>Umumnya 14:00–15:00 (dapat berbeda per fasilitas)</td></tr>\n<tr><td>Check-out</td><td>Umumnya 10:00–11:00</td></tr>\n</tbody>\n</table>\n<div class=\"term-grid\">\n<div class=\"term\"><span class=\"ja\">身だしなみ</span><span class=\"ro\">midashinami</span><span class=\"arti\">kerapian penampilan</span></div>\n<div class=\"term\"><span class=\"ja\">宿泊台帳</span><span class=\"ro\">shukuhaku daichō</span><span class=\"arti\">buku/kartu registrasi tamu</span></div>\n<div class=\"term\"><span class=\"ja\">本人確認</span><span class=\"ro\">honnin kakunin</span><span class=\"arti\">verifikasi identitas</span></div>\n<div class=\"term\"><span class=\"ja\">ルームキー</span><span class=\"ro\">rūmu kī</span><span class=\"arti\">kunci kamar</span></div>\n</div>\n<div class=\"ml-note\">Serahkan kunci kamar dengan kedua tangan sambil menghadap tamu — detail sikap layanan ini dijelaskan lebih jauh di Bab 9 dan 10.</div>\n</div>", "5": "<div class=\"card\">\n<h3><span class=\"num\">5</span>Layanan &amp; Informasi Tamu Selama Menginap <span lang=\"ja\">・館内でのお客様対応と情報提供</span></h3>\n<p>Selama tamu menginap, front desk berperan sebagai pusat informasi dan koordinasi seluruh layanan dalam gedung (館内／kannai).</p>\n<h4>A. Penanganan Telepon di Dalam Gedung <span lang=\"ja\">・館内で行う電話対応</span></h4>\n<ul>\n<li>Berbicara jelas dan tidak terburu-buru (はっきりとゆっくり話す).</li>\n<li>Mengulang kembali pesanan room service untuk mencegah kesalahan.</li>\n<li>Membiarkan tamu menutup telepon lebih dulu sebelum staf menutupnya.</li>\n</ul>\n<h4>B. Pekerjaan Lain yang Perlu Dipahami Front Desk <span lang=\"ja\">・フロントが把握しておくべきほかの業務</span></h4>\n<p>Front desk perlu memahami garis besar tugas bagian lain agar bisa memberi informasi akurat ke tamu dan berkoordinasi dengan cepat:</p>\n<div class=\"term-grid\">\n<div class=\"term\"><span class=\"ja\">ドアマン業務</span><span class=\"ro\">doaman gyōmu</span><span class=\"arti\">tugas doorman — menyambut &amp; mengantar tamu di pintu masuk</span></div>\n<div class=\"term\"><span class=\"ja\">ハウスキーパー業務</span><span class=\"ro\">hausukīpā gyōmu</span><span class=\"arti\">tugas housekeeping — bersihkan kamar &amp; siapkan amenitas</span></div>\n<div class=\"term\"><span class=\"ja\">仲居業務</span><span class=\"ro\">nakai gyōmu</span><span class=\"arti\">tugas nakai (khusus ryokan) — pelayanan menyeluruh untuk tamu</span></div>\n<div class=\"term\"><span class=\"ja\">コンシェルジュ業務</span><span class=\"ro\">konsheruju gyōmu</span><span class=\"arti\">tugas concierge — informasi &amp; pengaturan acara/perjalanan tamu</span></div>\n</div>\n<h4>C. Penanganan di Kamar Tamu <span lang=\"ja\">・客室での対応</span></h4>\n<ul>\n<li>Selalu mengetuk pintu atau membunyikan bel sebelum masuk kamar.</li>\n<li>Meminta izin lisan dari tamu sebelum benar-benar masuk.</li>\n<li>Tidak pernah memberi tahu nomor kamar tamu kepada pihak lain tanpa persetujuan tamu tersebut (menjaga privasi/プライバシー).</li>\n</ul>\n<figure class=\"pyramid-box\">\n<img class=\"ml-img\" data-file=\"peta_layanan_dalam_hotel.svg\" alt=\"Peta koordinasi layanan dalam gedung penginapan\" loading=\"lazy\">\n<figcaption>Ilustrasi buatan sendiri — front desk sebagai pusat koordinasi doorman, housekeeping, nakai, restoran, dan concierge.</figcaption>\n</figure>\n<div class=\"ml-note\">Menjaga privasi tamu (nomor kamar, jadwal, tamu yang berkunjung) adalah aturan dasar yang berlaku sepanjang masa menginap, bukan hanya saat check-in.</div>\n</div>", "6": "<div class=\"card\">\n<h3><span class=\"num\">6</span>Proses Check-out &amp; Pembayaran <span lang=\"ja\">・チェックアウト・会計業務</span></h3>\n<h4>A. Konfirmasi Layanan &amp; Konsumsi Dalam Gedung <span lang=\"ja\">・館内でご利用したサービス、飲料などの確認</span></h4>\n<p>Sebelum menagih, staf memastikan semua biaya tambahan di luar paket dasar — disebut <strong>館内利用／kannai riyō</strong> (penggunaan fasilitas dalam gedung) — seperti minibar, pijat, atau room service sudah tercatat dengan benar.</p>\n<h4>B. Proses Pembayaran <span lang=\"ja\">・会計</span></h4>\n<ul>\n<li>Menerbitkan rincian tagihan (<strong>請求明細書／seikyū meisaisho</strong>).</li>\n<li>Memproses metode pembayaran yang dipilih tamu (tunai, kartu, e-money).</li>\n<li>Memberikan kuitansi (領収書／ryōshūsho) bila diminta.</li>\n<li>Budaya tip tidak berlaku di Jepang; biaya layanan sudah termasuk atau dipisah dalam tagihan.</li>\n<li>Beberapa daerah mengenakan pajak tambahan: <strong>宿泊税／shukuhakuzei</strong> (pajak penginapan) dan <strong>入湯税／nyūtōzei</strong> (pajak pemandian air panas/onsen).</li>\n</ul>\n<h4>C. Manajemen di Front Desk <span lang=\"ja\">・フロントにおけるマネジメント</span></h4>\n<p>Front desk juga berperan memantau indikator kinerja fasilitas:</p>\n<table>\n<thead><tr><th>Indikator</th><th>Arti</th></tr></thead>\n<tbody>\n<tr><td><strong>OCC</strong> (occupancy rate)</td><td>Jumlah kamar terisi ÷ total kamar × 100. Contoh: 70 kamar terisi dari 100 kamar = 70%.</td></tr>\n<tr><td><strong>ADR</strong> (Average Daily Rate)</td><td>Total pendapatan kamar ÷ jumlah kamar terjual — tarif rata-rata per kamar.</td></tr>\n<tr><td><strong>RevPAR</strong></td><td>OCC × ADR — pendapatan rata-rata per kamar yang tersedia.</td></tr>\n</tbody>\n</table>\n<p>Biaya lain yang juga dipantau: biaya tenaga kerja (人件費), biaya perlengkapan (備品費), dan komisi OTA (OTA手数料).</p>\n<h4>D. Penyimpanan Barang Tertinggal <span lang=\"ja\">・遺失物（忘れ物）の保管</span></h4>\n<p>Barang tertinggal (<strong>忘れ物／wasuremono</strong>) disimpan selama periode tertentu sesuai kebijakan fasilitas; jika pemilik tidak ditemukan dalam batas waktu tersebut, barang dilaporkan ke kantor polisi (警察).</p>\n<figure class=\"pyramid-box\">\n<img class=\"ml-img\" data-file=\"alur_checkout_pembayaran.svg\" alt=\"Alur proses check-out dan pembayaran tamu hotel\" loading=\"lazy\">\n<figcaption>Ilustrasi buatan sendiri — alur checkout: konfirmasi 館内利用 → cetak 請求明細書 → pembayaran → kuitansi → cek barang tertinggal.</figcaption>\n</figure>\n<div class=\"term-grid\">\n<div class=\"term\"><span class=\"ja\">請求明細書</span><span class=\"ro\">seikyū meisaisho</span><span class=\"arti\">rincian tagihan</span></div>\n<div class=\"term\"><span class=\"ja\">宿泊税</span><span class=\"ro\">shukuhakuzei</span><span class=\"arti\">pajak penginapan (daerah tertentu)</span></div>\n<div class=\"term\"><span class=\"ja\">忘れ物</span><span class=\"ro\">wasuremono</span><span class=\"arti\">barang tertinggal</span></div>\n<div class=\"term\"><span class=\"ja\">領収書</span><span class=\"ro\">ryōshūsho</span><span class=\"arti\">kuitansi</span></div>\n</div>\n</div>", "7": "<div class=\"card\">\n<h3><span class=\"num\">7</span>Pekerjaan Perencanaan <span lang=\"ja\">・企画業務</span></h3>\n<p><strong>企画業務／kikaku gyōmu</strong> (pekerjaan perencanaan) adalah proses merancang paket menginap, paket makan, dan acara (event) baru yang membuat tamu senang. Prosesnya memerlukan penentuan target pasar yang tepat, analisis kebutuhan lewat riset pemasaran (マーケティングリサーチ), lalu penyusunan proposal rencana secara strategis.</p>\n<h4>Contoh Target Pasar &amp; Paket</h4>\n<ul>\n<li>Wisatawan asing → paket \"menginap + pengalaman budaya Jepang lokal\".</li>\n<li>Tamu peduli kesehatan → paket \"menginap + makanan sehat berbahan lokal\".</li>\n<li>Tamu kelas atas → paket \"menginap kamar suite\".</li>\n</ul>\n<div class=\"ml-note\">Catatan hukum penting: menjual paket yang menggabungkan penginapan dengan transportasi menuju fasilitas memerlukan pendaftaran sebagai usaha perjalanan sesuai <strong>旅行業法／ryokō gyō hō</strong> (Undang-Undang Usaha Perjalanan). Menjualnya tanpa registrasi adalah pelanggaran hukum.</div>\n<h4>Istilah Perencanaan Penting</h4>\n<div class=\"term-grid\">\n<div class=\"term\"><span class=\"ja\">一泊二食</span><span class=\"ro\">ippaku nishoku</span><span class=\"arti\">1 malam 2 kali makan (makan malam + sarapan) — umum di ryokan</span></div>\n<div class=\"term\"><span class=\"ja\">連泊</span><span class=\"ro\">renpaku</span><span class=\"arti\">menginap berturut-turut 2 malam atau lebih, sering dapat diskon</span></div>\n<div class=\"term\"><span class=\"ja\">ウォークイン</span><span class=\"ro\">wōkuin</span><span class=\"arti\">tamu walk-in — datang tanpa reservasi lebih dulu</span></div>\n<div class=\"term\"><span class=\"ja\">預り金</span><span class=\"ro\">azukarikin</span><span class=\"arti\">uang deposit/jaminan untuk penggunaan layanan</span></div>\n</div>\n<h4>Manajemen Pendapatan <span lang=\"ja\">・レベニューマネジメント</span></h4>\n<p><strong>レベニューマネジメント／revenue management</strong> adalah pengendalian harga secara strategis untuk memaksimalkan keuntungan dengan memperhitungkan fluktuasi permintaan musiman dan posisi kompetitor. Terkait ini ada <strong>ダイナミックプライシング／dynamic pricing</strong>, yaitu penyesuaian tarif kamar secara real-time berdasarkan status pemesanan dan perkiraan tingkat hunian.</p>\n<figure class=\"pyramid-box\">\n<img class=\"ml-img\" data-file=\"siklus_perencanaan_paket.svg\" alt=\"Siklus perencanaan paket menginap dari riset pasar hingga peluncuran\" loading=\"lazy\">\n<figcaption>Ilustrasi buatan sendiri — siklus 企画業務: tentukan target → riset kebutuhan → susun proposal paket → luncurkan &amp; evaluasi.</figcaption>\n</figure>\n<table>\n<thead><tr><th>Metrik</th><th>Rumus</th></tr></thead>\n<tbody>\n<tr><td>OCC</td><td>kamar terisi ÷ total kamar × 100</td></tr>\n<tr><td>ADR</td><td>pendapatan kamar ÷ jumlah kamar terjual</td></tr>\n<tr><td>RevPAR</td><td>OCC × ADR</td></tr>\n</tbody>\n</table>\n</div>", "8": "<div class=\"card\">\n<h3><span class=\"num\">8</span>Pekerjaan Humas / Public Relations <span lang=\"ja\">・広報業務</span></h3>\n<p><strong>広報業務／kōhō gyōmu</strong> (pekerjaan humas) adalah menyebarkan informasi dan produk fasilitas kepada pemangku kepentingan (wisatawan, mitra bisnis, pemegang saham, karyawan, warga sekitar) untuk membangun hubungan baik dan meningkatkan nilai perusahaan. Menonjolkan kelebihan fasilitas membedakannya dari kompetitor dan memperkuat daya tarik bagi tamu.</p>\n<h4>A. Pengelolaan Situs Web Resmi <span lang=\"ja\">・自社ホームページの運用方法</span></h4>\n<ul>\n<li>Desain jelas dan navigasi mudah agar informasi cepat ditemukan.</li>\n<li>Informasi lengkap: tarif menginap, fasilitas kamar, fasilitas gedung, peta, cara akses, wisata sekitar.</li>\n<li>Foto dan video menarik untuk kamar, ruang umum, dan pemandangan sekitar.</li>\n<li>Sistem reservasi daring yang mudah digunakan langsung di situs.</li>\n<li>Optimasi mesin pencari (<strong>SEO</strong>) lewat strategi kata kunci dan kualitas konten.</li>\n<li>Mengumpulkan umpan balik tamu secara berkala untuk perbaikan.</li>\n<li>Memperbarui informasi rutin (harga, promosi, fasilitas).</li>\n</ul>\n<p>Riset menunjukkan jumlah paket yang ditampilkan sebaiknya sekitar <strong>6–15 paket</strong> untuk hasil reservasi langsung terbaik.</p>\n<h4>B. Pengelolaan Media Sosial <span lang=\"ja\">・SNSの運用方法</span></h4>\n<ol>\n<li><strong>Strategi konten</strong>: foto/video menarik fasilitas, info wisata &amp; acara lokal, info promosi.</li>\n<li><strong>Frekuensi posting</strong>: umumnya beberapa kali seminggu sampai setiap hari, disesuaikan pola audiens.</li>\n<li><strong>Aktivasi komunitas</strong>: merespons cepat pertanyaan/komentar tamu, memberi \"いいね\" dan komentar pada unggahan tamu.</li>\n<li><strong>Kolaborasi lokal</strong>: bermitra dengan dinas pariwisata dan bisnis setempat, saling tag dan promosi.</li>\n<li><strong>Konten buatan pengguna (UGC)</strong>: memanfaatkan foto/ulasan tamu, kampanye tagar (hashtag).</li>\n<li><strong>Analitik</strong>: memantau efektivitas posting dan tren follower, menyesuaikan strategi.</li>\n</ol>\n<h4>Konsep Humas Penting</h4>\n<div class=\"term-grid\">\n<div class=\"term\"><span class=\"ja\">ブランディング</span><span class=\"ro\">burandingu</span><span class=\"arti\">branding — menonjolkan keunikan &amp; menjaga pesan konsisten</span></div>\n<div class=\"term\"><span class=\"ja\">セグメンテーション</span><span class=\"ro\">segumentēshon</span><span class=\"arti\">segmentasi pasar berdasarkan kriteria tertentu</span></div>\n<div class=\"term\"><span class=\"ja\">ターゲティング</span><span class=\"ro\">tāgetingu</span><span class=\"arti\">targeting — memilih segmen bernilai tinggi</span></div>\n<div class=\"term\"><span class=\"ja\">口コミ</span><span class=\"ro\">kuchikomi</span><span class=\"arti\">word-of-mouth — ulasan/rekomendasi dari mulut ke mulut</span></div>\n</div>\n<figure class=\"pyramid-box\">\n<img class=\"ml-img\" data-file=\"kanal_promosi_humas_hotel.svg\" alt=\"Kanal promosi humas: situs web, SNS, dan ulasan tamu\" loading=\"lazy\">\n<figcaption>Ilustrasi buatan sendiri — kanal 広報業務: situs resmi, SNS, dan 口コミ (ulasan) saling memperkuat reputasi fasilitas.</figcaption>\n</figure>\n<div class=\"ml-note\">口コミ di situs OTA, situs ulasan, dan SNS sangat memengaruhi reputasi dan tingkat hunian — respons yang baik terhadap ulasan negatif juga bagian dari 広報業務.</div>\n</div>", "9": "<div class=\"card\">\n<h3><span class=\"num\">9</span>Dasar Pelayanan Tamu <span lang=\"ja\">・あいさつ・接客の基本姿勢とおじぎ・接客の際の話し方</span></h3>\n<p>Prinsip utama pelayanan tamu di Jepang adalah <strong>おもてなし／omotenashi</strong> (keramahtamahan tulus) sehingga tamu merasa <em>\"tomatte yokatta na\"</em> (senang telah menginap di sini).</p>\n<h4>1. Salam <span lang=\"ja\">・あいさつ</span></h4>\n<p>Ucapan salam wajib diberikan dengan <strong>明るく元気に笑顔で／akaruku genki ni egao de</strong> (cerah, bersemangat, dengan senyum) sambil menjaga kontak mata.</p>\n<div class=\"term-grid\">\n<div class=\"term\"><span class=\"ja\">いらっしゃいませ</span><span class=\"ro\">irasshaimase</span><span class=\"arti\">selamat datang</span></div>\n<div class=\"term\"><span class=\"ja\">ありがとうございました</span><span class=\"ro\">arigatō gozaimashita</span><span class=\"arti\">terima kasih banyak (setelah selesai)</span></div>\n<div class=\"term\"><span class=\"ja\">申し訳ございません</span><span class=\"ro\">mōshiwake gozaimasen</span><span class=\"arti\">mohon maaf (formal)</span></div>\n<div class=\"term\"><span class=\"ja\">お待たせいたしました</span><span class=\"ro\">omatase itashimashita</span><span class=\"arti\">maaf telah membuat menunggu</span></div>\n</div>\n<h4>2. Sikap Dasar &amp; Ojigi <span lang=\"ja\">・接客の基本姿勢とおじぎ</span></h4>\n<p>Sikap dasar: <strong>背筋を伸ばす</strong> (luruskan punggung), <strong>お腹を引く</strong> (tarik perut), <strong>肩の力を抜く</strong> (lemaskan bahu), dan selalu jaga ekspresi wajah alami dengan senyum.</p>\n<table>\n<thead><tr><th>Jenis ojigi (membungkuk)</th><th>Sudut</th><th>Digunakan untuk</th></tr></thead>\n<tbody>\n<tr><td><strong>会釈</strong> (eshaku)</td><td>~15°</td><td>Berpapasan dengan tamu di lorong</td></tr>\n<tr><td><strong>普通礼</strong> (futsūrei)</td><td>~30°</td><td>Salam standar menyambut/melayani</td></tr>\n<tr><td><strong>最敬礼</strong> (saikeirei)</td><td>~45°</td><td>Permintaan maaf atau perpisahan penting</td></tr>\n</tbody>\n</table>\n<h4>3. Cara Bicara <span lang=\"ja\">・接客の際の話し方</span></h4>\n<p>Layanan tamu memerlukan tiga ragam bahasa hormat sekaligus:</p>\n<table>\n<thead><tr><th>Kategori</th><th>Fungsi</th><th>Contoh</th></tr></thead>\n<tbody>\n<tr><td><strong>敬語</strong> (keigo)</td><td>Menghormati tamu</td><td>ご宿泊 (menginap — bentuk hormat)</td></tr>\n<tr><td><strong>丁寧語</strong> (teineigo)</td><td>Kesopanan umum</td><td>です／ます／ございます</td></tr>\n<tr><td><strong>謙譲語</strong> (kenjōgo)</td><td>Merendahkan diri pembicara</td><td>ungkapan merendah saat menyebut diri sendiri</td></tr>\n</tbody>\n</table>\n<figure class=\"pyramid-box\">\n<img class=\"ml-img\" data-file=\"tingkatan_ojigi_hormat.svg\" alt=\"Tiga tingkat ojigi: eshaku, futsurei, saikeirei\" loading=\"lazy\">\n<figcaption>Ilustrasi buatan sendiri — tiga sudut ojigi: 会釈 (15°), 普通礼 (30°), 最敬礼 (45°) beserta situasi penggunaannya.</figcaption>\n</figure>\n<div class=\"ml-note\">Bahasa hormat (敬語・丁寧語・謙譲語) dan sikap ojigi ini adalah fondasi yang dipakai di seluruh interaksi tamu — dari check-in, telepon, hingga layanan restoran.</div>\n</div>", "10": "<div class=\"card\">\n<h3><span class=\"num\">10</span>Metode Pelayanan Spesifik, Telepon &amp; Keluhan <span lang=\"ja\">・具体的な接客方法・電話対応・クレーム対応</span></h3>\n<h4>1. Metode Pelayanan Spesifik <span lang=\"ja\">・具体的な接客方法</span></h4>\n<ul>\n<li>Menyapa tamu yang tampak bingung dengan <strong>「何かお探しでしょうか」</strong> (Apakah ada yang bisa saya bantu carikan?).</li>\n<li>Berjalan 2–3 langkah di depan tamu, di sisi kiri, saat mengantar.</li>\n<li>Melakukan <strong>会釈</strong> (bungkuk ringan) saat berpapasan dengan tamu.</li>\n<li>Menjawab <strong>「お呼びでございますか」</strong> (Apakah Anda memanggil saya?) ketika dipanggil.</li>\n<li>Menyerahkan kunci kamar dengan kedua tangan sambil menghadap tamu langsung.</li>\n<li>Mendahulukan tamu saat menggunakan lift.</li>\n<li>Menyesuaikan layanan untuk tamu berkebutuhan khusus: pengguna alat bantu jalan, gangguan penglihatan/pendengaran, atau perbedaan budaya.</li>\n</ul>\n<h4>2. Penanganan Telepon <span lang=\"ja\">・電話対応</span></h4>\n<p>Prinsip dasar: bicara jelas dan tidak terburu-buru, ulangi kembali detail penting (misalnya pesanan atau jadwal) untuk konfirmasi, dan biarkan tamu menutup telepon lebih dulu sebagai bentuk sopan santun. Jika tidak bisa langsung membantu, staf mencatat detail dan menjanjikan akan melaporkan/menghubungi kembali.</p>\n<h4>3. Penanganan Keluhan <span lang=\"ja\">・クレーム（苦情）対応</span></h4>\n<p>Alur dasar menangani keluhan tamu:</p>\n<ol>\n<li><strong>謝罪／shazai</strong> — Minta maaf lebih dulu dengan tulus: <em>「申し訳ございません」</em>, tanpa menyalahkan tamu.</li>\n<li><strong>事実確認／jijitsu kakunin</strong> — Dengarkan dan pastikan kronologi kejadian secara akurat, jangan memotong pembicaraan tamu.</li>\n<li><strong>解決策の提示／kaiketsusaku no teiji</strong> — Tawarkan solusi konkret sesuai wewenang; jika di luar wewenang, segera laporkan ke atasan.</li>\n<li><strong>報告・記録／hōkoku, kiroku</strong> — Laporkan detail keluhan ke supervisor/tim terkait dan catat untuk mencegah kejadian berulang.</li>\n</ol>\n<figure class=\"pyramid-box\">\n<img class=\"ml-img\" data-file=\"alur_penanganan_komplain.svg\" alt=\"Alur empat langkah penanganan komplain tamu\" loading=\"lazy\">\n<figcaption>Ilustrasi buatan sendiri — alur クレーム対応: 謝罪 → 事実確認 → 解決策の提示 → laporan ke atasan/pencatatan.</figcaption>\n</figure>\n<div class=\"term-grid\">\n<div class=\"term\"><span class=\"ja\">クレーム</span><span class=\"ro\">kurēmu</span><span class=\"arti\">keluhan/komplain</span></div>\n<div class=\"term\"><span class=\"ja\">謝罪</span><span class=\"ro\">shazai</span><span class=\"arti\">permintaan maaf</span></div>\n<div class=\"term\"><span class=\"ja\">事実確認</span><span class=\"ro\">jijitsu kakunin</span><span class=\"arti\">konfirmasi/pengecekan fakta</span></div>\n<div class=\"term\"><span class=\"ja\">報告</span><span class=\"ro\">hōkoku</span><span class=\"arti\">pelaporan (ke atasan)</span></div>\n</div>\n<div class=\"ml-note\">Jangan pernah berdebat dengan tamu yang komplain — tenangkan situasi dulu, baru selesaikan masalahnya. Eskalasi ke supervisor adalah hal wajar, bukan kegagalan.</div>\n</div>", "11": "<div class=\"card\">\n<h3><span class=\"num\">11</span>Layanan Restoran <span lang=\"ja\">・レストランサービス</span></h3>\n<p>Bagian layanan restoran fasilitas penginapan mencakup sembilan topik utama menurut kurikulum resmi: gerakan dasar layanan, seragam &amp; penampilan, penanganan tamu, penyajian makanan/minuman, aturan dan sopan santun makan (masakan Jepang/Barat/lainnya), alergi makanan, keselamatan &amp; kebersihan, manajemen operasional restoran, dan istilah khusus.</p>\n<h4>Gerakan Dasar Layanan <span lang=\"ja\">・サービスの基本動作</span></h4>\n<ul>\n<li>Menyambut tamu di pintu restoran dan mengantar ke meja sesuai reservasi.</li>\n<li>Menuangkan minuman dari sisi kanan tamu, menyajikan makanan dari sisi kiri (aturan umum layanan Barat) — namun tetap sesuaikan kebiasaan fasilitas.</li>\n<li>Mengambil pesanan dengan mengulang kembali item dan catatan khusus (pedas/tidak pedas, alergi) untuk konfirmasi.</li>\n<li>Membersihkan piring kosong secara sigap tanpa mengganggu percakapan tamu.</li>\n</ul>\n<h4>Aturan &amp; Sopan Santun Makan <span lang=\"ja\">・食のルールやマナー（和食・洋食・その他）</span></h4>\n<p>Staf perlu memahami dasar tata cara hidangan Jepang (<strong>和食／washoku</strong>) seperti urutan penyajian dan cara memegang mangkuk/sumpit, maupun hidangan Barat (<strong>洋食／yōshoku</strong>) seperti urutan kursus (pembuka → sup → hidangan utama → penutup) dan tata letak peralatan makan, agar bisa membantu tamu asing yang belum familiar.</p>\n<h4>Alergi Makanan <span lang=\"ja\">・食物アレルギーについて</span></h4>\n<p>Staf wajib menanyakan dan mencatat alergi makanan tamu (アレルギー／arerugī) sebelum menyajikan hidangan, terutama untuk bahan yang wajib dicantumkan menurut standar keamanan pangan Jepang (misalnya udang, kepiting, gandum, telur, susu, kacang tanah).</p>\n<h4>Keselamatan, Kebersihan &amp; Manajemen Operasional</h4>\n<p>Sama seperti bagian lain fasilitas, restoran menerapkan standar kebersihan makanan (食品衛生) — suhu penyimpanan, batas waktu penyajian, kebersihan peralatan — serta manajemen operasional seperti pengaturan jadwal staf dan pengendalian stok bahan baku.</p>\n<figure class=\"pyramid-box\">\n<img class=\"ml-img\" data-file=\"urutan_layanan_restoran.svg\" alt=\"Urutan layanan restoran dari penyambutan hingga penutup\" loading=\"lazy\">\n<figcaption>Ilustrasi buatan sendiri — urutan layanan: sambut &amp; antar meja → catat pesanan (+alergi) → sajikan → bersihkan meja → antar tamu keluar.</figcaption>\n</figure>\n<div class=\"term-grid\">\n<div class=\"term\"><span class=\"ja\">和食</span><span class=\"ro\">washoku</span><span class=\"arti\">masakan Jepang</span></div>\n<div class=\"term\"><span class=\"ja\">洋食</span><span class=\"ro\">yōshoku</span><span class=\"arti\">masakan gaya Barat</span></div>\n<div class=\"term\"><span class=\"ja\">食物アレルギー</span><span class=\"ro\">shokumotsu arerugī</span><span class=\"arti\">alergi makanan</span></div>\n<div class=\"term\"><span class=\"ja\">配膳</span><span class=\"ro\">haizen</span><span class=\"arti\">penyajian/pengaturan hidangan di meja</span></div>\n</div>\n<div class=\"ml-note\">Selalu konfirmasi ulang pesanan dan informasi alergi sebelum hidangan keluar dari dapur — kesalahan di tahap ini bisa berakibat serius bagi keselamatan tamu.</div>\n</div>", "12": "<div class=\"card\">\n<h3><span class=\"num\">12</span>Pengetahuan Dasar Lainnya &amp; Istilah Kerja <span lang=\"ja\">・衛生管理・施設管理・環境対応など</span></h3>\n<p>Bab penutup ini merangkum sisa cakupan bagian 安全衛生管理・その他基礎知識 (manajemen keselamatan-kesehatan &amp; pengetahuan dasar lain) yang belum dibahas di Bab 1, ditambah kumpulan istilah kerja penting lintas bagian.</p>\n<h4>Manajemen Kebersihan <span lang=\"ja\">・衛生管理</span></h4>\n<p>Fasilitas wajib menjalankan <strong>清掃・消毒・害虫駆除／seisō, shōdoku, gaichū kujo</strong> (pembersihan, disinfeksi, pengendalian hama) secara berkala dan terjadwal, mencakup area kamar, koridor, dapur, hingga fasilitas pemandian bersama (大浴場／daiyokujō) yang berisiko pertumbuhan bakteri bila tidak dirawat rutin.</p>\n<h4>Manajemen Fasilitas <span lang=\"ja\">・施設管理</span></h4>\n<p>Perawatan rutin peralatan gedung (listrik, AC, lift, boiler air panas) perlu dijadwalkan agar tidak mengganggu kenyamanan tamu maupun keselamatan operasional. Pemeriksaan berkala (点検／tenken) dan pencatatan hasilnya adalah bagian standar dari 施設管理.</p>\n<h4>Respons Lingkungan <span lang=\"ja\">・環境対応</span></h4>\n<p>Fasilitas modern makin didorong menerapkan langkah ramah lingkungan: hemat energi (省エネ／shō-ene), pemilahan sampah (ゴミの分別／gomi no bunbetsu), dan kontribusi pada tujuan pembangunan berkelanjutan (SDGs) — misalnya mengurangi plastik sekali pakai di kamar tamu.</p>\n<h4>Kumpulan Istilah Kerja Perhotelan Penting</h4>\n<div class=\"term-grid\">\n<div class=\"term\"><span class=\"ja\">大浴場</span><span class=\"ro\">daiyokujō</span><span class=\"arti\">pemandian umum besar (fasilitas ryokan/onsen)</span></div>\n<div class=\"term\"><span class=\"ja\">仲居</span><span class=\"ro\">nakai</span><span class=\"arti\">staf pelayan khusus ryokan yang melayani tamu secara menyeluruh</span></div>\n<div class=\"term\"><span class=\"ja\">館内</span><span class=\"ro\">kannai</span><span class=\"arti\">di dalam gedung/area fasilitas</span></div>\n<div class=\"term\"><span class=\"ja\">点検</span><span class=\"ro\">tenken</span><span class=\"arti\">pemeriksaan/inspeksi berkala</span></div>\n<div class=\"term\"><span class=\"ja\">省エネ</span><span class=\"ro\">shō-ene</span><span class=\"arti\">hemat energi</span></div>\n<div class=\"term\"><span class=\"ja\">分別</span><span class=\"ro\">bunbetsu</span><span class=\"arti\">pemilahan (misalnya sampah)</span></div>\n</div>\n<figure class=\"pyramid-box\">\n<img class=\"ml-img\" data-file=\"glosarium_istilah_perhotelan.svg\" alt=\"Glosarium visual istilah kerja perhotelan penting\" loading=\"lazy\">\n<figcaption>Ilustrasi buatan sendiri — ringkasan visual istilah lintas bagian: 衛生管理, 施設管理, 環境対応, dan istilah kerja harian perhotelan.</figcaption>\n</figure>\n<table>\n<thead><tr><th>Aspek</th><th>Fokus utama</th></tr></thead>\n<tbody>\n<tr><td>衛生管理</td><td>Kebersihan rutin, disinfeksi, pengendalian hama</td></tr>\n<tr><td>施設管理</td><td>Perawatan &amp; pemeriksaan peralatan gedung</td></tr>\n<tr><td>環境対応</td><td>Hemat energi, pemilahan sampah, kontribusi SDGs</td></tr>\n</tbody>\n</table>\n<div class=\"ml-note\">Bab ini melengkapi Bab 1–11: keselamatan (Bab 1), hukum dasar (Bab 2), operasional front desk (Bab 3–6), perencanaan &amp; humas (Bab 7–8), pelayanan tamu (Bab 9–10), restoran (Bab 11), dan kebersihan/fasilitas/lingkungan (Bab 12) — bersama membentuk gambaran lengkap pekerjaan TG2 bidang 宿泊業.</div>\n</div>"};
  var chapterCache = {};
  function renderChapter(i, html){
    var el = root.querySelector('#ml-ch' + i);
    if (!el) return;
    el.innerHTML = html;
    el.querySelectorAll('img.ml-img[data-file]').forEach(function(img){ img.src = IMG_BASE + img.dataset.file; });
  }
  function loadChapter(i){
    if (chapterCache[i] != null) return Promise.resolve(chapterCache[i]);
    var html = MATERI_HTML[i] || '<div class="card"><p class="err">Materi bab ini belum tersedia.</p></div>';
    chapterCache[i] = html;
    renderChapter(i, html);
    return Promise.resolve(html);
  }
  function show(i, skipScroll){
    i = Math.max(1, Math.min(n, i));
    for (var k = 1; k <= n; k++){
      root.querySelector('#ml-ch' + k).classList.toggle('on', k === i);
    }
    tabs.forEach(function(t){ t.setAttribute('aria-selected', String(+t.dataset.go === i)); });
    root.dataset.chapter = i;
    loadChapter(i);
    if (!skipScroll) { try { root.scrollIntoView({behavior:'smooth', block:'start'}); } catch(e){} }
  }
  function initContent(){
    tabs.forEach(function(t){ t.addEventListener('click', function(){ show(+t.dataset.go); }); });
    links.forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); show(+a.dataset.go); }); });
    root.querySelector('#ml-prev').addEventListener('click', function(){ show((+root.dataset.chapter || 1) - 1); });
    root.querySelector('#ml-next').addEventListener('click', function(){ show((+root.dataset.chapter || 1) + 1); });
    show(1, true);
  }

  /* ---------------- Ikuti tema blog (terang/gelap) ---------------- */
  function syncTone(){
    var light = null;
    try {
      var c = document.createElement('canvas'); c.width = c.height = 1;
      var x = c.getContext('2d', { willReadFrequently: true });
      x.fillStyle = '#000'; x.fillStyle = getComputedStyle(root).color; x.fillRect(0, 0, 1, 1);
      var d = x.getImageData(0, 0, 1, 1).data;
      light = (0.2126 * d[0] + 0.7152 * d[1] + 0.0722 * d[2]) / 255 < 0.55;
    } catch(e){}
    if (light === null) light = !matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.tone = light ? 'light' : 'dark';
  }
  var kick = function(){ syncTone(); setTimeout(syncTone, 450); };
  var watch = { attributes: true, attributeFilter: ['class', 'data-theme', 'data-mode', 'data-color-scheme', 'style'] };
  try {
    new MutationObserver(kick).observe(document.documentElement, watch);
    new MutationObserver(kick).observe(document.body, watch);
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', kick);
  } catch(e){}
  syncTone();
})();
</script>

e="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 19H8C4 19 2 18 2 13V8C2 4 4 2 8 2H16C20 2 22 4 22 8V13C22 17 20 19 16 19H15.5C15.19 19 14.89 19.15 14.7 19.4L13.2 21.4C12.54 22.28 11.46 22.28 10.8 21.4L9.3 19.4C9.14 19.18 8.77 19 8.5 19Z"/><path d="M7 8h10M7 12h6"/></svg><span>Berita</span></a></nav></div><script src="/app.js"></script></body></html>
