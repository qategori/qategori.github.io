/* Aksara Jawa (Hanacaraka) untuk Blogger. Semua aturan di bawah .jv agar tidak bentrok dengan tema Median UI. Warna mengikuti variabel tema (terang/gelap otomatis). */
.jv{--jv-ink:var(--themeC,#0e2045);--jv-muted:var(--themeC-alt,rgba(14,32,69,.72));--jv-line:var(--themeBd-color,rgba(127,127,127,.35));--jv-surface:var(--contentBg-alt,rgba(127,127,127,.07));--jv-accent:var(--themeLink,#3740ff);--jv-on:var(--selectC,#fff);--jv-soga:#85521F;--jv-good:#17724A;--jv-good-bg:rgba(23,114,74,.12);--jv-bad:#B02E2B;--jv-bad-bg:rgba(176,46,43,.10);--jv-wash:rgba(127,127,127,.2)}

/* ===== Kartu hapalan ===== */
const K={cat:ls.get('sunda:kcat',''),mode:'belum',idx:0,flip:false,order:null,hp:ls.get('sunda:hp',[]),fv:ls.get('sunda:fv',[])};
const inSet=(a,id)=>a.indexOf(id)>-1;
function kList(){
  let l=VOC.filter(v=>!K.cat||v.c===K.cat);
  if(K.mode==='belum')l=l.filter(v=>!inSet(K.hp,v.id));
  else if(K.mode==='sudah')l=l.filter(v=>inSet(K.hp,v.id));
  else l=l.filter(v=>inSet(K.fv,v.id));
  if(K.order){const pos={};K.order.forEach((id,i)=>pos[id]=i);l=l.slice().sort((a,b)=>(pos[a.id]===undefined?1e6:pos[a.id])-(pos[b.id]===undefined?1e6:pos[b.id]));}
  return l;
}
function kCounts(){
  const base=VOC.filter(v=>!K.cat||v.c===K.cat);
  return {belum:base.filter(v=>!inSet(K.hp,v.id)).length,sudah:base.filter(v=>inSet(K.hp,v.id)).length,fav:base.filter(v=>inSet(K.fv,v.id)).length};
}
function altRow(v){
  const r=[];
  if(v.k)r.push(['Lemes',v.k]);
  if(v.i)r.push(['Lemes keur batur',v.i]);
  return r.map(x=>'<div class="jv-alt-row"><span class="jv-lab">'+x[0]+'</span>'+jw(tl(x[1]))+' <b>'+esc(rom(x[1]))+'</b></div>').join('');
}
function renderKartu(){
  const c=kCounts(),l=kList();
  if(K.idx>=l.length)K.idx=Math.max(0,l.length-1);
  const v=l[K.idx];
  let h='<div class="jv-bar-row"><select class="jv-sel" data-k="cat" aria-label="Kategori">'+opts(VCATS,K.cat,'Semua kategori')+'</select></div>';
  h+='<div class="jv-pills" role="group" aria-label="Daftar kartu">'+
    [['belum','Belum hapal',c.belum],['sudah','Sudah hapal',c.sudah],['fav','Favorit',c.fav]].map(m=>'<button type="button" class="jv-pill" data-kmode="'+m[0]+'" aria-pressed="'+(K.mode===m[0]?'true':'false')+'">'+m[1]+' <span>'+m[2]+'</span></button>').join('')+
    '<button type="button" class="jv-pill jv-pill-ghost" data-kact="acak">Acak</button></div>';
  h+='<p class="jv-count">'+(l.length?(K.idx+1):0)+' / '+l.length+'</p><div class="jv-prog"><i style="width:'+(l.length?((K.idx+1)/l.length*100):0)+'%"></i></div>';
  if(!v){
    h+='<div class="jv-fcard is-empty"><p>'+(K.mode==='belum'?'Semua kata di kategori ini sudah hapal.':K.mode==='sudah'?'Belum ada kata yang ditandai hapal.':'Belum ada kartu favorit.')+'</p></div>';
  }else{
    h+='<div class="jv-fcard'+(K.flip?' is-back':'')+'" role="button" tabindex="0" data-kact="flip" aria-label="Balik kartu">'+
      '<button type="button" class="jv-star" data-kact="fav" aria-label="Favorit" aria-pressed="'+(inSet(K.fv,v.id)?'true':'false')+'">'+svg('bintang')+'</button>'+
      '<span class="jv-cat">'+esc(v.c)+'</span>'+
      (K.flip
        ?'<p class="jv-fr">'+esc(rj(v.n))+'</p><p class="jv-fa">'+esc(v.a)+'</p>'+altRow(v)
        :'<p class="jw jv-ff">'+tl(v.n)+'</p>'+(prefs.rom?'<p class="jv-fh">'+esc(rj(v.n))+'</p>':'<p class="jv-fh">Ketuk untuk melihat arti</p>'))+
      '</div>';
    h+='<button type="button" class="jv-main" data-kact="hapal"'+(K.mode==='sudah'?' data-undo="1"':'')+'>'+(K.mode==='sudah'?'Kembalikan ke belum hapal':'Tandai hapal')+'</button>';
    h+='<div class="jv-nav2"><button type="button" class="jv-alt" data-kact="prev">Sebelumnya</button><button type="button" class="jv-main jv-main-s" data-kact="next">Berikutnya</button></div>';
  }
  view.innerHTML=h;
}
function kAct(a){
  const l=kList(),v=l[K.idx];
  if(a==='flip'){K.flip=!K.flip;}
  else if(a==='next'){if(l.length){K.idx=(K.idx+1)%l.length;K.flip=false;}}
  else if(a==='prev'){if(l.length){K.idx=(K.idx-1+l.length)%l.length;K.flip=false;}}
  else if(a==='acak'){K.order=shuffle(VOC.map(x=>x.id));K.idx=0;K.flip=false;}
  else if(a==='fav'&&v){const i=K.fv.indexOf(v.id);if(i>-1)K.fv.splice(i,1);else K.fv.push(v.id);ls.set('sunda:fv',K.fv);}
  else if(a==='hapal'&&v){
    const i=K.hp.indexOf(v.id);
    if(K.mode==='sudah'){if(i>-1)K.hp.splice(i,1);}else if(i<0)K.hp.push(v.id);
    ls.set('sunda:hp',K.hp);K.flip=false;
  }
  renderKartu();
}

    });
    h+='</ul>';
  }
  view.innerHTML=h;
  if(keepFocus){const i=$('.jv-inp');if(i){i.focus();const n=i.value.length;try{i.setSelectionRange(n,n);}catch(e){}}}
}

/* ===== Materi (level dimuat dari halaman masing-masing) ===== */
const LVN=[[5,'Level 5'],[4,'Level 4'],[3,'Level 3'],[2,'Level 2'],[1,'Level 1']];
const LVD={5:'Pemula: aksara ngalagena dan rarangk\u00e9n vokal',4:'Dasar: rarangk\u00e9n tungtung, pama\u00e9h, loma dan lemes',3:'Menengah: swara, r\u00e9kan, angka, lemes keur batur',2:'Menengah atas: pamingkal, panyakra, panyiku, imbuhan, kalimat',1:'Mahir: transliterasi kalimat, paribasa, bacaan'};
let lvSel=ls.get('sunda:lv',5),lvTok=0;
function renderMateri(){
  view.innerHTML='<div class="jv-pills jv-lvrow" role="tablist" aria-label="Level">'+
    LVN.map(l=>'<button type="button" class="jv-pill" role="tab" data-lv="'+l[0]+'" aria-pressed="'+(lvSel===l[0]?'true':'false')+'">'+l[1]+'</button>').join('')+'</div>'+
    '<p class="jv-lvd" id="sv-lvd">'+esc(LVD[lvSel])+'</p><div class="jv-embed" id="sv-embed"></div>';
  loadLevel(lvSel);
}
function fixLinks(host){
  $$('a[href]',host).forEach(a=>{
    const h=a.getAttribute('href')||'';
    const m=/\/p\/sunda(?:-level(\d))?\.html/.exec(h);
    if(m){a.setAttribute('data-jv-lv',m[1]||'hub');a.setAttribute('href','#');}
  });
}
async function loadLevel(n){
  const host=$('#sv-embed');if(!host)return;
  const my=++lvTok;
  host.innerHTML='<p class="jv-load">Memuat Level '+n+'...</p>';
  const fallback=()=>{host.innerHTML='<p class="jv-load">Materi belum bisa dimuat. <a href="/p/sunda-level'+n+'.html" data-jv-open="1">Buka halaman Level '+n+'</a></p>';};
  try{
    const r=await fetch('/p/sunda-level'+n+'.html',{credentials:'same-origin'});
    if(!r.ok)throw new Error(r.status);
    const html=await r.text();
    if(my!==lvTok)return;
    const d=new DOMParser().parseFromString(html,'text/html');
    const el=d.getElementById('jv-s'+n);
    if(!el)throw new Error('isi tidak ditemukan');
    host.innerHTML='';
    const scripts=[];
    Array.prototype.slice.call(el.parentNode.childNodes).forEach(nd=>{
      if(nd.nodeType!==1)return;
      if(nd.tagName==='SCRIPT'){scripts.push(nd);return;}
      if(nd.tagName==='STYLE'&&$('#sv-embed style',root)){return;}
      host.appendChild(document.importNode(nd,true));
    });
    scripts.forEach(sc=>{const s=document.createElement('script');s.text=sc.text||sc.textContent;host.appendChild(s);});
    fixLinks(host);
    new MutationObserver(()=>fixLinks(host)).observe(host,{childList:true,subtree:true});
  }catch(e){if(my===lvTok)fallback();}
}

/* ===== Bacaan ===== */
let rdSel='';
function lineHtml(t,a,spk){
  return '<div class="jv-ln">'+(spk?'<span class="jv-spk">'+esc(spk)+'</span>':'')+'<div class="jv-lb"><p class="jw jv-lj">'+tl(t)+'</p>'+(prefs.rom?'<p class="jv-lr">'+esc(rj(t))+'</p>':'')+(prefs.arti?'<p class="jv-la">'+esc(a)+'</p>':'')+'</div></div>';
}
function renderBacaan(){
  if(!rdSel){
    let h='<p class="jv-intro">Semua bacaan memakai aksara Sunda, lengkap dengan teks Latin. Nyalakan \u201cTampilkan arti\u201d untuk melihat terjemahannya.</p>';
    ['Cerita','Wayang','Lagu'].forEach(cat=>{
      h+='<div class="jv-h3" role="heading" aria-level="3">'+(cat==='Cerita'?'Cerita Sunda':cat==='Wayang'?'Kisah wayang golek':'Lagu Sunda')+'</div><ul class="jv-rlist">';
      READ.filter(r=>r.cat===cat).forEach(r=>{
        h+='<li><button type="button" class="jv-rcard" data-rd="'+r.id+'"><span class="jw jv-rj">'+tl(r.t)+'</span><span class="jv-rt">'+esc(r.t)+'</span><span class="jv-rs">'+r.lines.length+' baris</span></button></li>';
      });
      h+='</ul>';
    });
    view.innerHTML=h;
    return;
  }
  const r=READ.filter(x=>x.id===rdSel)[0];
  view.innerHTML='<button type="button" class="jv-back" data-rd="">&larr; Semua bacaan</button>'+
    '<div class="jv-h2" role="heading" aria-level="2">'+esc(r.t)+'</div><p class="jv-rn">'+esc(r.note)+'</p>'+switches()+
    '<div class="jv-lines">'+r.lines.map(l=>lineHtml(l[0],l[1])).join('')+'</div>';
}

/* ===== Percakapan ===== */
let dlSel=ls.get('sunda:dl','kenal'),dlReg=ls.get('sunda:reg','ng');
function renderObrolan(){
  const d=DLG.filter(x=>x.id===dlSel)[0]||DLG[0];
  const lines=dlReg==='kr'?d.kr:d.ng;
  view.innerHTML='<div class="jv-pills jv-lvrow" role="tablist" aria-label="Pilih percakapan">'+DLG.map(x=>'<button type="button" class="jv-pill" role="tab" data-dl="'+x.id+'" aria-pressed="'+(x.id===d.id?'true':'false')+'">'+esc(x.t)+'</button>').join('')+'</div>'+
    '<p class="jv-rn">'+esc(d.s)+'</p>'+
    '<div class="jv-seg" role="group" aria-label="Tingkat bahasa"><button type="button" data-reg="ng" aria-pressed="'+(dlReg==='ng'?'true':'false')+'">Loma</button><button type="button" data-reg="kr" aria-pressed="'+(dlReg==='kr'?'true':'false')+'">Lemes</button></div>'+
    switches()+
    '<div class="jv-lines">'+lines.map(l=>lineHtml(l[1],l[2],l[0])).join('')+'</div>'+
    '<p class="jv-hint">'+(dlReg==='ng'?'Loma dipakai antarteman atau kepada yang lebih muda.':'Lemes dipakai kepada orang yang lebih tua atau yang dihormati.')+' Coba bandingkan dengan versi satunya.</p>';
}

function render(keep){
  $$('[data-jv-tab]').forEach(b=>b.setAttribute('aria-selected',b.getAttribute('data-jv-tab')===tab?'true':'false'));
  view.removeAttribute('data-tab');view.setAttribute('data-tab',tab);
  if(tab==='kartu')renderKartu();
  else if(tab==='kosa')renderKosa(keep);
  else if(tab==='materi')renderMateri();
  else if(tab==='bacaan')renderBacaan();
  else renderObrolan();
}
function setTab(t,scroll){
  tab=t;ls.set('sunda:tab',t);render();
  if(scroll)root.scrollIntoView({block:'start'});
}

root.addEventListener('click',e=>{
  const t=e.target;
  const q=s=>t.closest?t.closest(s):null;
  let b;
  if((b=q('[data-jv-tab]'))){setTab(b.getAttribute('data-jv-tab'),false);return;}
  if((b=q('[data-sw]'))){const k=b.getAttribute('data-sw');prefs[k]=!prefs[k];ls.set('sunda:'+k,prefs[k]);render();return;}
  if((b=q('[data-jv-lv]'))){
    e.preventDefault();
    const v=b.getAttribute('data-jv-lv');
    if(v==='hub'){const x=$('.jv-subrow');if(x)x.scrollIntoView({block:'start'});}
    else{lvSel=parseInt(v,10);ls.set('sunda:lv',lvSel);renderMateri();const x=$('.jv-subrow');if(x)x.scrollIntoView({block:'start'});}
    return;
  }
  if((b=q('[data-lv]'))){lvSel=parseInt(b.getAttribute('data-lv'),10);ls.set('sunda:lv',lvSel);renderMateri();return;}
  if((b=q('[data-kmode]'))){K.mode=b.getAttribute('data-kmode');K.idx=0;K.flip=false;renderKartu();return;}
  if((b=q('[data-kact]'))){e.preventDefault();e.stopPropagation&&0;kAct(b.getAttribute('data-kact'));return;}
  if((b=q('[data-rd]'))){rdSel=b.getAttribute('data-rd');renderBacaan();root.scrollIntoView({block:'start'});return;}
  if((b=q('[data-dl]'))){dlSel=b.getAttribute('data-dl');ls.set('sunda:dl',dlSel);renderObrolan();return;}
  if((b=q('[data-reg]'))){dlReg=b.getAttribute('data-reg');ls.set('sunda:reg',dlReg);renderObrolan();return;}
});
root.addEventListener('change',e=>{
  const t=e.target;
  if(t.getAttribute('data-k')==='cat'){K.cat=t.value;ls.set('sunda:kcat',K.cat);K.idx=0;K.flip=false;renderKartu();}
  else if(t.getAttribute('data-s')==='cat'){S.cat=t.value;renderKosa();}
});
root.addEventListener('input',e=>{
  const t=e.target;
  if(t.getAttribute&&t.getAttribute('data-s')==='q'){S.q=t.value;renderKosa(true);}
});
root.addEventListener('keydown',e=>{
  const t=e.target;
  if(t.getAttribute&&t.getAttribute('data-kact')==='flip'&&(e.key==='Enter'||e.key===' ')&&t===e.currentTarget.querySelector('[data-kact="flip"]')){e.preventDefault();kAct('flip');}
});
render();

})();
