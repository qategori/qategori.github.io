/* Aksara Jawa (Hanacaraka) untuk Blogger. Semua aturan di bawah .jv agar tidak bentrok dengan tema Median UI. Warna mengikuti variabel tema (terang/gelap otomatis). */
.jv{--jv-ink:var(--themeC,#0e2045);--jv-muted:var(--themeC-alt,rgba(14,32,69,.72));--jv-line:var(--themeBd-color,rgba(127,127,127,.35));--jv-surface:var(--contentBg-alt,rgba(127,127,127,.07));--jv-accent:var(--themeLink,#3740ff);--jv-on:var(--selectC,#fff);--jv-soga:#85521F;--jv-good:#17724A;--jv-good-bg:rgba(23,114,74,.12);--jv-bad:#B02E2B;--jv-bad-bg:rgba(176,46,43,.10);--jv-wash:rgba(127,127,127,.2)}

.jv{display:block;max-width:720px;margin:0 auto;font-size:15px;line-height:1.6;color:var(--jv-ink);text-align:left;scroll-margin-top:calc(var(--headerHeight,56px) + 12px)}

.jv b{font-weight:700}
.jv p{margin:0}
.jv :is(.jv-tab,.jv-opt,.jv-main,.jv-alt,.jv-card):focus-visible{outline:3px solid var(--jv-accent);outline-offset:2px}

/* kepala halaman */
.jv .jv-top{padding:2px 0}
.jv .jv-hero{font-size:clamp(34px,10vw,48px);color:var(--jv-accent)}

.jv .jv-tab{all:unset;box-sizing:border-box;flex:1;margin-bottom:-1px;padding:11px 8px 9px;border-bottom:3px solid transparent;text-align:center;font-size:15px;font-weight:600;line-height:1.3;color:var(--jv-muted);cursor:pointer;-webkit-tap-highlight-color:transparent}

.jv .jv-panel{padding:18px 0 6px}

/* teks materi */
.jv .jv-h2{margin:0 0 6px;font-size:19px;line-height:1.3;font-weight:700}
.jv .jv-h2.jv-gap{margin-top:20px}
.jv .jv-intro{margin:0 0 12px;color:var(--jv-muted)}

/* L5: baris aksara */
.jv .jv-rows{display:flex;flex-direction:column;gap:10px}

.jv .jv-gloss{color:var(--jv-soga);font-weight:600}

.jv .jv-pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));padding:8px 6px;background:var(--jv-surface);border:1px solid var(--jv-line);border-radius:12px}
.jv .jv-pc{display:flex;flex-direction:column;align-items:center;min-width:0}

/* kuis */
.jv .jv-qhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px;color:var(--jv-muted);font-variant-numeric:tabular-nums;scroll-margin-top:calc(var(--headerHeight,56px) + 12px)}

.jv .jv-bar i{display:block;width:0;height:100%;background:var(--jv-accent);transition:width .25s}

.jv .jv-opts-glyph{grid-template-columns:repeat(2,minmax(0,1fr))}
.jv .jv-opt{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;min-height:56px;padding:10px 14px;background:var(--jv-surface);border:1.5px solid var(--jv-line);border-radius:12px;color:var(--jv-ink);font-size:15px;line-height:1.4;cursor:pointer;-webkit-tap-highlight-color:transparent}
.jv .jv-opt:hover{border-color:var(--jv-accent)}

.jv .jv-opt.is-locked:not(.is-correct):not(.is-wrong){opacity:.55}
.jv .jv-opt.is-correct{background:var(--jv-good-bg);border-color:var(--jv-good)}
.jv .jv-opt.is-correct .jv-tag{color:var(--jv-good)}
.jv .jv-opt.is-wrong{background:var(--jv-bad-bg);border-color:var(--jv-bad)}
.jv .jv-opt.is-wrong .jv-tag{color:var(--jv-bad)}
.jv .jv-fb{margin:14px 0;padding:12px 16px;background:var(--jv-surface);border:1px solid var(--jv-line);border-radius:12px}
.jv .jv-fb.is-good{border-color:var(--jv-good)}
.jv .jv-fb.is-bad{border-color:var(--jv-bad)}
.jv .jv-fbt{font-weight:700}

.jv .jv-fb.is-bad .jv-fbt{color:var(--jv-bad)}
.jv .jv-fbw{margin-top:4px}
.jv .jv-fbw .jw{font-size:24px}

/* hasil */
.jv .jv-result{scroll-margin-top:calc(var(--headerHeight,56px) + 12px)}

.jv ul.jv-wrongs{margin:0 0 22px;padding:0;list-style:none}

.jv .jv-rq{min-width:68px;max-width:42%;text-align:center;font-weight:700;overflow-wrap:anywhere}
.jv .jv-rq .jw{font-size:27px}
.jv .jv-ra{min-width:0;font-size:14px}
.jv .jv-ra .jw{font-size:22px}
.jv .jv-rb{display:block;color:var(--jv-muted)}

/* hub kartu level */
.jv ul.jv-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.jv ul.jv-cards li{margin:0;padding:0;min-width:0}
.jv .jv-card{display:flex;flex-direction:column;gap:8px;height:100%;min-width:0;padding:16px;background:var(--jv-surface);border:1px solid var(--jv-line);border-radius:14px;color:inherit;text-decoration:none}

.jv .jv-badge{padding:2px 9px;border:1px solid var(--jv-line);border-radius:99px;font-size:12.5px;line-height:1.6}
.jv .jv-cbest{font-size:13px;font-weight:600;color:var(--jv-soga)}

@media (prefers-reduced-motion:reduce){.jv .jv-bar i{transition:none}}
.jv .jv-pg.jv-ps{font-size:clamp(24px,7vw,32px);line-height:1.8;word-break:normal;overflow-wrap:anywhere}
.jv .jv-pl{text-align:left;line-height:1.55;font-weight:600}
.jv .jv-opts-glyph.jv-opts-wide{grid-template-columns:minmax(0,1fr)}

<script>
(function(){
'use strict';

const E='\u00e9', P='\u011b';
const PANG='\ua9c0';
const BASE={h:'\ua9b2',n:'\ua9a4',c:'\ua995',r:'\ua9ab',k:'\ua98f',d:'\ua9a2',t:'\ua9a0',s:'\ua9b1',w:'\ua9ae',l:'\ua9ad',p:'\ua9a5',dh:'\ua99d',j:'\ua997',y:'\ua9aa',ny:'\ua99a',m:'\ua9a9',g:'\ua992',b:'\ua9a7',th:'\ua99b',ng:'\ua994'};
const SIGN={a:'',i:'\ua9b6',u:'\ua9b8',[E]:'\ua9ba',[P]:'\ua9bc',o:'\ua9ba\ua9b4'};
const VOW=['a','i','u',E,P,'o'];
const FINS={r:'\ua982',ng:'\ua981',h:'\ua983'};
const FSET=['r','ng','h'];
const FINNAME={r:'layar',ng:'cecak',h:'wignyan'};
const STEMS=['h','n','c','r','k','d','t','s','w','l','p','dh','j','y','ny','m','g','b','th','ng'];
const PASSTEMS=STEMS.filter(s=>s!=='r'&&s!=='y');

const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);const t=a[i];a[i]=a[j];a[j]=t;}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jw=s=>'<span class="jw">'+s+'</span>';

/* token: syl (suku kata, boleh dengan panyigeg), fin (konsonan + pangkon di akhir kata), clu (konsonan mati + pasangan) */
function mkTok(t){
  if(t.k==='syl'){t.g=BASE[t.stem]+SIGN[t.v]+(t.fin?FINS[t.fin]:'');t.l=t.stem+t.v+(t.fin||'');}
  else if(t.k==='fin'){t.g=BASE[t.stem]+PANG;t.l=t.stem;}
  else{t.g=BASE[t.stem]+PANG+BASE[t.stem2]+SIGN[t.v]+(t.fin?FINS[t.fin]:'');t.l=t.stem+t.stem2+t.v+(t.fin||'');}
  return t;
}
const parseTok=s=>{
  let fin=null;
  if(s.indexOf('+')>-1){const a=s.split('+');s=a[0];fin=a[1];}
  if(s.slice(-1)==='.')return mkTok({k:'fin',stem:s.slice(0,-1)});
  if(s.indexOf('.')>-1){const a=s.split('.');return mkTok({k:'clu',stem:a[0],stem2:a[1].slice(0,-1),v:a[1].slice(-1),fin:fin});}
  return mkTok({k:'syl',stem:s.slice(0,-1),v:s.slice(-1),fin:fin});
};
const wordOf=(toks,arti)=>({toks:toks,g:toks.map(t=>t.g).join(''),l:toks.map(t=>t.l).join(''),arti:arti});
const mkWord=(spec,arti)=>wordOf(spec.split('-').map(parseTok),arti);

function variants(w){
  const structural=[],other=[];
  w.toks.forEach((t,i)=>{
    const rep=(arr,rt)=>{arr.push(wordOf(w.toks.slice(0,i).concat(rt,w.toks.slice(i+1)),''));};
    if(t.k==='syl'||t.k==='clu'){
      VOW.forEach(v=>{if(v!==t.v)rep(other,[mkTok(Object.assign({},t,{v:v}))]);});
      if(t.fin)FSET.forEach(f=>{if(f!==t.fin)rep(other,[mkTok(Object.assign({},t,{fin:f}))]);});
    }
    if(t.k==='fin'){
      rep(structural,[mkTok({k:'syl',stem:t.stem,v:'a',fin:null})]);
      ['n','k','l','t','m','p','s'].forEach(s=>{if(s!==t.stem)rep(other,[mkTok({k:'fin',stem:s})]);});
    }
    if(t.k==='clu'){
      rep(structural,[mkTok({k:'syl',stem:t.stem,v:'a',fin:null}),mkTok({k:'syl',stem:t.stem2,v:t.v,fin:t.fin})]);
    }
  });
  const seen={};seen[w.l]=1;
  const pick=[];
  const first=shuffle(structural).filter(x=>!seen[x.l])[0];
  if(first){seen[first.l]=1;pick.push(first);}
  shuffle(other).concat(shuffle(structural)).forEach(x=>{if(!seen[x.l]&&pick.length<3){seen[x.l]=1;pick.push(x);}});
  return pick;
}

const whyTok=t=>{
  if(t.k==='fin')return jw(t.g)+' = '+jw(BASE[t.stem])+' + pangkon. Pangkon mematikan vokal \u201ca\u201d, jadi hanya terdengar <b>'+t.l+'</b>.';
  return jw(t.g)+' = '+jw(BASE[t.stem]+SIGN[t.v])+' ('+t.stem+t.v+') + '+FINNAME[t.fin]+' (\u201c'+t.fin+'\u201d) \u2192 <b>'+t.l+'</b>.';
};
const whyWord=w=>{
  let s=w.toks.map(t=>jw(t.g)+' ('+t.l+')').join(' + ')+' \u2192 <b>'+w.l+'</b>, artinya \u201c'+w.arti+'\u201d.';
  const cl=w.toks.filter(t=>t.k==='clu');
  if(cl.length)s+=' Pasangan: '+cl.map(t=>t.stem+' + '+t.stem2).join(', ')+'.';
  return s;
};

function mk(sec,ask,prompt,correct,wrongs,glyph,why){
  const seen={};seen[correct]=1;
  const wr=[];
  wrongs.forEach(w=>{if(!seen[w]){seen[w]=1;wr.push(w);}});
  let arr=[{t:correct,ok:true}].concat(wr.slice(0,3).map(w=>({t:w,ok:false})));
  arr=shuffle(arr);
  let ans=0;
  arr.forEach((o,i)=>{if(o.ok)ans=i;o.glyph=glyph;});
  return {sec:sec,ask:ask,prompt:prompt,opts:arr,ans:ans,why:why};
}



const T_SIGN={a:'',i:'\ua9b6',u:'\ua9b8','\u00e9':'\ua9ba','\u00e8':'\ua9ba','\u011b':'\ua9bc',o:'\ua9ba\ua9b4'};
const T_MED={r:'\ua9bf',y:'\ua9be'};
const T_FIN={r:'\ua982',ng:'\ua981',h:'\ua983'};
const T_VOW='aiuo\u00e9\u00e8\u011b';
function tlWord(w){
  w=w.toLowerCase();
  const U=[];
  for(let i=0;i<w.length;){
    const d=w.substr(i,2);
    if(d==='ng'||d==='ny'||d==='dh'||d==='th'){U.push({c:d});i+=2;continue;}
    const ch=w.charAt(i);
    if(T_VOW.indexOf(ch)>-1){U.push({v:ch});i++;continue;}
    if(BASE[ch]){U.push({c:ch});i++;continue;}
    throw new Error('huruf tidak dikenal "'+ch+'" dalam "'+w+'"');
  }
  const runs=[],vows=[];let cur=[];
  U.forEach(u=>{if(u.c)cur.push(u.c);else{runs.push(cur);cur=[];vows.push(u.v);}});
  runs.push(cur);
  if(!vows.length)throw new Error('tanpa vokal: '+w);
  let out='',onset=runs[0];
  for(let j=0;j<vows.length;j++){
    let coda=[],nextOn=[];
    const R=runs[j+1],n=R.length;
    if(j===vows.length-1)coda=R;
    else if(n===1)nextOn=[R[0]];
    else if(n>1){
      const last=R[n-1],prev=R[n-2];
      if((last==='r'||last==='y')&&['r','ng','h','y'].indexOf(prev)<0){nextOn=[prev,last];coda=R.slice(0,n-2);}
      else{nextOn=[last];coda=R.slice(0,n-1);}
    }
    if(!onset.length)out+=BASE.h;
    else{
      out+=BASE[onset[0]];
      for(let k=1;k<onset.length;k++){
        const x=onset[k];
        out+=(x==='r'||x==='y')?T_MED[x]:(PANG+BASE[x]);
      }
    }
    out+=T_SIGN[vows[j]];
    coda.forEach((c,ci)=>{out+=(ci===0&&T_FIN[c])?T_FIN[c]:(BASE[c]+PANG);});
    onset=nextOn;
  }
  return out;
}
const tl=t=>t.replace(/[A-Za-z\u00e9\u00e8\u011b\u00c9\u00c8\u011a]+/g,tlWord).replace(/,/g,'\ua9c8').replace(/\./g,'\ua9c9').replace(/[?!"\u201c\u201d:;]/g,'');

      '<span class="jv-cat">'+esc(v.c)+'</span>'+
      (K.flip
        ?'<p class="jv-fr">'+esc(rj(v.n))+'</p><p class="jv-fa">'+esc(v.a)+'</p>'+altRow(v)
        :'<p class="jw jv-ff">'+tl(v.n)+'</p>'+(prefs.rom?'<p class="jv-fh">'+esc(rj(v.n))+'</p>':'<p class="jv-fh">Ketuk untuk melihat arti</p>'))+
      '</div>';
    h+='<button type="button" class="jv-main" data-kact="hapal"'+(K.mode==='sudah'?' data-undo="1"':'')+'>'+(K.mode==='sudah'?'Kembalikan ke belum hapal':'Tandai hapal')+'</button>';
    h+='<div class="jv-nav2"><button type="button" class="jv-alt" data-kact="prev">Sebelumnya</button><button type="button" class="jv-main jv-main-s" data-kact="next">Berikutnya</button></div>';
  }
  view.innerHTML=h;
}
function kAct(a){
  const l=kList(),v=l[K.idx];
  if(a==='flip'){K.flip=!K.flip;}
  else if(a==='next'){if(l.length){K.idx=(K.idx+1)%l.length;K.flip=false;}}
  else if(a==='prev'){if(l.length){K.idx=(K.idx-1+l.length)%l.length;K.flip=false;}}
  else if(a==='acak'){K.order=shuffle(VOC.map(x=>x.id));K.idx=0;K.flip=false;}
  else if(a==='fav'&&v){const i=K.fv.indexOf(v.id);if(i>-1)K.fv.splice(i,1);else K.fv.push(v.id);ls.set('jawa:fv',K.fv);}
  else if(a==='hapal'&&v){
    const i=K.hp.indexOf(v.id);
    if(K.mode==='sudah'){if(i>-1)K.hp.splice(i,1);}else if(i<0)K.hp.push(v.id);
    ls.set('jawa:hp',K.hp);K.flip=false;
  }
  renderKartu();
}

/* ===== Kosakata ===== */
const S={cat:'',q:''};
function renderKosa(keepFocus){
  const q=S.q.trim().toLowerCase();
  const l=VOC.filter(v=>(!S.cat||v.c===S.cat)&&(!q||(v.n+' '+rom(v.n)+' '+v.k+' '+v.i+' '+v.a).toLowerCase().indexOf(q)>-1||rom(v.n).toLowerCase().indexOf(q)>-1||rom(v.k).toLowerCase().indexOf(q)>-1));
  let h='<div class="jv-bar-row"><select class="jv-sel" data-s="cat" aria-label="Kategori">'+opts(VCATS,S.cat,'Semua kategori')+'</select></div>'+
    '<input class="jv-inp" type="search" data-s="q" placeholder="Cari kata atau arti" aria-label="Cari kosakata" value="'+esc(S.q)+'">'+
    '<p class="jv-count">'+l.length+' kata</p>';
  if(!l.length)h+='<p class="jv-empty">Tidak ada kata yang cocok.</p>';
  else{
    let last='';
    h+='<ul class="jv-vl">';
    l.forEach(v=>{
      if(!S.cat&&v.c!==last){h+='</ul><div class="jv-h3" role="heading" aria-level="3">'+esc(v.c)+'</div><ul class="jv-vl">';last=v.c;}
      h+='<li><div class="jv-vj">'+jw(tl(v.n))+'</div><div class="jv-vt"><b>'+esc(rj(v.n))+'</b><span>'+esc(v.a)+'</span>'+
        (v.k||v.i?'<div class="jv-vk">'+(v.k?'<span class="jv-tag2">Krama</span>'+jw(tl(v.k))+esc(rom(v.k)):'')+(v.i?'<span class="jv-tag2">Inggil</span>'+jw(tl(v.i))+esc(rom(v.i)):'')+'</div>':'')+
        '</div></li>';
    });
    h+='</ul>';
  }
  view.innerHTML=h;
  if(keepFocus){const i=$('.jv-inp');if(i){i.focus();const n=i.value.length;try{i.setSelectionRange(n,n);}catch(e){}}}
}

/* ===== Materi (level dimuat dari halaman masing-masing) ===== */
const LVN=[[5,'Level 5'],[4,'Level 4'],[3,'Level 3'],[2,'Level 2'],[1,'Level 1']];
const LVD={5:'Pemula: aksara nglegena dan sandhangan swara',4:'Dasar: panyigeg, pasangan, ngoko dan krama',3:'Menengah: murda, swara, r\u00e9kan, angka, krama inggil',2:'Menengah atas: cakra, pengkal, unggah-ungguh, ater-ater, panambang',1:'Mahir: transliterasi paragraf, saroja, parikan, wangsalan'};
let lvSel=ls.get('jawa:lv',5),lvTok=0;
function renderMateri(){
  view.innerHTML='<div class="jv-pills jv-lvrow" role="tablist" aria-label="Level">'+
    LVN.map(l=>'<button type="button" class="jv-pill" role="tab" data-lv="'+l[0]+'" aria-pressed="'+(lvSel===l[0]?'true':'false')+'">'+l[1]+'</button>').join('')+'</div>'+
    '<p class="jv-lvd" id="jv-lvd">'+esc(LVD[lvSel])+'</p><div class="jv-embed" id="jv-embed"></div>';
  loadLevel(lvSel);
}
function fixLinks(host){
  $$('a[href]',host).forEach(a=>{
    const h=a.getAttribute('href')||'';
    const m=/\/p\/jawa(?:-level(\d))?\.html/.exec(h);
    if(m){a.setAttribute('data-jv-lv',m[1]||'hub');a.setAttribute('href','#');}
  });
}
async function loadLevel(n){
  const host=$('#jv-embed');if(!host)return;
  const my=++lvTok;
  host.innerHTML='<p class="jv-load">Memuat Level '+n+'...</p>';
  const fallback=()=>{host.innerHTML='<p class="jv-load">Materi belum bisa dimuat. <a href="/p/jawa-level'+n+'.html" data-jv-open="1">Buka halaman Level '+n+'</a></p>';};
  try{
    const r=await fetch('/p/jawa-level'+n+'.html',{credentials:'same-origin'});
    if(!r.ok)throw new Error(r.status);
    const html=await r.text();
    if(my!==lvTok)return;
    const d=new DOMParser().parseFromString(html,'text/html');
    const el=d.getElementById('jv-l'+n);
    if(!el)throw new Error('isi tidak ditemukan');
    host.innerHTML='';
    const scripts=[];
    Array.prototype.slice.call(el.parentNode.childNodes).forEach(nd=>{
      if(nd.nodeType!==1)return;
      if(nd.tagName==='SCRIPT'){scripts.push(nd);return;}
      if(nd.tagName==='STYLE'&&$('#jv-embed style',root)){return;}
      host.appendChild(document.importNode(nd,true));
    });
    scripts.forEach(sc=>{const s=document.createElement('script');s.text=sc.text||sc.textContent;host.appendChild(s);});
    fixLinks(host);
    new MutationObserver(()=>fixLinks(host)).observe(host,{childList:true,subtree:true});
  }catch(e){if(my===lvTok)fallback();}
}

/* ===== Bacaan ===== */
let rdSel='';
function lineHtml(t,a,spk){
  return '<div class="jv-ln">'+(spk?'<span class="jv-spk">'+esc(spk)+'</span>':'')+'<div class="jv-lb"><p class="jw jv-lj">'+tl(t)+'</p>'+(prefs.rom?'<p class="jv-lr">'+esc(rj(t))+'</p>':'')+(prefs.arti?'<p class="jv-la">'+esc(a)+'</p>':'')+'</div></div>';
}
function renderBacaan(){
  if(!rdSel){
    let h='<p class="jv-intro">Semua bacaan memakai aksara Jawa, lengkap dengan romaji. Nyalakan \u201cTampilkan arti\u201d untuk melihat terjemahannya.</p>';
    ['Cerita','Wayang','Lagu'].forEach(cat=>{
      h+='<div class="jv-h3" role="heading" aria-level="3">'+(cat==='Cerita'?'Cerita Jawa':cat==='Wayang'?'Kisah wayang':'Lagu Jawa')+'</div><ul class="jv-rlist">';
      READ.filter(r=>r.cat===cat).forEach(r=>{
        h+='<li><button type="button" class="jv-rcard" data-rd="'+r.id+'"><span class="jw jv-rj">'+tl(r.t)+'</span><span class="jv-rt">'+esc(r.t)+'</span><span class="jv-rs">'+r.lines.length+' baris</span></button></li>';
      });
      h+='</ul>';
    });
    view.innerHTML=h;
    return;
  }
  const r=READ.filter(x=>x.id===rdSel)[0];
  view.innerHTML='<button type="button" class="jv-back" data-rd="">&larr; Semua bacaan</button>'+
    '<div class="jv-h2" role="heading" aria-level="2">'+esc(r.t)+'</div><p class="jv-rn">'+esc(r.note)+'</p>'+switches()+
    '<div class="jv-lines">'+r.lines.map(l=>lineHtml(l[0],l[1])).join('')+'</div>';
}

/* ===== Percakapan ===== */
let dlSel=ls.get('jawa:dl','kenal'),dlReg=ls.get('jawa:reg','ng');
function renderObrolan(){
  const d=DLG.filter(x=>x.id===dlSel)[0]||DLG[0];
  const lines=dlReg==='kr'?d.kr:d.ng;
  view.innerHTML='<div class="jv-pills jv-lvrow" role="tablist" aria-label="Pilih percakapan">'+DLG.map(x=>'<button type="button" class="jv-pill" role="tab" data-dl="'+x.id+'" aria-pressed="'+(x.id===d.id?'true':'false')+'">'+esc(x.t)+'</button>').join('')+'</div>'+
    '<p class="jv-rn">'+esc(d.s)+'</p>'+
    '<div class="jv-seg" role="group" aria-label="Tingkat bahasa"><button type="button" data-reg="ng" aria-pressed="'+(dlReg==='ng'?'true':'false')+'">Ngoko</button><button type="button" data-reg="kr" aria-pressed="'+(dlReg==='kr'?'true':'false')+'">Krama</button></div>'+
    switches()+
    '<div class="jv-lines">'+lines.map(l=>lineHtml(l[1],l[2],l[0])).join('')+'</div>'+
    '<p class="jv-hint">'+(dlReg==='ng'?'Ngoko dipakai antarteman atau kepada yang lebih muda.':'Krama dipakai kepada orang yang lebih tua atau yang dihormati.')+' Coba bandingkan dengan versi satunya.</p>';
}

function render(keep){
  $$('[data-jv-tab]').forEach(b=>b.setAttribute('aria-selected',b.getAttribute('data-jv-tab')===tab?'true':'false'));
  view.removeAttribute('data-tab');view.setAttribute('data-tab',tab);
  if(tab==='kartu')renderKartu();
  else if(tab==='kosa')renderKosa(keep);
  else if(tab==='materi')renderMateri();
  else if(tab==='bacaan')renderBacaan();
  else renderObrolan();
}
function setTab(t,scroll){
  tab=t;ls.set('jawa:tab',t);render();
  if(scroll)root.scrollIntoView({block:'start'});
}

root.addEventListener('click',e=>{
  const t=e.target;
  const q=s=>t.closest?t.closest(s):null;
  let b;
  if((b=q('[data-jv-tab]'))){setTab(b.getAttribute('data-jv-tab'),false);return;}
  if((b=q('[data-sw]'))){const k=b.getAttribute('data-sw');prefs[k]=!prefs[k];ls.set('jawa:'+k,prefs[k]);render();return;}
  if((b=q('[data-jv-lv]'))){
    e.preventDefault();
    const v=b.getAttribute('data-jv-lv');
    if(v==='hub'){const x=$('.jv-subrow');if(x)x.scrollIntoView({block:'start'});}
    else{lvSel=parseInt(v,10);ls.set('jawa:lv',lvSel);renderMateri();const x=$('.jv-subrow');if(x)x.scrollIntoView({block:'start'});}
    return;
  }
  if((b=q('[data-lv]'))){lvSel=parseInt(b.getAttribute('data-lv'),10);ls.set('jawa:lv',lvSel);renderMateri();return;}
  if((b=q('[data-kmode]'))){K.mode=b.getAttribute('data-kmode');K.idx=0;K.flip=false;renderKartu();return;}
  if((b=q('[data-kact]'))){e.preventDefault();e.stopPropagation&&0;kAct(b.getAttribute('data-kact'));return;}
  if((b=q('[data-rd]'))){rdSel=b.getAttribute('data-rd');renderBacaan();root.scrollIntoView({block:'start'});return;}
  if((b=q('[data-dl]'))){dlSel=b.getAttribute('data-dl');ls.set('jawa:dl',dlSel);renderObrolan();return;}
  if((b=q('[data-reg]'))){dlReg=b.getAttribute('data-reg');ls.set('jawa:reg',dlReg);renderObrolan();return;}
});
root.addEventListener('change',e=>{
  const t=e.target;
  if(t.getAttribute('data-k')==='cat'){K.cat=t.value;ls.set('jawa:kcat',K.cat);K.idx=0;K.flip=false;renderKartu();}
  else if(t.getAttribute('data-s')==='cat'){S.cat=t.value;renderKosa();}
});
root.addEventListener('input',e=>{
  const t=e.target;
  if(t.getAttribute&&t.getAttribute('data-s')==='q'){S.q=t.value;renderKosa(true);}
});
root.addEventListener('keydown',e=>{
  const t=e.target;
  if(t.getAttribute&&t.getAttribute('data-kact')==='flip'&&(e.key==='Enter'||e.key===' ')&&t===e.currentTarget.querySelector('[data-kact="flip"]')){e.preventDefault();kAct('flip');}
});
render();

})();
